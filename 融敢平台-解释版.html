<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>融敢平台 · 角色版 v1.1</title>
<style>
:root{
--sans:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
--mono:"SFMono-Regular",Consolas,"Liberation Mono",monospace;
--bg:#faf9f6; --bg2:#f4f3ef; --card:#fff; --card2:#fbfaf7;
--ink:#111820; --ink2:#3c454e; --ink3:#78838d; --ink4:#a5aeb5;
--line:#e2dfd7; --line2:#eeece6;
--accent:#d9541e; --accent2:#b94d2c; --accent-soft:#fcede7; --accent-line:#efc8b6;
--good:#2f7d54; --good-soft:#e8f4ed; --good-line:#bfdccb;
--warn:#a66a15; --warn-soft:#fbf4e7; --warn-line:#ebd9b6;
--bad:#ad3c32; --bad-soft:#fbefed; --bad-line:#e8c4be;
--info:#2c5f8a; --info-soft:#edf3f8; --info-line:#c6d8e7;
--r:8px; --r2:12px;
--shadow:0 1px 2px rgba(17,24,32,.04),0 8px 24px rgba(17,24,32,.05);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--sans);background:var(--bg);color:var(--ink);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font-family:inherit;font-size:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
::selection{background:var(--accent-line)}

/* ---------- landing ---------- */
.landing{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:48px 24px;background:
 radial-gradient(1100px 500px at 50% -10%,#fff 0%,var(--bg) 60%)}
.landing-brand{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.logo{width:40px;height:40px;border-radius:11px;background:linear-gradient(150deg,var(--accent),var(--accent2));color:#fff;display:grid;place-items:center;font-weight:600;font-size:18px;letter-spacing:.5px}
.landing h1{font-size:30px;font-weight:600;letter-spacing:-.4px}
.landing .sub{color:var(--ink3);margin-top:6px;font-size:15px}
.landing .hint{margin-top:34px;font-size:13px;color:var(--ink4);letter-spacing:.4px}
.roles{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-top:16px;width:100%;max-width:1100px}
.role{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:24px 22px 20px;text-align:left;transition:.18s;position:relative;overflow:hidden}
.role:hover{border-color:var(--accent-line);transform:translateY(-3px);box-shadow:0 12px 32px rgba(217,84,30,.1)}
.role .tag{font-family:var(--mono);font-size:11px;letter-spacing:.8px;color:var(--ink3);background:var(--bg2);border:1px solid var(--line2);padding:2px 7px;border-radius:5px}
.role .rname{font-size:20px;font-weight:600;margin:16px 0 4px}
.role .rdesc{font-size:13px;color:var(--ink3);line-height:1.6;min-height:44px}
.role .rmeta{margin-top:16px;padding-top:14px;border-top:1px dashed var(--line);font-size:12px;color:var(--ink3);display:flex;justify-content:space-between;align-items:center}
.role .arrow{color:var(--accent);font-size:16px}
.role.merged .tag{background:var(--accent-soft);border-color:var(--accent-line);color:var(--accent2)}
.land-bar{display:flex;gap:30px;margin-top:26px;flex-wrap:wrap;justify-content:center;font-size:12.5px;color:var(--ink3)}
.land-bar span{display:flex;align-items:center;gap:5px}
.land-bar span::before{content:"";width:5px;height:5px;border-radius:50%;background:var(--accent-line)}
.land-bar b{font-family:var(--mono);font-size:13px;color:var(--ink);font-weight:600}
.landing-foot{margin-top:40px;font-size:12px;color:var(--ink4);text-align:center}

/* ---------- shell ---------- */
.shell{display:grid;grid-template-columns:236px 1fr;height:100vh}
.side{background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column;overflow:hidden}
.side-top{padding:18px 18px 14px;border-bottom:1px solid var(--line2)}
.side-brand{display:flex;align-items:center;gap:9px}
.side-brand .logo{width:28px;height:28px;border-radius:8px;font-size:13px}
.side-brand b{font-size:15px;font-weight:600;letter-spacing:-.2px}
.side-role{margin-top:12px;display:flex;align-items:center;justify-content:space-between;background:var(--bg2);border-radius:8px;padding:8px 10px}
.side-role .who{font-size:13px;font-weight:500}
.side-role .who small{display:block;font-size:11px;color:var(--ink3);font-weight:400}
.side-role button{font-size:11px;color:var(--accent);border:1px solid var(--accent-line);background:#fff;padding:3px 7px;border-radius:5px}
.nav{flex:1;overflow-y:auto;padding:12px 10px 24px}
.nav-group{margin-top:14px}
.nav-group:first-child{margin-top:2px}
.nav-gt{font-size:11px;color:var(--ink4);letter-spacing:.6px;padding:0 10px 6px;font-weight:500}
.nav-item{display:flex;align-items:center;gap:9px;padding:9px 10px;border-radius:7px;font-size:14px;color:var(--ink2);cursor:pointer;margin-bottom:1px;transition:.12s;position:relative}
.nav-item:hover{background:var(--bg2);color:var(--ink)}
.nav-item.on{background:var(--accent-soft);color:var(--accent2);font-weight:500}
.nav-item.on::before{content:"";position:absolute;left:0;top:50%;transform:translateY(-50%);width:3px;height:16px;border-radius:2px;background:var(--accent)}
.nav-item .ni{width:16px;text-align:center;font-size:13px;color:var(--ink4)}
.nav-item.on .ni{color:var(--accent)}
.nav-badge{margin-left:auto;font-size:11px;background:var(--bad);color:#fff;border-radius:9px;padding:0 6px;line-height:16px;font-family:var(--mono)}
.side-foot{padding:10px 16px 14px;border-top:1px solid var(--line2);font-size:11px;color:var(--ink4);display:flex;justify-content:space-between}

.main{overflow-y:auto;background:var(--bg)}
.page{max-width:1440px;padding:26px 34px 60px}
.page-head{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;margin-bottom:20px}
.page-head h2{font-size:23px;font-weight:600;letter-spacing:-.3px}
.page-head p{font-size:13px;color:var(--ink3);margin-top:5px;max-width:760px}
.page-actions{display:flex;gap:8px;flex-shrink:0;flex-wrap:wrap}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 14px;border-radius:7px;font-size:13px;border:1px solid var(--line);background:#fff;color:var(--ink2);transition:.14s;white-space:nowrap}
.btn:hover{border-color:var(--ink4);color:var(--ink)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.pri:hover{background:var(--accent2);border-color:var(--accent2)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--bg2)}
.btn.sm{height:28px;padding:0 10px;font-size:12px}
.btn.xs{height:24px;padding:0 8px;font-size:12px;border-radius:5px}
.btn.danger{color:var(--bad);border-color:var(--bad-line)}
.btn.danger:hover{background:var(--bad-soft)}
.btn.dis,.btn[disabled]{opacity:.45;cursor:not-allowed;pointer-events:none}
/* 新建需求弹窗里的三块只读摘要 */
.ndbx{background:var(--card2);border:1px solid var(--line);border-radius:9px;padding:10px 12px}
.ndbx .lab{font-size:11.5px;color:var(--ink3)}
.ndbx .val{font-size:21px;font-weight:600;letter-spacing:-.4px;margin-top:3px;font-variant-numeric:tabular-nums}
.ndbx .val small{font-size:11px;font-weight:400;color:var(--ink4);margin-left:4px}
.ndbx .foot{font-size:11px;color:var(--ink4);margin-top:2px}
/* 本单调整：黄标 */
.adj{background:var(--warn-soft);border:1px solid var(--warn-line);color:var(--warn);border-radius:4px;font-size:10.5px;padding:0 5px;line-height:16px;white-space:nowrap}
.jd-p.adjed{border-left-color:var(--warn)}
.jd-p.adjed .tx{background:linear-gradient(90deg,var(--warn-soft),transparent 70%)}

/* ---------- cards ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r2);overflow:hidden}
.card-h{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--line2);gap:12px}
.card-h h3{font-size:15px;font-weight:600}
.card-h .sub{font-size:12px;color:var(--ink3);margin-top:2px}
.card-b{padding:18px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:1fr 1fr}
.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}
.span2{grid-column:span 2}

/* ---------- stats ---------- */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}
.stat{background:#fff;border:1px solid var(--line);border-radius:var(--r2);padding:16px 18px}
.stat .lab{font-size:12px;color:var(--ink3);display:flex;align-items:center;gap:6px}
.stat .val{font-size:27px;font-weight:600;letter-spacing:-.5px;margin-top:6px;font-variant-numeric:tabular-nums}
.stat .val small{font-size:13px;font-weight:400;color:var(--ink3);margin-left:4px}
.stat .foot{font-size:12px;color:var(--ink3);margin-top:4px}
.stat.accent .val{color:var(--accent)}

/* ---------- table ---------- */
.toolbar{display:flex;align-items:center;gap:9px;flex-wrap:wrap;padding:12px 16px;background:var(--card);border:1px solid var(--line);border-bottom:none;border-radius:var(--r2) var(--r2) 0 0}
.search{position:relative;flex:0 0 260px}
.search input{width:100%;height:32px;border:1px solid var(--line);border-radius:7px;padding:0 10px 0 30px;background:var(--bg);font-size:13px;outline:none}
.search input:focus{border-color:var(--accent-line);background:#fff}
.search span{position:absolute;left:10px;top:8px;color:var(--ink4);font-size:13px}
.sel{height:32px;border:1px solid var(--line);border-radius:7px;padding:0 8px;background:#fff;font-size:13px;color:var(--ink2);outline:none}
.toolbar .sp{flex:1}
.chip{display:inline-flex;align-items:center;gap:5px;height:26px;padding:0 10px;border-radius:20px;font-size:12px;border:1px solid var(--line);background:#fff;color:var(--ink2);cursor:pointer}
.chip.on{background:var(--accent-soft);border-color:var(--accent-line);color:var(--accent2);font-weight:500}

.tbl-wrap{background:#fff;border:1px solid var(--line);border-radius:0 0 var(--r2) var(--r2);overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13.5px}
thead th{text-align:left;font-weight:500;font-size:12px;color:var(--ink3);background:var(--card2);padding:10px 14px;border-bottom:1px solid var(--line);white-space:nowrap;letter-spacing:.2px}
tbody td{padding:12px 14px;border-bottom:1px solid var(--line2);vertical-align:middle}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover{background:var(--card2)}
tbody tr.clk{cursor:pointer}
.t-name{font-weight:500;color:var(--ink)}
.t-sub{font-size:12px;color:var(--ink3);margin-top:1px}
.num{font-variant-numeric:tabular-nums}
.acts{display:flex;gap:4px;flex-wrap:wrap}
.link{color:var(--accent);font-size:12.5px;cursor:pointer}
.link:hover{text-decoration:underline}
.empty{padding:44px;text-align:center;color:var(--ink4);font-size:13px}

/* ---------- badges ---------- */
.b{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;padding:2px 8px;border-radius:5px;border:1px solid transparent;white-space:nowrap;line-height:1.7}
.b.g{background:var(--good-soft);color:var(--good);border-color:var(--good-line)}
.b.w{background:var(--warn-soft);color:var(--warn);border-color:var(--warn-line)}
.b.r{background:var(--bad-soft);color:var(--bad);border-color:var(--bad-line)}
.b.i{background:var(--info-soft);color:var(--info);border-color:var(--info-line)}
.b.n{background:var(--bg2);color:var(--ink3);border-color:var(--line)}
.b.a{background:var(--accent-soft);color:var(--accent2);border-color:var(--accent-line)}
.tier{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:6px;font-family:var(--mono);font-size:12px;font-weight:600}
.tier.S{background:#5b3fb5;color:#fff}
.tier.A{background:#2f7d54;color:#fff}
.tier.B{background:#2c5f8a;color:#fff}
.tier.C{background:#a66a15;color:#fff}
.tier.D{background:#8d949a;color:#fff}
.dot{width:6px;height:6px;border-radius:50%;display:inline-block;margin-right:5px}
.tags{display:flex;gap:4px;flex-wrap:wrap}
.tg{font-size:11px;background:var(--bg2);border:1px solid var(--line2);color:var(--ink2);padding:1px 6px;border-radius:4px;white-space:nowrap}

/* ---------- progress ---------- */
.bar{height:6px;border-radius:3px;background:var(--line2);overflow:hidden;min-width:70px}
.bar>i{display:block;height:100%;border-radius:3px;background:var(--accent)}
.bar.g>i{background:var(--good)}
.bar.w>i{background:var(--warn)}
.barline{display:flex;align-items:center;gap:8px}
.barline .bar{flex:1}
.barline b{font-size:12px;font-family:var(--mono);color:var(--ink2);font-weight:500}

/* ---------- home blocks ---------- */
.pin-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.pin{border:1px solid var(--line);border-radius:11px;padding:15px 16px;background:#fff;position:relative;cursor:pointer;transition:.15s}
.pin:hover{border-color:var(--accent-line);box-shadow:var(--shadow)}
.pin .pt{display:flex;align-items:center;justify-content:space-between;gap:8px}
.pin .pn{font-size:14px;font-weight:600}
.pin .pc{font-size:12px;color:var(--ink3);margin-top:2px}
.pin .pbar{margin-top:12px}
.pin .pnums{display:flex;justify-content:space-between;font-size:12px;color:var(--ink3);margin-top:6px}
.pin .pnums b{color:var(--ink);font-family:var(--mono);font-weight:500}
.pin .pinbtn{position:absolute;top:12px;right:12px;font-size:11px;color:var(--ink4);opacity:0;transition:.15s}
.pin:hover .pinbtn{opacity:1}
.pin.pinned{border-color:var(--accent-line);background:linear-gradient(180deg,#fffdfb,#fff)}

.focus-item{display:flex;align-items:center;gap:11px;padding:12px 16px;border-bottom:1px solid var(--line2)}
.focus-item:last-child{border-bottom:none}
.focus-item .fi-ic{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;font-size:13px;flex-shrink:0}
.focus-item .fi-b{flex:1;min-width:0}
.focus-item .fi-t{font-size:13.5px;font-weight:500}
.focus-item .fi-s{font-size:12px;color:var(--ink3);margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.focus-item .fi-r{flex-shrink:0}

.contact-item{display:flex;align-items:center;gap:11px;padding:11px 16px;border-bottom:1px solid var(--line2)}
.contact-item:last-child{border-bottom:none}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--bg2);border:1px solid var(--line2);display:grid;place-items:center;font-size:12px;color:var(--ink2);flex-shrink:0;font-weight:500}
.ci-b{flex:1;min-width:0}
.ci-t{font-size:13.5px;font-weight:500}
.ci-s{font-size:12px;color:var(--ink3);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ci-r{font-size:11.5px;color:var(--ink4);text-align:right;flex-shrink:0;font-family:var(--mono)}

/* ---------- drawer ---------- */
.mask{position:fixed;inset:0;background:rgba(17,24,32,.32);z-index:60;opacity:0;pointer-events:none;transition:.2s}
.mask.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(760px,92vw);background:var(--bg);z-index:61;transform:translateX(100%);transition:.26s cubic-bezier(.32,.72,0,1);display:flex;flex-direction:column;box-shadow:-20px 0 60px rgba(17,24,32,.12)}
.drawer.on{transform:none}
.dr-h{padding:18px 24px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-shrink:0}
.dr-h h3{font-size:18px;font-weight:600}
.dr-h .sub{font-size:12.5px;color:var(--ink3);margin-top:3px}
.dr-x{font-size:20px;color:var(--ink3);width:30px;height:30px;border-radius:6px;display:grid;place-items:center}
.dr-x:hover{background:var(--bg2);color:var(--ink)}
.dr-b{flex:1;overflow-y:auto;padding:20px 24px 40px}
.dr-f{padding:12px 24px;border-top:1px solid var(--line);background:#fff;display:flex;justify-content:flex-end;gap:8px;flex-shrink:0}
.sec{margin-bottom:20px}
.sec-t{font-size:12px;color:var(--ink3);font-weight:500;letter-spacing:.4px;margin-bottom:9px;display:flex;align-items:center;gap:7px}
.sec-t::after{content:"";flex:1;height:1px;background:var(--line2)}
.kv{display:grid;grid-template-columns:repeat(2,1fr);gap:1px;background:var(--line2);border:1px solid var(--line2);border-radius:9px;overflow:hidden}
.kv>div{background:#fff;padding:10px 13px}
.kv dt{font-size:11.5px;color:var(--ink3)}
.kv dd{font-size:13.5px;margin-top:2px;font-weight:500}

/* progress card */
.flow{position:relative}
.flow-item{display:flex;gap:13px;padding-bottom:14px;position:relative}
.flow-item:last-child{padding-bottom:0}
.flow-item::before{content:"";position:absolute;left:13px;top:30px;bottom:0;width:1.5px;background:var(--line2)}
.flow-item:last-child::before{display:none}
.flow-item.done::before{background:var(--good-line)}
.fv{width:27px;height:27px;border-radius:50%;background:#fff;border:1.5px solid var(--line);display:grid;place-items:center;font-size:12px;color:var(--ink4);flex-shrink:0;z-index:1;font-family:var(--mono)}
.flow-item.done .fv{background:var(--good);border-color:var(--good);color:#fff}
.flow-item.now .fv{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 0 0 4px var(--accent-soft)}
.fb{flex:1;background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.flow-item.now .fb{border-color:var(--accent-line)}
.fb .ft{display:flex;align-items:center;justify-content:space-between;gap:10px}
.fb .fn{font-size:13.5px;font-weight:600}
.fb .fd{font-size:12px;color:var(--ink3);margin-top:3px;line-height:1.6}
.fb .fops{display:flex;gap:6px;margin-top:9px;flex-wrap:wrap}
.flow-item.todo .fb{background:var(--card2);border-style:dashed}
.flow-item.todo .fn{color:var(--ink3)}

/* timeline */
.tl{position:relative;padding-left:18px}
.tl::before{content:"";position:absolute;left:4px;top:6px;bottom:6px;width:1.5px;background:var(--line2)}
.tl-item{position:relative;padding-bottom:14px}
.tl-item:last-child{padding-bottom:0}
.tl-item::before{content:"";position:absolute;left:-18px;top:5px;width:7px;height:7px;border-radius:50%;background:var(--line);border:1.5px solid #fff;box-shadow:0 0 0 1px var(--line)}
.tl-item.hot::before{background:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.tl-d{font-size:11.5px;color:var(--ink4);font-family:var(--mono)}
.tl-t{font-size:13px;margin-top:1px}
.tl-s{font-size:12px;color:var(--ink3);margin-top:2px;line-height:1.5}

/* modal */
.modal{position:fixed;top:50%;left:50%;transform:translate(-50%,-46%) scale(.97);opacity:0;pointer-events:none;z-index:70;width:min(620px,92vw);background:#fff;border-radius:14px;box-shadow:0 24px 70px rgba(17,24,32,.18);transition:.2s;max-height:86vh;display:flex;flex-direction:column}
.modal.on{opacity:1;pointer-events:auto;transform:translate(-50%,-50%) scale(1)}
.md-h{padding:18px 22px 14px;border-bottom:1px solid var(--line2);display:flex;justify-content:space-between;align-items:flex-start}
.md-h h3{font-size:17px;font-weight:600}
.md-h p{font-size:12.5px;color:var(--ink3);margin-top:3px}
.md-b{padding:18px 22px;overflow-y:auto;flex:1}
.md-f{padding:13px 22px;border-top:1px solid var(--line2);display:flex;justify-content:flex-end;gap:8px;background:var(--card2);border-radius:0 0 14px 14px}
.field{margin-bottom:13px}
.field label{display:block;font-size:12.5px;color:var(--ink2);margin-bottom:5px;font-weight:500}
.field label i{color:var(--bad);font-style:normal;margin-left:2px}
.field input,.field select,.field textarea{width:100%;height:36px;border:1px solid var(--line);border-radius:7px;padding:0 11px;background:#fff;outline:none;font-size:13.5px}
.field textarea{height:78px;padding:9px 11px;resize:vertical;line-height:1.6}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent)}
.field .hint{font-size:11.5px;color:var(--ink4);margin-top:4px}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:12px}

/* misc */
.note{background:var(--info-soft);border:1px solid var(--info-line);border-radius:9px;padding:11px 14px;font-size:12.5px;color:var(--info);line-height:1.65}
.note.w{background:var(--warn-soft);border-color:var(--warn-line);color:var(--warn)}
.note.r{background:var(--bad-soft);border-color:var(--bad-line);color:var(--bad)}
.hr{height:1px;background:var(--line2);margin:16px 0}
.mono{font-family:var(--mono)}
.mut{color:var(--ink3)}
.sm{font-size:12.5px}
.xs{font-size:11.5px}
.tabbar{display:flex;gap:2px;padding:0 16px;background:#fff;border:1px solid var(--line);border-bottom:none;border-radius:var(--r2) var(--r2) 0 0}
.tab{padding:12px 14px;font-size:13.5px;color:var(--ink3);border-bottom:2px solid transparent;cursor:pointer;margin-bottom:-1px}
.tab.on{color:var(--accent2);border-bottom-color:var(--accent);font-weight:500}
.pager{display:flex;align-items:center;justify-content:space-between;padding:11px 16px;background:#fff;border:1px solid var(--line);border-top:none;border-radius:0 0 var(--r2) var(--r2);font-size:12.5px;color:var(--ink3)}
.pager .pgs{display:flex;gap:4px}
.pg{width:26px;height:26px;border-radius:6px;border:1px solid var(--line);display:grid;place-items:center;font-size:12px;background:#fff;cursor:pointer}
.pg.on{background:var(--accent);border-color:var(--accent);color:#fff}

/* worker phone */
.phone-wrap{display:flex;justify-content:center;padding:34px 0}
.phone{width:392px;height:790px;background:#fff;border-radius:36px;border:9px solid #1d2226;box-shadow:0 26px 60px rgba(17,24,32,.2);overflow:hidden;display:flex;flex-direction:column;position:relative}
.ph-status{height:38px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;font-size:12px;font-weight:500;flex-shrink:0}
.ph-body{flex:1;overflow-y:auto;background:#f7f6f2}
.ph-tabbar{height:56px;border-top:1px solid var(--line);display:flex;background:#fff;flex-shrink:0}
.ph-tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:10.5px;color:var(--ink4)}
.ph-tabbar button.on{color:var(--accent)}
.ph-head{background:#fff;padding:14px 18px;border-bottom:1px solid var(--line2)}
.ph-head h3{font-size:18px;font-weight:600}
.ph-head p{font-size:12px;color:var(--ink3);margin-top:2px}
.ph-card{background:#fff;border-radius:12px;padding:14px;margin:10px 14px;border:1px solid var(--line2)}
.ph-card h4{font-size:14px;font-weight:600;margin-bottom:2px}
.ph-card .pc-sub{font-size:12px;color:var(--ink3)}
.ph-kv{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:10px;font-size:12px;color:var(--ink2)}
.ph-btns{display:flex;gap:8px;margin-top:12px}
.ph-btn{flex:1;height:34px;border-radius:8px;border:1px solid var(--line);background:#fff;font-size:13px;color:var(--ink2)}
.ph-btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}

@media (max-width:1200px){.roles{grid-template-columns:repeat(2,1fr)}.g4,.stats{grid-template-columns:repeat(2,1fr)}.pin-grid{grid-template-columns:1fr 1fr}}
@media (max-width:900px){.shell{grid-template-columns:1fr}.side{display:none}.g2,.g3{grid-template-columns:1fr}}

/* ---------- 批量上传：逐人加投其他需求 ---------- */
.up-row{display:flex;align-items:center;gap:10px;padding:9px 11px;border:1px solid var(--line);border-radius:9px;background:#fff;margin-bottom:7px}
.up-row.skip{background:var(--bg2);border-color:var(--line);opacity:.72}
.up-row-main{flex:1;min-width:0}
.up-nm{font-size:13px;font-weight:600;line-height:1.4}
.up-mt{font-size:11.5px;color:var(--ink3);margin-top:2px;line-height:1.5}
.up-land{font-size:11.5px;color:var(--accent2);margin-top:3px;line-height:1.45}
.up-land b{font-family:var(--mono);font-weight:600}
.up-sel{height:30px;border:1px solid var(--line);border-radius:7px;font-size:12px;padding:0 6px;background:#fff;color:var(--ink);max-width:132px}
.up-sel:focus{border-color:var(--accent);outline:none}
.up-take{color:var(--accent);cursor:pointer;margin-left:3px;font-weight:600}
.up-take:hover{text-decoration:underline}
.up-sum{margin-top:12px;background:var(--bg2);border:1px solid var(--line);border-radius:9px;padding:10px 13px;line-height:1.6}

/* ================= v1.1 新增：档案详情 / AI 找候选人 / 上传渠道 / 沟通汇总 ================= */

/* 列表主体字段超链接（D 组规则：点姓名/编号进详情） */
.arc-link{cursor:pointer;border-bottom:1px dashed transparent;transition:.12s}
.arc-link:hover{color:var(--accent);border-bottom-color:var(--accent-line)}

/* 宽版弹窗：上传、AI 找候选人、记录联系 */
.modal.md-lg{width:min(880px,94vw)}
/* 抽屉压在弹窗之上（从弹窗里点人名看档案） */
.drawer.over{z-index:80}
.mask.over{z-index:75}

/* ---------- 渠道选择 ---------- */
.ch-pick{display:flex;flex-wrap:wrap;gap:7px}
.ch-opt{display:flex;flex-direction:column;align-items:flex-start;gap:1px;padding:7px 12px;border:1px solid var(--line);border-radius:9px;background:#fff;text-align:left;transition:.14s}
.ch-opt b{font-size:13px;font-weight:500}
.ch-opt:hover{border-color:var(--ink4)}
.ch-opt.on{border-color:var(--accent);background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent-line)}
.ch-opt.on b{color:var(--accent2)}
.up-batch{padding:8px 11px;background:var(--card2);border:1px solid var(--line);border-radius:8px;min-height:38px;display:flex;align-items:center;gap:6px}

/* ---------- 今日来源合计条 ---------- */
.ch-strip{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 14px;background:#fff;border:1px solid var(--line);border-radius:10px;margin-bottom:12px}
.cs-t{font-size:12px;color:var(--ink4);letter-spacing:.4px}
.cs-i{font-size:12.5px;background:var(--bg2);border:1px solid var(--line2);border-radius:20px;padding:2px 10px}
.cs-note{margin-left:auto;font-size:11.5px;color:var(--ink4)}

/* ---------- 档案详情 ---------- */
.arc-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding-bottom:12px;border-bottom:1px solid var(--line2)}
.arc-late{color:var(--bad);font-weight:500}
.arc-warn{color:var(--warn);font-weight:500}
.arc-tabs{display:flex;gap:2px;margin:14px 0 16px;border-bottom:1px solid var(--line2)}
.arc-tab{position:relative;padding:8px 12px 9px;font-size:13.5px;color:var(--ink3);cursor:pointer;display:flex;align-items:center;gap:6px;transition:.14s}
.arc-tab:hover{color:var(--ink)}
.arc-tab.on{color:var(--ink);font-weight:500}
.arc-tab.on::after{content:'';position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--accent);border-radius:2px 2px 0 0}
.vis{font-size:10.5px;font-style:normal;padding:1px 6px;border-radius:20px;letter-spacing:.2px;font-weight:400}
.vis.ok{background:var(--good-soft);color:var(--good);border:1px solid var(--good-line)}
.vis.no{background:#f1eef4;color:#6b5b7b;border:1px solid #ded6e6}

.res-file{display:flex;align-items:center;gap:10px;padding:9px 11px;border:1px solid var(--line);border-radius:9px;background:#fff;margin-bottom:7px}
.rf-kind{font-size:10.5px;padding:3px 6px;border-radius:5px;background:var(--bg2);color:var(--ink3);border:1px solid var(--line);font-family:var(--mono)}

.app-row{display:flex;align-items:center;gap:10px;padding:9px 11px;border:1px solid var(--line);border-radius:9px;margin-bottom:7px;background:#fff;cursor:pointer;transition:.12s}
.app-row:hover{border-color:var(--accent-line);background:var(--card2)}
.app-row.dim{opacity:.72}

/* ---------- 人才画像（判断层标签） ---------- */
.pt-dim{margin-bottom:12px}
.pt-dim-n{font-size:12px;color:var(--ink4);letter-spacing:.5px;margin-bottom:6px}
.pt-tag{border:1px solid var(--line);border-left:3px solid var(--info);border-radius:8px;padding:8px 11px;background:#fff;margin-bottom:6px}
.pt-tag.risk{border-left-color:var(--bad)}
.pt-tag.stale{opacity:.55;background:var(--bg2)}
.pt-h{display:flex;align-items:center;gap:7px}
.pt-h b{font-size:13.5px}
.pt-conf{font-size:10.5px;padding:1px 6px;border-radius:20px;border:1px solid transparent}
.pt-conf.ch{background:var(--good-soft);color:var(--good);border-color:var(--good-line)}
.pt-conf.cm{background:var(--warn-soft);color:var(--warn);border-color:var(--warn-line)}
.pt-conf.cl{background:var(--bg2);color:var(--ink3);border-color:var(--line)}
.pt-b{font-size:12.5px;color:var(--ink2);margin-top:3px}
.pt-m{font-size:11.5px;color:var(--ink4);margin-top:4px;font-family:var(--mono)}
.ev-row{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px dashed var(--line2)}
.ev-row:last-child{border-bottom:none}

/* ---------- 沟通汇总 ---------- */
.talk-sum{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.talk-sum>div{background:var(--card2);border:1px solid var(--line);border-radius:9px;padding:9px 11px;display:flex;flex-direction:column}
.talk-sum b{font-size:17px;font-weight:600;font-family:var(--mono);line-height:1.25}
.talk-sum span{font-size:11.5px;color:var(--ink4)}

/* ---------- AI 找候选人 ---------- */
.ai-pre{display:flex;gap:7px;margin:10px 0}
.ai-pre select{flex:1;padding:6px 9px;border:1px solid var(--line);border-radius:7px;background:#fff;font-size:12.5px}
.ai-flow{margin:10px 0}
.ai-stat{display:flex;align-items:center;gap:8px;background:var(--bg2);border:1px solid var(--line);border-radius:9px;padding:9px 12px;font-size:12.5px;flex-wrap:wrap}
.ai-stat b{font-family:var(--mono);font-size:13.5px}
.ai-stat .ar{color:var(--ink4)}
.ai-grp{margin-top:12px;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff}
.ai-grp-h{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--card2);border-bottom:1px solid var(--line2)}
.ai-row{display:flex;align-items:flex-start;gap:10px;padding:9px 12px;border-bottom:1px solid var(--line2)}
.ai-row:last-child{border-bottom:none}
.ai-row input[type=checkbox]{margin-top:3px;accent-color:var(--accent)}
.ai-score{text-align:right;min-width:44px}
.ai-score b{font-family:var(--mono);font-size:16px;display:block;line-height:1.1}
.ai-score span{font-size:10.5px;color:var(--ink4)}
.ai-pit{margin-top:4px;font-size:11.5px;color:var(--warn);background:var(--warn-soft);border:1px solid var(--warn-line);border-radius:6px;padding:3px 7px}

/* ---------- 记录联系：录音/截图 + AI 解析 ---------- */
.up-drop{border:1.5px dashed var(--line);border-radius:11px;padding:14px;background:var(--card2);text-align:left}
.up-drop .up-t{font-size:13px;font-weight:500}
.up-files{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}
.up-file{font-size:11.5px;background:#fff;border:1px solid var(--line);border-radius:7px;padding:4px 8px;display:flex;gap:6px;align-items:center}
.up-file i{font-style:normal;color:var(--ink4);font-family:var(--mono);font-size:10.5px}
.up-file b{font-size:10.5px;color:var(--good);font-weight:500}
.up-consent{display:flex;align-items:center;gap:7px;margin-top:9px;font-size:12px;color:var(--ink2);cursor:pointer}
.up-consent input{accent-color:var(--accent)}
.ai-res{border:1px solid var(--accent-line);border-radius:11px;background:var(--accent-soft);padding:11px 13px;margin:12px 0}
.ai-res-h{display:flex;align-items:center;font-size:13px;font-weight:500;margin-bottom:8px}
.ai-item{background:#fff;border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin-bottom:6px;display:flex;flex-direction:column;gap:5px}
.ai-q{font-size:12.5px;color:var(--ink2);font-style:italic}
.ai-v{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:12px}

/* 修正：transition:all 会把 z-index 当离散属性延迟生效，弹窗上叠抽屉时层级会晚半拍 */
.drawer{transition-property:transform}
.mask{transition-property:opacity}

/* 权限/可见性标记（放在区块标题右侧） */
.sec-t .perm{font-size:10.5px;font-weight:400;color:var(--info);background:var(--info-soft);border:1px solid var(--info-line);border-radius:20px;padding:1px 7px;margin-left:8px;letter-spacing:0}

/* 画像条目结构：三列定死的记录形态 */
.rec{font-family:var(--mono);font-size:11.5px;line-height:1.75;color:var(--ink2);background:var(--bg2);border:1px solid var(--line);border-radius:8px;padding:12px 14px;margin-top:10px;overflow-x:auto;white-space:pre}
.rec b{color:var(--ink);font-weight:500}
.rec .k{color:var(--info)}
.rec .s{color:var(--ok)}
.rec .m{color:var(--ink4)}
.fid{font-family:var(--mono);font-size:11.5px;font-weight:500;color:var(--info);background:var(--info-soft);border:1px solid var(--info-line);border-radius:5px;padding:2px 6px;cursor:pointer}
.fid:hover{background:var(--info-line)}

/* 编辑态：表单控件与锁定字段 */
.editbar{display:flex;gap:10px;align-items:center;background:var(--info-soft);border:1px solid var(--info-line);border-radius:8px;padding:8px 12px;font-size:12px;color:var(--info);margin-bottom:12px}
.ed-in{width:100%;height:30px;border:1px solid var(--line);border-radius:6px;padding:0 8px;background:#fff;font-size:12.5px;color:var(--ink);outline:none}
.ed-in:focus{border-color:var(--accent-line);box-shadow:0 0 0 2px var(--accent-soft)}
.ed-in.mono{font-family:var(--mono);font-size:12px}
select.ed-in{height:30px;padding:0 4px;cursor:pointer}
.ed-lock{display:flex;gap:10px;align-items:center;background:var(--bg2);border:1px dashed var(--line);border-radius:8px;padding:9px 12px;margin-bottom:10px;font-size:12.5px;color:var(--ink3)}
.ed-lock .lk{font-size:11px;color:var(--ink4);border:1px solid var(--line);border-radius:4px;padding:0 5px;flex-shrink:0}
.ed-lock b{color:var(--ink2);font-weight:500;font-family:var(--mono);font-size:12px}
.ed-del{color:var(--bad);cursor:pointer;font-size:12px;white-space:nowrap}
.ed-del:hover{text-decoration:underline}
.ed-add{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 12px;border:1px dashed var(--accent-line);border-radius:7px;color:var(--accent2);font-size:12.5px;cursor:pointer;background:var(--accent-soft)}
.ed-add:hover{background:#f9e2d8}
.ed-warn{background:var(--bad-soft);border:1px solid var(--bad-line);color:var(--bad);border-radius:8px;padding:8px 12px;font-size:12px;margin-top:10px}
.ed-ok{background:var(--good-soft);border:1px solid var(--good-line);color:var(--good);border-radius:8px;padding:8px 12px;font-size:12px;margin-top:10px}
.ed-pool{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;padding:10px;background:var(--card2);border:1px solid var(--line2);border-radius:8px}
.ed-pool .pitem{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border:1px solid var(--line);border-radius:16px;background:#fff;font-size:12px;color:var(--ink2);cursor:pointer}
.ed-pool .pitem:hover{border-color:var(--accent-line);color:var(--accent2);background:var(--accent-soft)}
.ed-pool .pitem b{font-family:var(--mono);font-size:11px;color:var(--info)}
.btn[disabled]{opacity:.45;cursor:not-allowed}

/* ===== 刻度尺：一条横轴上的三档，不是三个并列标签 ===== */
.ruler{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--card)}
.ruler .rl{position:relative;padding:13px 14px 14px;border-right:1px solid var(--line2);min-width:0}
.ruler .rl:last-child{border-right:none}
.ruler .rl:before{content:'';position:absolute;left:0;right:0;top:0;height:3px;background:#d8e3ec}
.ruler .rl.d2:before{background:#9dbfd8}
.ruler .rl.d3:before{background:#4f86ae}
.ruler .rl.gap{background:repeating-linear-gradient(135deg,#fff 0 7px,var(--bg2) 7px 14px)}
.ruler .rl.gap:before{background:repeating-linear-gradient(90deg,var(--warn-line) 0 6px,transparent 6px 12px)}
.ruler .rl-h{display:flex;align-items:baseline;gap:6px;margin-bottom:6px}
.ruler .rl-h b{font-family:var(--mono);font-size:13px;color:var(--info)}
.ruler .rl-h span{font-size:11px;color:var(--ink4);letter-spacing:.3px}
.ruler .rl-l{font-size:13px;font-weight:500;color:var(--ink);line-height:1.4}
.ruler .rl-m{font-family:var(--mono);font-size:11.5px;color:var(--accent2);margin-top:4px;min-height:17px;word-break:break-all}
.ruler .rl-d{font-size:11.5px;color:var(--ink3);margin-top:6px;line-height:1.55}
.ruler .rl-x{font-size:11.5px;color:var(--ink4);margin-top:6px;border-top:1px dashed var(--line2);padding-top:6px}
.ruler .rl-t{font-size:11px;color:var(--ink4);margin-top:3px}
.ruler .rl-a{display:flex;flex-wrap:wrap;gap:3px;margin-top:7px}
.ruler .rl-a em{font-style:normal;font-size:10.5px;color:var(--ink3);background:var(--bg2);border:1px solid var(--line2);border-radius:4px;padding:0 5px;line-height:16px}

/* 表内迷你刻度条 */
.mini{display:flex;gap:2px;margin-top:3px;max-width:58px}
.mini i{height:4px;flex:1;border-radius:1px;background:var(--line);display:block}
.mini i.on{background:var(--info)}
.mini i.gp{background:repeating-linear-gradient(90deg,var(--warn-line) 0 2px,transparent 2px 4px)}

/* ===== 岗位描述（JD）：一份可追溯的文档 ===== */
.jd-doc{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:22px 26px 20px;box-shadow:var(--shadow)}
.jd-doc-h{padding-bottom:14px;border-bottom:1px solid var(--line2);margin-bottom:4px}
.jd-doc-h h3{font-size:19px;font-weight:600;letter-spacing:-.2px}
.jd-doc-h .sub{font-size:12.5px;color:var(--ink3);margin-top:5px}
.jd-doc-h .meta{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}
.jd-sec{padding:16px 0 4px;border-bottom:1px dashed var(--line2)}
.jd-sec:last-child{border-bottom:none}
.jd-sec-t{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:600;color:var(--ink2);letter-spacing:.5px;margin-bottom:10px}
.jd-sec-t .n{font-family:var(--mono);font-size:10.5px;color:var(--ink4);font-weight:400;border:1px solid var(--line);border-radius:4px;padding:0 5px;line-height:15px}
.jd-sec-t .tagm{margin-left:auto;font-size:10.5px;font-weight:400;letter-spacing:0;color:var(--ink4)}
.jd-p{position:relative;display:flex;gap:12px;align-items:flex-start;padding:7px 0 7px 14px;border-left:2px solid var(--info-line)}
.jd-p+.jd-p{margin-top:2px}
.jd-p .tx{flex:1;min-width:0;font-size:13.5px;color:var(--ink);line-height:1.65}
.jd-p .tx em{font-style:normal;font-family:var(--mono);font-size:12px;color:var(--accent2);background:var(--accent-soft);border-radius:4px;padding:0 4px}
.jd-p .src{flex-shrink:0;padding-top:1px}
.jd-p .src .cd{font-family:var(--mono);font-size:10.5px;color:var(--info);background:var(--info-soft);border:1px solid var(--info-line);border-radius:4px;padding:1px 6px;cursor:pointer;white-space:nowrap}
.jd-p .src .cd:hover{background:var(--info-line)}
.jd-p .src .g{display:inline-block;font-size:10px;padding:1px 5px;border-radius:3px;margin-left:4px;vertical-align:1px}
.jd-p.free{border-left-color:var(--line);border-left-style:dashed}
.jd-p.free .tx{color:var(--ink2)}
.jd-p.free .src .cd{color:var(--ink4);background:var(--bg2);border-color:var(--line);border-style:dashed}
.jd-p.gap{border-left-color:var(--warn-line)}
.jd-p.gap .tx{color:var(--warn)}
.jd-p .lim{font-size:11.5px;color:var(--ink4);margin-top:3px}
.jd-cond{display:grid;grid-template-columns:88px 1fr;gap:0;border:1px solid var(--line2);border-radius:8px;overflow:hidden;margin-top:2px}
.jd-cond>div{padding:7px 11px;font-size:12.5px;border-bottom:1px solid var(--line2)}
.jd-cond>div:nth-child(odd){background:var(--bg2);color:var(--ink3);font-size:12px}
.jd-cond>div:nth-last-child(-n+2){border-bottom:none}
.jd-non{display:flex;flex-wrap:wrap;gap:6px;margin-top:2px}
.jd-non span{font-size:12px;color:var(--ink3);background:var(--bg2);border:1px solid var(--line2);border-radius:14px;padding:3px 10px;text-decoration:line-through;text-decoration-color:var(--line)}
/* 岗位描述 tab：一级 5 个封顶，因子域降为二级 chips；内容区独立滚动，头脚不动 */
.jd-tabbar{display:flex;gap:2px;border-bottom:1px solid var(--line);margin:2px 0 0;position:sticky;top:0;background:var(--card);z-index:2;flex-wrap:nowrap;overflow-x:auto}
.jd-tab{position:relative;padding:9px 12px 10px;font-size:13px;color:var(--ink3);cursor:pointer;white-space:nowrap;border-bottom:2px solid transparent;margin-bottom:-1px;display:flex;align-items:center;gap:5px}
.jd-tab:hover{color:var(--ink)}
.jd-tab.on{color:var(--accent2);border-bottom-color:var(--accent);font-weight:500}
.jd-tab .cnt{font-family:var(--mono);font-size:10px;font-style:normal;color:var(--ink4);background:var(--bg2);border-radius:8px;padding:0 5px;line-height:15px}
.jd-tab.on .cnt{background:var(--accent-soft);color:var(--accent2)}
.jd-tab .dot{width:5px;height:5px;border-radius:50%;background:var(--warn);position:absolute;top:7px;right:2px}
.jd-tabpane{max-height:calc(100vh - 360px);overflow-y:auto;padding:2px 2px 6px;scrollbar-width:thin}
.jd-chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 2px}
.jd-chips .chip{font-size:11.5px;padding:2px 9px;border-radius:12px;border:1px solid var(--line);background:var(--card2);color:var(--ink3);cursor:pointer}
.jd-chips .chip.on{background:var(--accent-soft);border-color:var(--accent-line,var(--accent));color:var(--accent2);font-weight:500}
.trace{display:flex;align-items:center;gap:10px;margin-top:12px;padding:10px 12px;background:var(--card2);border:1px solid var(--line);border-radius:8px}
.trace .bar{flex:1;height:6px;border-radius:3px;background:var(--line);overflow:hidden;display:flex}
.trace .bar i{display:block;height:100%}
.trace .bar .t1{background:var(--good)}
.trace .bar .t2{background:var(--warn-line)}
.trace .lb{font-size:11.5px;color:var(--ink3);white-space:nowrap}
.trace b{font-family:var(--mono);font-size:12px;color:var(--ink)}
.jd-switch{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden;background:var(--card)}
.jd-switch span{padding:4px 11px;font-size:12px;color:var(--ink3);cursor:pointer;border-right:1px solid var(--line)}
.jd-switch span:last-child{border-right:none}
.jd-switch span.on{background:var(--accent-soft);color:var(--accent2);font-weight:500}
.jd-card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin-bottom:12px;cursor:pointer;transition:.16s}
.jd-card:hover{border-color:var(--accent-line);box-shadow:0 6px 20px rgba(217,84,30,.08)}
.jd-card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:14px}
.jd-card h3{font-size:16px;font-weight:600;letter-spacing:-.1px}
.jd-card .scene{font-size:12px;color:var(--ink4);margin-top:4px}
.jd-card .intro{font-size:12.5px;color:var(--ink2);margin-top:9px;line-height:1.6}
.jd-card .badges{display:flex;gap:6px;flex-shrink:0;flex-wrap:wrap;justify-content:flex-end}
.jd-card .strip{display:flex;gap:3px;margin-top:11px}
.jd-card .strip i{height:5px;flex:1;border-radius:1px;background:var(--info-line);display:block}
.jd-card .strip i.fr{background:repeating-linear-gradient(135deg,var(--line) 0 3px,#fff 3px 6px)}
.jd-card .strip i.gp{background:var(--warn-line)}
.jd-card .strip-l{display:flex;justify-content:space-between;font-size:11px;color:var(--ink4);margin-top:5px}

/* ===== 岗位要素清单：批量选择 + 逐条调档 ===== */
.crumb{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink3);margin-bottom:12px;flex-wrap:wrap}
.crumb b{color:var(--ink);font-weight:500}
.el-sum{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-bottom:14px}
.el-bar{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:9px 13px;border-radius:9px;margin-bottom:10px;font-size:12.5px}
.el-bar.idle{background:var(--card);border:1px dashed var(--line);color:var(--ink4)}
.el-bar:not(.idle){background:var(--accent-soft);border:1px solid var(--accent-line);color:var(--accent2)}
.el-bar b{font-family:var(--mono);font-size:12px;font-weight:600}
.el-bar .bb{height:26px;padding:0 9px;border-radius:6px;border:1px solid var(--accent-line);background:#fff;color:var(--accent2);font-size:12px;white-space:nowrap;cursor:pointer}
.el-bar .bb:hover{border-color:var(--accent);background:#fff}
.el-bar .bb.dg{border-color:var(--bad-line);color:var(--bad)}
.el-bar .bb.dg:hover{border-color:var(--bad)}
.el-check{width:14px;height:14px;accent-color:var(--accent);cursor:pointer;vertical-align:middle}
tr.el-pick td, tr.el-pick:hover td{background:var(--accent-soft)}
.el-tab-body{margin-bottom:14px}
.el-pickbox{margin-top:12px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.el-pool-h{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:9px}
.el-pool-t{font-size:13px;font-weight:500}
.el-pool-list{display:flex;flex-direction:column;border:1px solid var(--line2);border-radius:8px;overflow-y:auto;max-height:300px;background:#fff}
.el-pool-row{display:flex;align-items:center;gap:9px;padding:8px 11px;border-bottom:1px solid var(--line2);cursor:pointer;transition:.12s}
.el-pool-row:last-child{border-bottom:none}
.el-pool-row:hover{background:var(--card2)}
.el-pool-row.on{background:var(--accent-soft)}
.el-pool-row>b{font-family:var(--mono);font-size:11px;font-weight:500;color:var(--info);background:var(--info-soft);border:1px solid var(--info-line);border-radius:4px;padding:1px 5px;flex-shrink:0}
.el-pool-row .nm{flex:1;min-width:0;font-size:12.5px;color:var(--ink)}
.el-pool-row .mt{font-size:11px;color:var(--ink4);margin-top:1px}
.el-pool-f{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:10px;padding-top:10px;border-top:1px dashed var(--line)}
.el-src{font-size:10px;font-family:var(--mono);border-radius:4px;padding:0 5px;line-height:15px;border:1px solid var(--line);color:var(--ink3);background:var(--bg2);font-weight:400;vertical-align:1px}
.el-src.f{color:var(--good);background:var(--good-soft);border-color:var(--good-line)}
.el-src.p{color:var(--warn);background:var(--warn-soft);border-color:var(--warn-line)}

/* ===== 要素清单 v2：只勾字段（域 → 组 → 字段块） ===== */
.el-dom{background:var(--card);border:1px solid var(--line);border-radius:10px;margin-bottom:12px;overflow:hidden}
.el-dom-h{display:flex;align-items:center;gap:9px;padding:9px 13px;background:var(--bg2);border-bottom:1px solid var(--line2);font-size:13px}
.el-dom-h b{font-weight:600}
.el-dom-m{font-family:var(--mono);font-size:11px;width:19px;height:19px;border-radius:5px;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:600}
.el-grp{padding:10px 13px;border-bottom:1px dashed var(--line2)}
.el-grp:last-child{border-bottom:none}
.el-grp-h{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.el-grp-h b{font-size:12px;font-weight:600;color:var(--ink2);letter-spacing:.2px}
.el-grp-a{font-size:11.5px;color:var(--accent);border:1px solid var(--accent-line);background:#fff;border-radius:5px;padding:1px 7px;cursor:pointer;white-space:nowrap}
.el-grp-a:hover{background:var(--accent-soft)}
.el-fields{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:6px}
.el-f{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:7px;padding:6px 8px;cursor:pointer;background:var(--card2);transition:.12s;min-width:0}
.el-f:hover{border-color:var(--accent-line)}
.el-f.on{background:var(--accent-soft);border-color:var(--accent-line)}
.el-no{font-family:var(--mono);font-size:10.5px;color:var(--ink4);flex-shrink:0;min-width:14px}
.el-f.on .el-no{color:var(--accent2)}
.el-fn{font-size:12px;color:var(--ink);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.el-f.on .el-fn{color:var(--accent2);font-weight:500}
.el-meta{font-size:10px;color:var(--ink4);flex-shrink:0;white-space:nowrap}
.el-f.on .el-meta{color:var(--accent2);opacity:.75}

/* ===== 标准岗位：左字段 / 中值 / 右原话 ===== */
.sj-tbl td{padding:7px 10px;vertical-align:middle;border-bottom:1px solid var(--line2)}
.sj-tbl tr:last-child td{border-bottom:none}
.sj-tbl td:first-child{width:39%}
.sj-tbl td:nth-child(2){width:26%}
.sj-tbl td:nth-child(3){width:35%}

/* ===== 数据字典：一张表 ===== */
.chips{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.field .dd-ta{height:168px;font-family:var(--mono);font-size:12.5px;line-height:1.75}

/* ---------- 客户需求确认（左原话 / 右解析） ---------- */
.cc-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:14px;align-items:start}
.cc-col{display:flex;flex-direction:column;gap:10px;min-width:0}
.cc-card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 15px}
.cc-t{font-size:12.5px;font-weight:600;color:var(--ink2);margin-bottom:10px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.cc-t .xs{font-weight:400}
.cc-ta{width:100%;min-height:96px;border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:13px;font-family:inherit;line-height:1.7;resize:vertical;background:var(--card2);color:var(--ink)}
.cc-ta:focus{outline:none;border-color:var(--accent);background:#fff}
.cc-row{display:flex;gap:8px;margin-top:8px;align-items:center}
.seg{background:var(--card2);border:1px solid var(--line2);border-radius:9px;padding:10px 12px}
.seg-h{display:flex;align-items:center;gap:8px;margin-bottom:5px}
.dimblk{margin-bottom:14px}
.dim-t{font-size:11.5px;font-weight:600;color:var(--ink3);letter-spacing:.4px;margin-bottom:7px;display:flex;align-items:center;gap:7px}
.cc-item{border-left:2px solid var(--info-line);padding:7px 0 7px 10px}
.cc-item+.cc-item{margin-top:4px}
.cc-item.vague,.cc-item.miss{border-left-color:var(--warn-line)}
.cc-item.none{border-left-color:var(--bad-line)}
.stb{font-size:10.5px;border-radius:4px;padding:1px 6px;line-height:16px;white-space:nowrap;font-weight:500;border:1px solid transparent}
.stb.g{background:var(--good-soft);color:var(--good);border-color:var(--good-line)}
.stb.w{background:var(--warn-soft);color:var(--warn);border-color:var(--warn-line)}
.stb.r{background:var(--bad-soft);color:var(--bad);border-color:var(--bad-line)}
.script{background:var(--card2);border:1px solid var(--line);border-radius:9px;padding:14px 16px;font-family:var(--sans);font-size:13px;line-height:1.85;white-space:pre-wrap;word-break:break-word;margin:0;color:var(--ink)}
.ovrow{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--line2)}
@media(max-width:900px){.cc-grid{grid-template-columns:1fr}}

/* =============================================================
   2026-11-14 · 首页宽表 / 行内编辑 / 人详情四页签
   ============================================================= */
.sp{flex:1}

/* ---------- 可点统计卡 ---------- */
.stat.clkable{cursor:pointer;transition:.14s}
.stat.clkable:hover{border-color:var(--accent-line);background:var(--card2)}
.stat.clkable.hot{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent-line);background:var(--accent-soft)}
.stat.clkable.hot .val{color:var(--accent)}

/* ---------- 行内可编辑单元格 ---------- */
.ed-in{width:100%;height:28px;border:1px solid var(--line);border-radius:6px;padding:0 7px;
  font-size:12.5px;font-family:inherit;background:#fff;color:var(--ink);min-width:0}
.ed-in:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
select.ed-in{padding:0 4px;cursor:pointer}
.hd-ed{cursor:pointer;position:relative}
.hd-ed:hover{background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent-line)}
.hd-ed::after{content:'改';position:absolute;right:3px;top:2px;font-size:8.5px;color:var(--accent);
  opacity:0;transition:.12s}
.hd-ed:hover::after{opacity:.75}

/* ---------- 首页排序条 ---------- */
.hd-sort{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:10px;
  background:var(--card2);border:1px solid var(--line2);border-radius:8px;padding:7px 10px}
.hd-sbtn{border:1px solid var(--line);background:#fff;border-radius:6px;padding:3px 9px;
  font-size:12px;color:var(--ink2);cursor:pointer;display:inline-flex;align-items:center;gap:3px;transition:.12s}
.hd-sbtn:hover{border-color:var(--accent-line);color:var(--accent)}
.hd-sbtn.on{background:var(--accent-soft);border-color:var(--accent-line);color:var(--accent);font-weight:500}
.hd-sbtn b{font-size:11px}
.hd-sbtn .ord{font-style:normal;font-size:9px;background:var(--accent);color:#fff;border-radius:8px;
  padding:0 4px;line-height:13px;margin-left:1px}

/* ---------- 首页宽表：一屏 15–20 行 × 13 列 ---------- */
.hd-wrap{border-radius:9px;max-height:none}
.hd-tbl{width:100%;border-collapse:separate;border-spacing:0;font-size:12.5px}
.hd-tbl th{position:sticky;top:0;z-index:2;background:var(--card2);font-size:11.5px;font-weight:600;
  color:var(--ink3);text-align:left;padding:8px 9px;border-bottom:1px solid var(--line);white-space:nowrap}
.hd-tbl th.num{text-align:right}
.hd-tbl td{padding:8px 9px;border-bottom:1px solid var(--line2);vertical-align:middle}
.hd-tbl td.num{text-align:right;font-variant-numeric:tabular-nums}
.hd-tbl tbody tr:hover{background:var(--card2)}
.hd-tbl tbody tr:last-child td{border-bottom:none}

/* ---------- 需要我跟的事 ---------- */
.hd-grp+.hd-grp{margin-top:12px;padding-top:12px;border-top:1px solid var(--line2)}
.hd-grp-h{display:flex;align-items:center;gap:8px;margin-bottom:7px}
.hd-p{display:flex;align-items:center;gap:9px;padding:7px 8px;border-radius:8px;cursor:pointer;transition:.12s}
.hd-p:hover{background:var(--card2)}
.hd-sys{margin-top:12px;padding-top:11px;border-top:1px dashed var(--line);display:flex;
  align-items:center;gap:6px;flex-wrap:wrap}
.hd-sysi{font-size:11.5px;padding:2px 8px;border-radius:20px;background:var(--card2);
  border:1px solid var(--line);color:var(--ink3);cursor:pointer}
.hd-sysi::before{content:'· '}
.hd-sysi.r{background:var(--bad-soft);border-color:var(--bad-line);color:var(--bad)}
.hd-sysi.w{background:var(--warn-soft);border-color:var(--warn-line);color:var(--warn)}

/* ---------- 新增简历竖条流 ---------- */
.hd-flow{display:flex;align-items:center;gap:9px;padding:8px;border-radius:8px;
  border-bottom:1px solid var(--line2);cursor:pointer;transition:.12s}
.hd-flow:hover{background:var(--card2)}
.hd-flow:last-child{border-bottom:none}

/* ---------- 今日批次 ---------- */
.hd-batch{display:flex;align-items:center;gap:14px;padding:13px 18px;border-bottom:1px solid var(--line2)}
.hd-batch:last-child{border-bottom:none}

/* ---------- 人详情里的投递切换 ---------- */
.arc-top .sp{flex:1}

/* ---------- §AF 需求列表顶部 · 我要干的事 ---------- */
.td-strip{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px 14px;margin-bottom:14px}
.td-h{display:flex;align-items:baseline;gap:10px;margin-bottom:12px}
.td-h b{font-size:14.5px}
.td-row{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.td-card{border:1px solid var(--line);border-radius:10px;padding:14px 16px;cursor:pointer;transition:.15s;background:#fff;min-height:86px;display:flex;flex-direction:column;justify-content:space-between}
.td-card:hover{border-color:var(--accent);box-shadow:0 4px 14px rgba(17,24,32,.07);transform:translateY(-1px)}
.td-card.dim{opacity:.55}
.td-n{display:flex;align-items:center;justify-content:space-between}
.td-c{font-size:26px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.td-card.dim .td-c{color:var(--ink3)}
.td-a{font-size:11.5px;color:var(--ink3);margin-top:10px}
.td-sysrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:12px;padding-top:11px;border-top:1px dashed var(--line)}
.td-sys{display:flex;gap:8px;flex-wrap:wrap}
.td-si{font-size:12px;padding:5px 10px;border-radius:6px;background:var(--warn-soft);border:1px solid var(--warn-line);cursor:pointer}
.td-si.r{background:var(--bad-soft,#fdecec);border-color:var(--bad-line,#f3c9c9);color:var(--bad)}
.td-si.w{background:var(--warn-soft);border-color:var(--warn-line)}
.td-pr{display:flex;align-items:center;gap:11px;padding:11px 4px;border-bottom:1px solid var(--line2);cursor:pointer}
.td-pr:last-child{border-bottom:none}
.td-pr:hover{background:var(--card2)}

/* ---------- 岗位名可点（点开岗位详情弹窗） ---------- */
.link-post{color:var(--ink);font-weight:600;cursor:pointer;border-bottom:1px dashed transparent;transition:.15s}
.link-post:hover{color:var(--accent);border-bottom-color:var(--accent)}

/* ---------- 岗位详情弹窗 ---------- */
.modal.md-xl{width:min(1120px,96vw)}
.pm-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}

/* ========== v1.2：外部客户入口 / 角色矩阵 / 只读确认单 ========== */
.cust-entry{width:100%;max-width:860px;margin-top:22px;padding:16px 18px;border:1px dashed var(--accent-line);border-radius:14px;
  background:linear-gradient(180deg,#fff,var(--card2));display:flex;align-items:center;gap:18px;justify-content:space-between;flex-wrap:wrap}
.cust-entry .ce-l{flex:1;min-width:320px}
.cust-entry .ce-t{font-size:14px;font-weight:600;display:flex;align-items:center;gap:7px}
.cust-entry p{font-size:12.5px;color:var(--ink3);margin-top:6px;line-height:1.7}
.cust-entry .ce-r{display:flex;gap:8px;flex-wrap:wrap}

.role-matrix{width:100%;max-width:860px;margin-top:18px;background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden}
.role-matrix .rm-h{padding:13px 18px;border-bottom:1px solid var(--line2);font-size:13.5px;font-weight:600}
.role-matrix .tbl-wrap{border:none;border-radius:0}
.role-matrix table{width:100%;border-collapse:collapse;font-size:12.5px}
.role-matrix th{text-align:left;padding:9px 12px;background:var(--bg2);color:var(--ink3);font-weight:500;font-size:11.5px;letter-spacing:.3px;border-bottom:1px solid var(--line2)}
.role-matrix td{padding:10px 12px;border-bottom:1px solid var(--line2);vertical-align:top}
.role-matrix tr:last-child td{border-bottom:none}
.role-matrix .rm-f{padding:11px 18px;font-size:11.5px;color:var(--ink4);border-top:1px solid var(--line2);background:var(--card2);line-height:1.7}

.cust-wrap{min-height:100vh;background:var(--bg2);padding:26px 16px 60px;display:flex;justify-content:center}
.cust-doc{width:100%;max-width:760px;background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:0 10px 40px rgba(30,25,20,.06)}
.cust-back{display:flex;align-items:center;gap:10px;padding:12px 22px;background:var(--card2);border-bottom:1px solid var(--line2)}
.cust-hd{display:flex;align-items:center;gap:12px;padding:18px 22px;border-bottom:1px solid var(--line2)}
.cust-hd .logo{width:34px;height:34px}
.cust-title{padding:20px 22px 4px}
.cust-title h2{font-size:24px;font-weight:600;letter-spacing:-.3px}
.cust-body{padding:0 22px 8px}

const PEOPLE = [];
const PE_IDX = {};
function upsertPerson(base){
  const key = base.phone;
  if(PE_IDX[key]){
    const ex = PE_IDX[key];
    (base.skills||[]).forEach(s=>{ if(!ex.skills.includes(s)) ex.skills.push(s); });
    return ex.id;
  }
  const person = {
    id:'PE'+String(PEOPLE.length+1).padStart(3,'0'),
    name:base.name, gender:base.gender, age:base.age, phone:base.phone,
    skills:[...(base.skills||[])],
    source:base.source||'BOSS', lastActive:base.lastActive||TODAY,
    complete:base.complete|| (68+((PEOPLE.length*7)%30))
  };
  PEOPLE.push(person); PE_IDX[key]=person;
  return person.id;
}
PERSONS.forEach(p=>{ p.personId = upsertPerson(p); });
POOL.forEach(k=>{ k.personId = upsertPerson(k); });

];
const PORTRAITS = {};
const DIM_ORDER = ['稳定性','意向','履约','适配','风险'];
PEOPLE.forEach((p,i)=>{
  const n = 3 + (i%3);
  const list = [];
  for(let j=0;j<n;j++){
    const dim = DIM_ORDER[(i+j)%DIM_ORDER.length];
    const cand = PORTRAIT_POOL.filter(t=>t.dim===dim && !list.some(x=>x.dim===dim));
    if(!cand.length) continue;
    const t = cand[(i+j)%cand.length];
    list.push(Object.assign({}, t, {updated: fmtDT(11, 5+((i+j)%8), 9+((i+j)%8), [5,30,45][j%3]),
      by:['李文静','陈曦','王浩'][(i+j)%3], src:'11-' + String(5+((i+j)%8)).padStart(2,'0') + ' 沟通'}));
  }
  PORTRAITS[p.id] = list;
});
const ptOf = pid => PORTRAITS[pid] || [];
const contactsOf = pid => CONTACTS.filter(c=>c.personId===pid);
const uploadsOf = pid => UPLOADS.filter(u=>u.personId===pid).sort((a,b)=>b.ver-a.ver);
const filesOf = pid => RES_FILES.filter(f=>f.personId===pid).sort((a,b)=>b.ver-a.ver);

/* 渠道统计 */
const channelCount = arr => { const m={}; arr.forEach(p=>{ m[p.channel]=(m[p.channel]||0)+1; }); return m; };
const chSummary = arr => Object.entries(channelCount(arr)).sort((a,b)=>b[1]-a[1]);
const batchChannels = b => {
  const ps = PERSONS.filter(p=>p.batchId===b.id);
  if(ps.length) return chSummary(ps);
  const out = [];
  if(b.boss) out.push(['BOSS 直聘', b.boss]);
  if(b.manual) out.push(['手动上传', b.manual]);
  if(b.pool) out.push(['人才池', b.pool]);
  return out;
};

const jdOf = id => JOB_DESCS.find(x=>x.id===id) || {};
const jdOfPortrait = pid => JOB_DESCS.find(x=>x.portrait===pid) || {};
const jdsOfTrade = tid => JOB_DESCS.filter(x=>x.trade===tid);

/* ---- 拼句器：把 (因子, 档位) 合成一句人能读的描述 ---- */
/* 去掉 desc 开头的"能"，让它从"能做什么"变成"做什么" */
const stripNeng = s => String(s||'').replace(/^能/, '');

function jdLine(fid, d){
  const f = factorOf(fid), tr = tierOf(fid, d);
  if(!f.id) return null;
  const gap = isGapTierT(tr);
  /* 名词型（如量具）desc 是一串清单，直接当句子会读成"名词罗列"，加动词框架 */
  const isNoun = f.valueType === '名词';
  const body = isNoun ? `自备并会用${stripNeng(tr.desc)}` : stripNeng(tr.desc);
  return {
    fid, d,
    name: f.name,
    text: gap ? `${f.name}：（该档标准待补，暂不可验收）` : body,
    metric: hasMetricT(tr) ? tr.metric : '',
    limit: (tr.limit && tr.limit!=='—') ? tr.limit : '',
    tool: (tr.tool && tr.tool!=='—') ? tr.tool : '',
    anchors: tr.anchors || [],
    gap,
  };
}
/* 这两个判定放在数据层，页面层直接用 */
function isGapTierT(x){ return !x || !x.label || x.label==='待补'; }
function hasMetricT(x){ return !!(x && x.metric && x.metric!=='—' && x.metric!=='无要求'); }

/* 一个岗位描述的全部可追溯句（按 分档 排序：PASS → 必填 → 加分） */
function jdSentences(jd){
  const p = PORTRAITS_V2.find(x=>x.id===jd.portrait);
  if(!p) return [];
  const order = {PASS:0, 必填:1, 加分:2};
  return p.pick
    .map(x=>({ gate:x[2], ...jdLine(x[0], x[1]) }))
    .filter(Boolean)
    .sort((a,b)=>(order[a.gate]-order[b.gate]));
}

/* =====================================================================
   标准 + 本单差异 合成（V10）
   ---------------------------------------------------------------------
   标准层只读，单层可改；改的只存 diff，渲染时现合成。
   ov = { add:[{fid,d,gate,from,src}], del:[fid], tier:{fid:d}, cond:{k:v}, notNeed:[..] }
   返回的每一句带 adj：{kind:'add'|'tier', from:{d}|null, src, by, at}
   ===================================================================== */
function mergeJd(j, ov){
  const sent = jdSentences(j).map(s=>({ ...s, adj:null }));
  if(!ov) {
    return { sent, conds:(j.conds||[]).map(([k,v])=>({k,v,adj:false})),
             non:(j.notNeed||[]).map(x=>({x,adj:false})), adjN:0 };
  }
  const del = new Set(ov.del||[]);
  const live = sent.filter(s=>!del.has(s.fid)).map(s=>{
    if(ov.tier && ov.tier[s.fid]){
      const nd = ov.tier[s.fid];
      if(nd!==s.d){
        const n = jdLine(s.fid, nd);
        return { ...s, ...n, gate:s.gate,
                 adj:{ kind:'tier', from:s.d, by:ov.by, at:ov.at } };
      }
    }
    return s;
  });
  (ov.add||[]).forEach(a=>{
    const n = jdLine(a.fid, a.d);
    if(!n) return;
    live.push({ ...n, gate:a.gate||'必填',
      adj:{ kind:'add', from:null, src:a.src, by:ov.by, at:ov.at } });
  });
  const conds = (j.conds||[]).map(([k,v])=>{
    const nv = (ov.cond && ov.cond[k]!=null) ? ov.cond[k] : v;
    return { k, v:nv, old:v, adj:nv!==v };
  });
  const non = (j.notNeed||[]).map(x=>{
    const dropped = (ov.notNeed||[]).includes('-' + x);
    return { x, adj:false, dropped };
  });
  (ov.notNeed||[]).filter(x=>x[0]!=='-').forEach(x=>non.push({ x, adj:true }));
  const adjN = live.filter(s=>s.adj).length + conds.filter(c=>c.adj).length + non.filter(x=>x.adj).length;
  return { sent:live, conds, non, adjN };
}

/* 可追溯率：只按「正文句子」算，工作条件不算句子（它是键值对，不是描述）*/
function jdTrace(jd){
  const s = jdSentences(jd);
  const traceable = s.filter(x=>!x.gap).length;
  const gapSentences = s.filter(x=>x.gap).length;
  return {
    sentences: s.length,
    traceable,
    gapSentences,
    withMetric: s.filter(x=>x.metric).length,
    free: 1,                       // 岗位定位一句话，人工撰写
    conds: (jd.conds||[]).length,  // 工作条件（交易条件）
    non: (jd.notNeed||[]).length,  // 明确不需要
    denom: traceable + gapSentences + 1,
    pct: Math.round(traceable / (traceable + gapSentences + 1) * 100),
  };
}

const vdOf = id => VAL_DICTS.find(x=>x.id===id) || {};

/* 枚举项总数 / 词表名称总数 */
function vdCount(d){
  if(d.type==='ENUM') return d.items.length;
  if(d.type==='TERM') return d.tree.reduce((a,g)=>a+g.items.length,0);
  return 0;
}
/* 取值区间的展示文本 */
const vdRange = d => `${d.min}–${d.max} ${d.unit}`;

/* 被引用：扫要素清单的准入/条件条目；岗位命名类字典被清单的「名称/等级/工种」引用 */
function vdUsedLists(id){
  if(id==='VD-POST')  return ELEMENT_STDS.map(s=>s.name);
  if(id==='VD-GRADE') return ELEMENT_STDS.map(s=>s.name+'（'+s.grade+'）');
  if(id==='VD-TRADE') return ELEMENT_STDS.map(s=>s.name);
  const k = VD_COND_KEY[id];
  if(!k) return [];
  return ELEMENT_STDS.filter(s=>(ELEMENT_CONDS[s.id]||[]).some(c=>c.k===k)).map(s=>s.name);
}
/* 是否已进要素池（进了池就是"可被清单直取"，只是还没人取） */
function vdInPool(id){
  const k = VD_COND_KEY[id];
  return !!(k && ELEMENT_POOL.some(p=>p.k===k));
}
/* 一致性：清单里写的值，是否都能在字典里找到（只对枚举做，区间不查） */
function vdConflicts(id){
  const d = vdOf(id), k = VD_COND_KEY[id];
  if(!d.id || d.type!=='ENUM' || !k) return [];
  const vals = new Set();
  ELEMENT_STDS.forEach(s=>(ELEMENT_CONDS[s.id]||[]).filter(c=>c.k===k).forEach(c=>vals.add(c.v)));
  return [...vals].filter(v=>!d.items.some(it=>v===it.v || v.startsWith(it.v)));
}

const f47Of = no => F47.find(x=>x.no===no) || {};
const f47ByLayer = l => F47.filter(x=>x.layer===l);
/* 岗位级字段 = 进要素清单的那批 */
const F47_JOB = F47.filter(x=>x.layer==='job');
const F47_ORDER = F47.filter(x=>x.layer==='order');
const F47_CLIENT = F47.filter(x=>x.layer==='client');
/* 层级 → 分档：一级=PASS 硬门槛 / 二级=必填 / 三级=加分 */
const GATE_OF_LEVEL = { '一级':'PASS', '二级':'必填', '三级':'加分' };
const f47Groups = l1 => {
  const d = F47_L1.find(x=>x.id===l1);
  return d ? d.groups : [];
};
/* 按 L2 组统计岗位级字段数 */
function f47JobByGroup(){
  const m = {};
  F47_JOB.forEach(x=>{ m[x.l2] = (m[x.l2]||0)+1; });
  return m;
}
/* 某清单覆盖了哪几个域 */
function listDomains(picks){
  const set = new Set();
  picks.forEach(no=>{ const f = f47Of(no); if(f.l1) set.add(f.l1); });
  return F47_L1.filter(d=>set.has(d.id));
}

  const m = TRI[s] || TRI.pend;

}

  [V('徐立新')]:{ certs:[{name:'电工特种作业操作证', state:'no', src:'候选人确认', ev:'「证过期了，还没复审」', at:'2026-11-12 11:20'}],
    city:{ live:'南通', liveState:'已核实', want:['上海'], wantState:'已确认', src:'电话确认', at:'2026-11-12 11:20' },
    arrive:{ date:'2026-11-30', state:'已确认', src:'电话确认', at:'2026-11-12 11:22' },
    night:{ state:'已确认愿意', src:'电话确认', at:'2026-11-12 11:22' } },

  /* P16 谢天成 61 分 · 新入库，资料几乎空白（场景 D） */
  [V('谢天成')]:{ certs:[], city:{ live:'—', liveState:'待确认', want:[], wantState:'待确认', src:'未填', at:'—' },
    arrive:{ date:'', state:'待确认', src:'—', at:'—' }, night:{ state:'未确认', src:'—', at:'—' } },
});

function verifyOf(pid){ return VERIFY[pid] || { certs:[], city:{wantState:'待确认'}, arrive:{state:'待确认'}, night:{state:'未确认'} }; }

/* 匹配用的条件＝**生效版本**的快照；未生效的新版条件一律不得参与判断（AGENTS R4）。
   版本对象上带 gate 就以此为准，否则退回需求基础快照。 */
function gateOf(d){
  const av = activeVer(d);
  const base = DEMAND_GATE[d.id] || {};
  const snap = (av && av.gate) ? av.gate : null;
  return snap ? Object.assign({}, base, snap) : base;
}

/* ---------- 4. 逐项判定 ---------- */
function assessPerson(p, d){
  const g = gateOf(d);
  const v = verifyOf(p.personId);
  const out = [];
  const push = (key, state, need, got, src, ev, at, note, soft)=>{
    const meta = CAND_KEYS.find(k=>k.key===key) || {};
    out.push({ key, no:meta.no, label:meta.label, grade:meta.grade, state, need, got, src, ev, at, note, soft:!!soft });
  };

  /* 3 用工地点 / 工作意愿 */
  {
    const c = v.city || {};
    let st = 'pend', got = '无记录', note = '缺城市意愿记录';
    if(c.wantState === '已确认' && (c.want||[]).length){
      const hit = (c.want||[]).some(x => (g.city||'').includes(x));
      st = hit ? 'ok' : 'no';
      got = `愿意 ${c.want.join('、')}（现居 ${c.live||'—'}）`;
      note = hit ? '' : `客户地点为 ${g.city}，候选人明确不愿异地`;
    } else if(c.wantState === '待确认'){
      got = `现居 ${c.live||'—'}，愿意城市未确认`; note = '不以现居地推断异地意愿';
    }
    push('city', st, g.city||'—', got, c.src||'—', '', c.at||'—', note);
  }

  /* 7 最晚报到日 / 可到岗时间 */
  {
    const a = v.arrive || {};
    let st = 'pend', got = '未确认到岗日期', note = '不以「无进行中投递」推断可到岗';
    if(a.state === '已确认' && a.date){
      const late = a.date > g.arriveBy;
      st = late ? 'no' : 'ok';
      got = `${a.date} 可到岗`;
      note = late ? `晚于最晚报到日 ${g.arriveBy}` : '';
    }
    push('arrive', st, g.arriveBy||'—', got, a.src||'—', '', a.at||'—', note);
  }

  /* 10 年龄区间（客户明示条件，非能力判断）
     三种情况必须分开：客户没设限制 / 有年龄且符合 / 没年龄资料。
     原实现把空字符串年龄直接做数值比较（被判成 0 岁）→ 一律「不符合」，
     违反 R5「缺资料不得自动淘汰」。缺年龄一律 pend。 */
  {
    const hasReq = Array.isArray(g.age) && g.age.length === 2;
    const ageNum = (p.age === null || p.age === undefined || p.age === '') ? NaN : Number(p.age);
    const hasAge = ageNum === ageNum;
    let st, needTxt, got, src, note;
    if(!hasReq){
      st = 'ok'; needTxt = '客户未设年龄限制'; got = hasAge ? `${ageNum} 岁` : '无年龄资料';
      src = hasAge ? '人员档案' : '无来源'; note = '客户未设年龄限制，仅记录本人年龄';
    } else if(!hasAge){
      st = 'pend'; needTxt = `${g.age[0]}–${g.age[1]} 岁`; got = '无年龄资料'; src = '无来源';
      note = '年龄未登记，需补充档案；缺资料不得据此判定不符合';
    } else {
      const okAge = ageNum >= g.age[0] && ageNum <= g.age[1];
      st = okAge ? 'ok' : 'no'; needTxt = `${g.age[0]}–${g.age[1]} 岁`; got = `${ageNum} 岁`; src = '人员档案';
      note = okAge ? '仅按客户明示条件比对，不作为能力替代指标'
                   : '超出客户明示年龄区间，已标为待业务与合规复核';
    }
    push('age', st, needTxt, got, src, '', '—', note);
  }

  /* 11 性别要求 —— 同年龄：没登记性别不等于不符合 */
  {
    const need = g.gender || '不限';
    let st, got, note;
    if(need === '不限'){
      st = 'ok'; got = p.gender || '未登记'; note = '客户未设限制';
    } else if(!p.gender){
      st = 'pend'; got = '性别未登记'; note = '档案未登记性别，需补充；缺资料不得据此判定不符合';
    } else {
      st = p.gender === need ? 'ok' : 'no'; got = p.gender;
      note = st === 'ok' ? '客户明示条件' : '客户明示性别条件，与档案不一致，需人工复核';
    }
    push('gender', st, need, got, p.gender ? '人员档案' : '无来源', '', '—', note);
  }

  /* 22 工种 —— 先分「无资料」与「明确不匹配」，缺资料不等于不符合 */
  {
    /* 老需求有手写关键词表；新建需求没有，就用它自己的条件快照（工种 + 技能项）当关键词，
       否则新需求一建出来，所有有简历的人都会被判成「技能栏未出现关键词」= 不符合。 */
    const kw = TRADE_KW[d.id] || [].concat(g.skill||[], String(g.trade||'').split(/[\s\/·、]+/)).filter(Boolean);
    const skills = p.skills || [];
    const hit = skills.find(s => kw.some(k => s.includes(k)));
    const st = hit ? 'ok' : (skills.length ? 'no' : 'pend');
    push('trade', st, g.trade||'—',
      hit ? `技能含「${hit}」` : (skills.length ? skills.join('、') : '无技能记录'),
      skills.length ? '简历技能栏' : '无来源', '', '—',
      hit ? '' : (skills.length ? '技能栏未出现该工种关键词' : '没有技能资料，不得据此判定不符合'));
  }

  /* 25 专业技能项 —— 需求未设要求时直接符合；无资料待确认 */
  {
    const need = g.skill || [];
    const skills = p.skills || [];
    const hits = need.filter(k => skills.some(s => s.includes(k) || k.includes(s)));
    let st = 'pend', got = '', note = '';
    if(!need.length){
      st = 'ok'; got = '—'; note = '该需求未设专业技能要求';
    } else if(hits.length){
      st = 'ok'; got = `命中 ${hits.join('、')}`;
    } else if(!skills.length){
      got = '无技能记录'; note = '没有技能资料，不得据此判定不符合';
    } else {
      st = 'no'; got = skills.join('、') || '—'; note = '技能项与要求无交集';
    }
    push('skill', st, need.join('、')||'—', got, skills.length ? '简历技能栏' : '无来源', '', '—', note);
  }

  /* 26 证书：独立字段 + 核验状态；技能名不得推断持证
     强制属性**按每张证分别判定**，不能整单一个开关：
       certOpt        明确标为优先/加分的证名（混选时必备证仍要卡 Pass）
       certMust=false 只有「全部证书都是加分项」时才用（历史快照 / D1 这类单证样本）
     多选证书必须逐项核验：第 26 项支持多选，原来的 find+some 只看到任意一张，
     其余必备证缺失或明确不满足都被吞掉，缺证的人照样进「可推荐」（R5 全部硬条件符合才可推荐）。 */
  {
    const need = (g.cert || []).filter(Boolean);
    if(!need.length){
      push('cert', 'ok', '无证书要求', '—', '需求快照', '', '—', '该需求未设证书硬条件');
    } else {
      const optList = (g.certOpt || []).filter(Boolean);
      const allOpt = g.certMust === false && !optList.length;
      const isOpt = n => allOpt || optList.includes(n);
      const recs = v.certs || [];
      /* 每个要求各找一条对应的核验记录；找不到就是「无记录」，不能借用别的证 */
      const rows = need.map(n => ({
        name: n,
        must: !isOpt(n),
        rec: recs.find(c => (c.name||'').includes(n) || n.includes(c.name||'')) || null,
      }));
      const t = r => r.state === 'ok' ? '已核验' : r.state === 'no' ? '明确不满足' : '待核验';
      const got = rows.map(r => r.rec ? `${r.name}（${r.must?'必备':'优先'}·${t(r.rec)}）`
                                      : `${r.name}（${r.must?'必备':'优先'}·无记录）`).join('；');
      /* 汇总只看**必备**那几张：任一明确不满足 → no；否则任一缺记录/待核验 → pend；全已核验 → ok。
         但「所选证书全部是加分项」时 hard 为空，不能因此恒判 ok —— 缺记录 / 明确不持证也是真实证据，
         展示状态必须照实给出（R5 对称：缺资料既不能当不符合，也不能当符合），
         只是整项带 soft:true 不进 triSum / Pass（R6：加分项只影响排序）。 */
      const hard = rows.filter(r => r.must);
      const scope = hard.length ? hard : rows;
      const anyNo = scope.some(r => r.rec && r.rec.state === 'no');
      const anyGap = scope.some(r => !r.rec || r.rec.state !== 'ok');
      const st = anyNo ? 'no' : (anyGap ? 'pend' : 'ok');
      const soft = hard.length === 0;          /* 全是加分证 → 整项不进 Pass */
      const hit = rows.filter(r => r.rec);
      const src = hit.length ? Array.from(new Set(hit.map(r => r.rec.src || '—'))).join(' / ') : '—';
      const ev = hit.map(r => r.rec.ev).filter(Boolean).join('；');
      const at = hit.length ? (hit[hit.length-1].rec.at || '—') : '—';
      const missName = scope.filter(r => !r.rec).map(r => r.name);
      const noName = scope.filter(r => r.rec && r.rec.state === 'no').map(r => r.name);
      const pendName = scope.filter(r => r.rec && r.rec.state === 'pend').map(r => r.name);
      const gapTxt = () => {
        const parts = [];
        if(missName.length) parts.push(`缺记录：${missName.join('、')}`);
        if(pendName.length) parts.push(`待核验：${pendName.join('、')}`);
        return parts.join('；');
      };
      let note;
      if(soft){
        /* 加分证：状态照实 + 明确说明不影响 Pass，避免看的人以为绿色=硬条件已过 */
        if(anyNo) note = `候选人明确不满足：${noName.join('、')}（客户标注为优先/加分，仅影响排序，不阻断 Pass）`;
        else if(anyGap) note = `加分证书证据未齐（${gapTxt()}），状态照实显示；不参与 Pass 判定，需补证可提升排序`;
        else note = '加分证书已核验持证；不参与 Pass 判定';
      } else if(anyNo){
        note = `候选人明确不满足：${noName.join('、')}（客户必备条件）`;
      } else if(anyGap){
        note = `必备证书未齐（${gapTxt()}），需补证或核验；不得因技能关键词推断持证`;
      } else {
        note = '必备证书已逐项核验通过';
      }
      /* 有证书说明的样本（如「简历技能栏写电工，未附证书」）把原话带出来，别丢依据 */
      if(v.certNote && anyGap) note += `；${v.certNote}`;
      const needTxt = rows.map(r=>`${r.name}（${r.must?'必备':'优先'}）`).join('、');
      push('cert', st, needTxt, got, src, ev, at, note, soft);
    }
  }

  /* 19 夜班 */
  {
    const need = g.night || '不需要';
    const n = v.night || {};
    let st = 'ok', got = '不需要夜班', note = '';
    if(need === '需要'){
      if(n.state === '已确认愿意'){ st='ok'; got='已确认可接受夜班'; }
      else if(n.state === '已确认不愿'){ st='no'; got='明确不接受夜班'; note='候选人明确拒绝'; }
      else { st='pend'; got='夜班意愿未确认'; note='需向候选人确认'; }
    }
    push('night', st, need, got, n.src||'—', '', n.at||'—', note);
  }

  return out;
}

/* 加分项：只影响排序，不参与 Pass 判定 */
function bonusOf(p, d){
  const v = verifyOf(p.personId);
  const list = [];
  const has = kw => (p.skills||[]).some(s => kw.some(k => s.includes(k)));
  list.push({ label:'设备 / 工艺经验', hit: has(['FANUC','激光','船舶','CNC','伺服','线体']), src:'简历技能栏' });
  list.push({ label:'特殊经验要求', hit: has(['非标','船厂','重工','3C']), src:'简历技能栏' });
  list.push({ label:'独立看图能力', hit: has(['图纸','看图','识图']), src:'简历技能栏' });
  list.push({ label:'语言 / 沟通要求', hit: true, src:'面试记录' });
  return list;
}

const VER_OPEN = ['待客户确认','待重新确认','待内部审核','已退回'];
const VER_TONE = {'生效':'g','待客户确认':'w','待重新确认':'w','待内部审核':'i','已退回':'r','已被取代':'n'};
function versOf(d){ return DEMAND_VERS[d.id] || []; }
function versAll(){ return Object.keys(DEMAND_VERS).reduce((a,k)=>a.concat(DEMAND_VERS[k]),[]); }
function activeVer(d){ const l = versOf(d).filter(v=>v.status==='生效'); return l.length ? l[l.length-1] : null; }
function openVer(d){ const l = versOf(d).filter(v=>VER_OPEN.includes(v.status)); return l.length ? l[l.length-1] : null; }
/* 兼容旧名：pendingVer = 尚未生效的那一版（可能是待确认 / 待审核 / 已退回） */
function pendingVer(d){ return openVer(d); }
function isEffective(d){ return !!activeVer(d); }
function verStatTxt(d){
  const av = activeVer(d), ov = openVer(d);
  if(av) return ov ? `已生效 ${av.v} · ${ov.v} ${ov.status}` : `已生效 ${av.v}`;
  return ov ? `${ov.v} ${ov.status}` : '无生效版本';
}

/* ---------- 5b. 客户反馈代登记记录（RG-002 要求 8 个字段） ----------
   一条记录 = 客户一次线下反馈被我方抄进系统。
   客户不登录、不点击，因此必须能区分：
     · 客户反馈人 ≠ 我方登记人
     · 反馈发生时间 ≠ 系统登记时间
   缺任何一项都不允许送审，更不允许标为有效需求。 */
const REG_CHANNELS = ['微信','电话','会议','邮件','现场'];
const REG_FIELDS = [

  {k:'fbAt',      n:'反馈发生时间',        hint:'客户实际说话的时间'},

  {k:'regAt',     n:'登记时间',            hint:'系统录入时间，不得早于反馈时间'},

const REGS = {};
function regsOf(did){ return REGS[did] || []; }
function regsOfVer(did, ver){ return regsOf(did).filter(r=>r.ver===ver); }
function lastReg(did, ver){ const l = regsOfVer(did, ver); return l.length ? l[l.length-1] : null; }
function regMissing(r){
  r = r || {};
  return REG_FIELDS.filter(f=>!String(r[f.k]==null?'':r[f.k]).trim()).map(f=>f.n);
}
function addReg(rec){
  const did = rec.demandId;
  (REGS[did] = REGS[did] || []).push(rec);

}
function newRegId(){
  const n = Object.keys(REGS).reduce((s,k)=>s+REGS[k].length,0)+1;
  return 'RG-'+String(n).padStart(3,'0');
}

/* ---------- 时间解析 ----------
   两个时间都是人手工敲的自由文本，**不能按字符串比大小**：
   "2026-11-13 9:00" 与 "2026-11-13 10:05" 字符串比较会把 9:00 判成更大（"1" < "9"）。
   统一解析成毫秒数再比；格式不合法直接拒绝，不做猜测。 */
const TS_RE = /^(\d{4})-(\d{1,2})-(\d{1,2})[ T](\d{1,2}):(\d{2})$/;
function parseTs(str){
  const m = TS_RE.exec(String(str==null?'':str).trim());
  if(!m) return NaN;
  const [_, y, mo, d, h, mi] = m.map(Number);
  if(mo<1||mo>12||d<1||d>31||h>23||mi>59) return NaN;
  return Date.UTC(y, mo-1, d, h, mi);
}
/* 规范化成 YYYY-MM-DD HH:mm；解析不了返回空串（不悄悄替换成今天） */
function normTs(str){
  const ms = parseTs(str);
  if(isNaN(ms)) return '';
  const d = new Date(ms);
  const p = n => String(n).padStart(2,'0');
  return `${d.getUTCFullYear()}-${p(d.getUTCMonth()+1)}-${p(d.getUTCDate())} ${p(d.getUTCHours())}:${p(d.getUTCMinutes())}`;
}
function tsOrderOk(fbAt, regAt){
  const fb = parseTs(fbAt), rg = parseTs(regAt);
  if(isNaN(fb) || isNaN(rg)) return {ok:false, why:'时间格式无法解析，应为 2026-11-13 09:12'};
  if(fb > rg) return {ok:false, why:'登记时间早于反馈发生时间，请核对'};
  return {ok:true};
}

/* 审核历史：每轮「谁、何时、通过还是退回、什么意见」追加保存，不覆盖。
   旧数据只有单个 auditNote 字段，这里补成数组，保证退回意见不丢。 */
versAll().forEach(v=>{
  if(Array.isArray(v.audits)) return;
  v.audits = [];
  if(v.audit === '已通过' || v.audit === '已退回'){
    v.audits.push({act: v.audit==='已退回'?'back':'pass', by:v.auditBy||'—', at:v.auditAt||'—', note:v.auditNote||''});
  }
});
function auditsOf(v){ return (v && Array.isArray(v.audits)) ? v.audits : []; }
function lastBack(v){
  const l = auditsOf(v).filter(a=>a.act==='back');
  return l.length ? l[l.length-1] : null;
}

function mainLink(did){ const l = linksOf(did).filter(x=>x.state==='有效'); return l.length ? l[0] : null; }
function genLink(did, ver, by){
  const tok = 'LK-'+did+'-'+String(ver).replace('.','').toUpperCase()+'-'+String(CLINKS.length+1);
  CLINKS.unshift({tok, demandId:did, ver, state:'有效', at:'2026-11-14 08:10', by:by||'金诚', views:0, expire:'2026-11-21', mode:'只读确认单'});

function revokeLink(tok, why){

/* 外部链接可见范围：只放该需求本身，不放人才库 / 其他需求 / 合同价与利润 */
/* 链接是否已过期：状态写「有效」但有效期已过，也算过期 —— 打开与列表必须用同一个判断 */
function linkExpired(l){ return !!l && l.state === '有效' && !!l.expire && l.expire < TODAY; }
function custLinkPayload(tok){
  const l = linkOf(tok);
  if(!l) return {ok:false, code:'NOTFOUND', msg:'链接不存在'};
  if(l.state === '已失效') return {ok:false, code:'EXPIRED', l, msg:`该链接已于 ${l.expire} 失效，需重新生成`};
  if(l.state === '已撤销') return {ok:false, code:'REVOKED', l, msg:`该链接已撤销${l.why?'：'+l.why:''}`};
  /* 按有效期拒绝：否则列表显示「已过期」、打开却还能看全文，客户侧口径自相矛盾 */
  if(linkExpired(l)) return {ok:false, code:'EXPIRED', l, msg:`该链接有效期至 ${l.expire}，已过期，需重新生成`};
  const d = D(l.demandId);
  const ver = versOf(d).find(v=>v.v===l.ver) || {};
  /* 客户看到的是**当时发出去的那一版**的条件快照，不是当前生效版 */
  const gate = ver.gate ? Object.assign({}, DEMAND_GATE[d.id]||{}, ver.gate) : (DEMAND_GATE[d.id]||{});
  return {ok:true, l, d, gate, ver};
}

}

/* 年龄区间的展示文字：客户原文优先（'18–45'），没有原文再用解析出的区间。
   客户自己写的才是依据，解析只是给匹配用。 */
function custAgeTxt(g){
  const raw = String((g && g.ageRaw) || '').trim();
  if(raw && !/^(不限|无|无要求|无硬性要求)$/.test(raw)){
    return /岁/.test(raw) ? raw : raw + ' 岁';
  }
  const a = (g && g.age) || [];
  return a.length === 2 ? `${a[0]}–${a[1]} 岁` : '不限';
}
/* 证书要求的展示文字：按**每张证**分别标必备/优先，混选时不能笼统写一个「（优先）」，
   否则客户会以为那几张全都不是硬条件。 */
function certNeedTxt(g){
  const list = ((g && g.cert) || []).filter(Boolean);
  if(!list.length) return '无硬性要求';
  const optList = ((g && g.certOpt) || []).filter(Boolean);
  const allOpt = g.certMust === false && !optList.length;
  return list.map(n => optList.includes(n) || allOpt ? `${n}（优先）` : `${n}（必备）`).join('、');
}

function stats(list){
  return `<div class="stats">${list.map(s=>`<div class="stat ${s.accent?'accent':''} ${s.on?'clkable':''} ${s.on&&s.hot?'hot':''}" ${s.on?`onclick="${s.on}"`:''}>
