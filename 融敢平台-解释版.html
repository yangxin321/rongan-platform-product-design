function toolbar({q, filters, right, chips}){
  return `<div class="toolbar">
    <div class="search"><span>⌕</span><input id="q" placeholder="${q||'搜索'}" value="${esc(S.f.q||'')}" oninput="setQ(this.value)"></div>
    ${(filters||[]).map(f=>`<select class="sel" onchange="setF('${f.k}',this.value)">

    </select>`).join('')}
    ${(chips||[]).map(c=>`<span class="chip ${S.f[c.k]===c.v?'on':''}" onclick="setF('${c.k}','${c.v}')">${esc(c.label)}</span>`).join('')}

function table(cols, rows, empty){

  return `<div class="tbl-wrap"><table><thead><tr>${cols.map(c=>`<th>${c.label}</th>`).join('')}</tr></thead>
    <tbody>${rows.map(r=>`<tr>${cols.map(c=>`<td>${c.r? c.r(r) : esc(r[c.k])}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;

function pager(n){

function setQ(v){ S.f.q=v; refreshTable(); }
function setF(k,v){ S.f[k]=v; refreshTable(); }
function refreshTable(){

/* ---------- 抽屉 / 弹窗 ---------- */
function openDrawer(html){
  const d = document.getElementById('drawer'), m = document.getElementById('mask');
  const mo = document.getElementById('modal');
  const over = !!(mo && mo.classList.contains('on'));
  d.className = 'drawer' + (over?' over':''); m.className = 'mask' + (over?' over':'');
  d.style.zIndex = over ? '80' : ''; m.style.zIndex = over ? '75' : '';
  d.innerHTML = html; d.classList.add('on'); m.classList.add('on');
}
/* 宽抽屉：确认单 / 版本历史 / 匹配详情用 */
function openDrawerW(html){
  openDrawer(html);
  document.getElementById('drawer').classList.add('wide');
}
function closeAll(){
  const d=document.getElementById('drawer'), m=document.getElementById('mask'), mo=document.getElementById('modal');
  if(d){ d.classList.remove('on'); d.style.zIndex=''; }
  if(m){ m.classList.remove('on'); m.style.zIndex=''; }
  if(mo) mo.classList.remove('on');
}
function openModal(html, size){
  const mo = document.getElementById('modal'), m=document.getElementById('mask');
  mo.className = 'modal' + (size?' '+size:'');
  mo.innerHTML = html; mo.classList.add('on'); m.classList.add('on');
  if(mo.querySelector('#upSum')) upSync();
}
function toast(msg){
  let t = document.getElementById('toast');
  if(!t){ t = document.createElement('div'); t.id='toast';
    t.style.cssText='position:fixed;left:50%;bottom:34px;transform:translateX(-50%);background:#111820;color:#fff;padding:10px 18px;border-radius:8px;font-size:13px;z-index:99;opacity:0;transition:.2s';
    document.body.appendChild(t);
  }
  t.textContent = msg; t.style.opacity='1';
  clearTimeout(window.__tt); window.__tt = setTimeout(()=>{t.style.opacity='0'},1800);
}

/* ---------- 页签 1 · 需求明细（可改） ---------- */
function dmOvMap(d){ const m={}; (d.stdOverride||[]).forEach(o=>{ m[o.no]=o.to; }); return m; }
function dmSetVal(no, v){
  const d = D(DM.id), s = stdOf(d.stdId)||{};
  const base = (s.vals||{})[no];
  d.stdOverride = (d.stdOverride||[]).filter(o=>o.no!==+no);
  if(JSON.stringify(v)!==JSON.stringify(base)) d.stdOverride.push({no:+no, from:base, to:v});
  const cell = document.getElementById('dmm-' + no);
  if(cell) cell.innerHTML = dmMark(no, base, v);
  toast('已改本单值 · ' + (f47Of(+no).name||no) + ' —— 标准本身不动');
}
function dmMark(no, base, v){
  const same = JSON.stringify(base)===JSON.stringify(v);
  if(same) return '<span class="xs mut">同标准</span>';
  return '<span class="b a">已改</span> <span class="xs mut">标准 ' + esc(stdVal(no, base)||'未定') + '</span>';
}
function dmEditor(no, v){
  const f = f47Of(no);
  const isEnum = ['枚举','词表'].includes(f.type) && !Array.isArray(v);
  if(isEnum){
    const opts = (f.vals||[]).slice(), cur = v==null?'':String(v);
    if(cur && !opts.includes(cur)) opts.unshift(cur);
    return `<select class="ed-in" onchange="dmSetVal(${no},this.value)">
      <option value="">— 未定 —</option>
      ${opts.map(o=>`<option value="${esc(o)}" ${o===cur?'selected':''}>${esc(o)}</option>`).join('')}</select>`;
  }
  if(Array.isArray(v) || f.type==='多选'){
    const cur = Array.isArray(v)? v.join(' · ') : (v||'');
    return `<input class="ed-in" value="${esc(cur)}" placeholder="多个值用 · 分隔"
      onchange="dmSetVal(${no}, this.value.split('·').map(x=>x.trim()).filter(Boolean))">`;
  }
  return `<input class="ed-in" value="${esc(v==null?'':v)}" placeholder="填这一单的值"
    onchange="dmSetVal(${no}, this.value)">`;
}
function dmDetail(d){
  const isR04 = S.role==='R04';
  const al = allocOf(d.id);
  const s = stdOf(d.stdId) || {};
  const ov = dmOvMap(d);
  const l = elListOf(d.stdList || s.list), picks = l.picks || [];
  const byDom = F47_L1.map(dom=>{
    const groups = dom.groups.map(g=>{
      const items = picks.map(f47Of).filter(f=>f.l2===g);
      if(!items.length) return '';
      const rows = items.map(f=>{
        const base = (s.vals||{})[f.no];
        const v = (f.no in ov) ? ov[f.no] : base;
        return `<tr>
          <td><span class="fid">${f.no}</span> <b class="sm">${esc(f.name)}</b>
            <div class="t-sub">${esc(f.type)} · ${esc(GATE_OF_LEVEL[f.level]||'')}</div></td>
          <td class="sm mut mono">${esc(stdVal(f.no, base)||'未定')}</td>
          <td>${dmEditor(f.no, v)}</td>
          <td id="dmm-${f.no}" style="min-width:96px">${dmMark(f.no, base, v)}</td>
        </tr>`;
      }).join('');
      return `<div class="el-grp"><div class="el-grp-h"><b>${esc(g)}</b><span class="sm mut">${items.length} 项</span></div>
        <div class="tbl-wrap"><table class="sj-tbl"><tbody>${rows}</tbody></table></div></div>`;
    }).join('');
    if(!groups) return '';
    return `<div class="el-dom"><div class="el-dom-h"><span class="el-dom-m">${esc(dom.mark)}</span><b>${esc(dom.name)}</b></div>${groups}</div>`;
  }).join('');

  const noStd = !d.stdId && !d.jdId;

  return `
    ${demandStateBar(d)}
    ${d.stdId
      ? `<div class="sec"><div class="sec-t">① 标准岗位标准（本单快照 · ${esc(d.stdVer||'—')} / 清单 ${esc(d.stdList||'—')}）
          <span class="xs mut" style="font-weight:400">口径：清单版本 +1 才触发重算，本单快照记 stdVer + listVer</span></div>${stdSection(d, true)}</div>`
      : d.jdId ? jdSection(d)
      : `<div class="sec"><div class="sec-t">① 岗位口径</div>
        <div class="note w">这一单既没挂标准岗位标准、也没挂岗位描述（历史数据）—— 没有口径就没法评分、没法出确认单。
        ${isR04?'':'<button class="btn xs" style="margin-left:6px" onclick="closeAll();ndEnter()">新建一单</button>'}</div>
      </div>`}

    ${picks.length? `<div class="sec"><div class="sec-t">② 要素与标准值（${picks.length} 项）
        <span class="xs mut" style="font-weight:400">左边是要问的，中间是标准，右边是这一单</span></div>
      <div class="note" style="margin-bottom:10px">右边改的是<b>这一单</b>：只存差异，标准岗位标准不动、也不升版。</div>
      ${byDom}
    </div>`:''}

    <div class="sec"><div class="sec-t">③ 人 / 时间 / 钱</div>
      <div class="tbl-wrap" style="border-radius:9px"><table class="sj-tbl">
        <thead><tr><th style="width:110px">项</th><th>值</th><th style="width:150px">说明</th></tr></thead>
        <tbody>
          ${dmRow('需求人数', `<input class="ed-in" type="number" value="${d.head}" onchange="dmSetD('head',+this.value)">`, '改这里会动缺口')}
          ${dmRow('工价', `<input class="ed-in" value="${esc(d.price)}" onchange="dmSetD('price',this.value)">`, '支持区间，如 32-38')}
          ${dmRow('最迟到岗', `<input class="ed-in" type="date" value="${esc(d.deadline)}" onchange="dmSetD('deadline',this.value)">`, '改期需重确认')}
          ${dmRow('需求有效期', `<input class="ed-in" value="${esc(d.valid)}" onchange="dmSetD('valid',this.value)">`, '含起止')}
          ${dmRow('工作地点', `<input class="ed-in" value="${esc(d.city)}" onchange="dmSetD('city',this.value)">`, '城市·园区')}
        </tbody></table></div>
      <div class="note w" style="margin-top:9px">改「需求人数」「最迟到岗」属于关键内容变更，<b>已发出的确认单需要客户重新确认</b>；本页改动都会写操作日志。</div>
    </div>

    <div class="sec"><div class="sec-t">④ 客户与项目</div>
      <dl class="kv">
        <div><dt>客户</dt><dd>${esc(d.client)}</dd></div>
        <div><dt>项目</dt><dd>${esc(d.project)}</dd></div>
        <div><dt>需求编号</dt><dd class="mono">${esc(d.code)}</dd></div>
        <div><dt>当前跟进</dt><dd>${al.length? esc(al.map(x=>x.staff).join(' / ')) : '<span class="b w">未分配</span>'}</dd></div>
      </dl>
    </div>`;
}
function dmRow(k, input, hint){
  return `<tr><td class="sm"><b>${k}</b></td><td>${input}</td><td class="xs mut">${hint||''}</td></tr>`;
}
function dmSetD(field, v){
  const d = D(DM.id);
  const old = d[field];
  d[field] = v;
  const el = document.getElementById('dm-d-' + field);
  if(el) el.textContent = v;
  toast(`已改 ${field}：${old} → ${v}${field==='head'||field==='deadline'?'（关键内容，需重确认）':''}`);
}
function dmMine(did){
  const me = S.who;
  return personsOf(did).filter(p=>p.owner===me || (appPerson(p.personId)||{}).follower===me);
}

/* ---------- 页签 2 · 简历明细（列与人员列表一致） ---------- */
function dmResume(d){
  const all = personsOf(d.id);
  const mine = dmMine(d.id);
  const rows = DM.scope==='mine' ? mine : all;

/* ===== 本单岗位描述（V8–V11）=====
   标准层只读，单层可改；改动只存 diff，渲染时「标准 + override」现合成。
   被改/被加的句子带黄标「本单调整」，hover 看原句 → 新句 + 谁改的 + 客户原话依据。
*/
function jdSection(d){
  const j = jdOf(d.jdId);
  const m = mergeJd(j, d.jdOverride);
  const isR04 = S.role==='R04';
  const stale = d.jdVer && j.ver && d.jdVer!==j.ver;
  const gateB = {PASS:'r', 必填:'i', 加分:'g'};
  const custJd = CUSTOMER_JD[d.client];

  const sentRows = m.sent.map(s=>{
    const dup = s.metric && s.text.indexOf(s.metric) >= 0;
    const tip = s.adj ? (s.adj.kind==='add'
        ? `本单新增 · ${esc(s.adj.src||'')}${s.adj.by?` · ${esc(s.adj.by)} ${esc(s.adj.at||'')}`:''}`
        : `原为 ${esc(s.adj.from)} → 改为 ${esc(s.d)} · ${esc(s.adj.by||'')} ${esc(s.adj.at||'')}`) : '';
    return `<div class="jd-p ${s.gap?'gap':''} ${s.adj?'adjed':''}">
      <div class="tx">${esc(s.text)}${(s.metric&&!dup)?`<br><span class="sm mut">验收指标：<em>${esc(s.metric)}</em></span>`:''}</div>
      <div class="src">
        ${s.adj?`<span class="adj" title="${tip}">本单调整</span>`:''}
        <span class="g b ${gateB[s.gate]}">${esc(s.gate)}</span>
      </div></div>`;
  }).join('');

  const condRows = m.conds.filter(c=>true).map(c=>`<tr>
      <td class="sm">${esc(c.k)}${c.adj?' <span class="adj">本单调整</span>':''}</td>
      <td class="sm mono">${esc(c.v)}${c.adj?` <span class="xs mut" style="text-decoration:line-through">${esc(c.old)}</span>`:''}</td>
    </tr>`).join('');

  const nonChips = m.non.map(x=>`<span style="${x.adj?'border-color:var(--warn-line);background:var(--warn-soft)':''}">${esc(x.x)}</span>`).join('');

  return `<div class="sec"><div class="sec-t">本单岗位描述
      <span class="b ${stale?'w':'n'}" style="margin-left:2px">${esc(d.jdVer||j.ver)}${stale?` → 标准 ${esc(j.ver)}`:''}</span>
      ${m.adjN?`<span class="b w">${m.adjN} 处调整</span>`:''}
      <span style="margin-left:auto;display:flex;gap:6px">
        ${CUSTOMER_JD[d.client]?'<span class="b g">已存客户默认</span>':''}
        ${isR04?'':`<button class="btn xs" onclick="closeAll();openJdOverride('${d.id}')">调整本单描述</button>`}
      </span></div>
    ${stale?`<div class="note w" style="margin-bottom:8px">这份描述引用的是 ${esc(d.jdVer)}，标准已升到 ${esc(j.ver)}。<b>这一单仍按 ${esc(d.jdVer)} 评分</b> —— 历史评分不回溯，需要换口径就新建需求。</div>`:''}
    <div style="background:#fff;border:1px solid var(--line);border-radius:9px;padding:12px 14px">
      <div class="sm mut" style="margin-bottom:6px">${esc(j.title)} · 能力要求 ${m.sent.length} 句 · 准入 ${m.conds.length} 条 · 不需要 ${m.non.length} 条</div>
      ${sentRows}
      ${nonChips?`<div class="jd-non" style="margin-top:10px">${nonChips}</div>`:''}
    </div>
    <div class="tbl-wrap" style="border-radius:9px;margin-top:8px"><table>
      <thead><tr><th style="width:120px">准入 / 条件</th><th>本单取值</th></tr></thead><tbody>${condRows}</tbody></table></div>
    ${custJd?`<div class="note i" style="margin-top:8px">这个客户的默认描述已是 <b>${esc(jdOf(custJd.jdId).title||custJd.jdId)}</b>（${esc(custJd.at)} 存自 ${esc(custJd.from)}），下次给 ta 建同类需求会自动带出。</div>`:''}
  </div>`;
}

/* ---- 调整本单描述（只存 diff） ---- */
function openJdOverride(did){
  const d = D(did);
  if(!window.__JDO || window.__JDO.did!==did){
    const o = d.jdOverride || {};
    window.__JDO = { did, ov:{ add:[...(o.add||[])], del:[...(o.del||[])],
      tier:{...(o.tier||{})}, cond:{...(o.cond||{})}, notNeed:[...(o.notNeed||[])] } };
  }
  openModal(ovHtml(did));
}
function ovHtml(did){
  const d = D(did), j = jdOf(d.jdId), o = window.__JDO.ov;
  const base = jdSentences(j);
  const tierOpts = f => ['D1','D2','D3'].map(x=>`<option value="${x}">${x}</option>`).join('');
  const factorOpts = FACTORS_TRADE.filter(f=>f.trade===j.trade)
    .map(f=>`<option value="${f.id}">${esc(f.id)} · ${esc(f.name)}</option>`).join('');
  const sentOpts = base.map(s=>`<option value="${s.fid}">${esc(s.fid)} · ${esc(s.name)}（现在 ${esc(s.d)}）</option>`).join('');

  const cur = [
    ...o.add.map((a,i)=>`<div class="ovrow"><span class="b w">新增</span><span class="sm">${esc((factorOf(a.fid)||{}).name||a.fid)} ≥${esc(a.d)} · ${esc(a.gate)}</span>
      <span class="xs mut" style="flex:1">${esc(a.src||'')}</span><button class="btn xs danger" onclick="ovDrop('add',${i})">删</button></div>`),
    ...o.del.map((fid,i)=>`<div class="ovrow"><span class="b r">删除</span><span class="sm">${esc((factorOf(fid)||{}).name||fid)}</span>
      <span class="xs mut" style="flex:1">这一单不要这条</span><button class="btn xs danger" onclick="ovDrop('del',${i})">删</button></div>`),
    ...Object.entries(o.tier).map(([fid,dd],i)=>`<div class="ovrow"><span class="b i">改档</span><span class="sm">${esc((factorOf(fid)||{}).name||fid)} → ${esc(dd)}</span>
      <span class="xs mut" style="flex:1">会改变评分口径，已评分的人需重算</span><button class="btn xs danger" onclick="ovDrop('tier','${fid}')">删</button></div>`),
    ...Object.entries(o.cond).map(([k,v],i)=>`<div class="ovrow"><span class="b n">改条件</span><span class="sm">${esc(k)} → ${esc(v)}</span>
      <span class="xs mut" style="flex:1">只改这一单，不动标准</span><button class="btn xs danger" onclick="ovDrop('cond','${k}')">删</button></div>`),
  ].join('');

  return `<div class="md-h"><div><h3>调整本单描述 · ${esc(j.title)}</h3>
      <p>改的是这一单，标准层不动 · 只存差异，不复制全文 · 客户原话要留下来当依据</p></div>
    <button class="dr-x" onclick="closeAll()">×</button></div>
  <div class="md-b">
    <div class="sec"><div class="sec-t">已做的调整（${o.add.length+o.del.length+Object.keys(o.tier).length+Object.keys(o.cond).length}）</div>
      ${cur||'<div class="mut sm">还没有调整，这一单用的就是标准原文。</div>'}
    </div>

    <div class="sec"><div class="sec-t">加一句（客户特有要求）</div>
      <div class="frow">
        <div class="field"><label>因子</label><select id="ovFid">${factorOpts}</select></div>
        <div class="field" style="max-width:110px"><label>档位</label><select id="ovTier">${tierOpts()}</select></div>
        <div class="field" style="max-width:130px"><label>匹配规则</label><select id="ovGate">
          <option>必填</option><option>PASS</option><option>加分</option></select></div>
      </div>
      <div class="field"><label>客户原话（依据，必填）</label>
        <input id="ovSrc" placeholder="例：得能看懂装配图，别到时候图纸都问我"></div>
      <div style="margin-top:8px"><button class="btn sm" onclick="ovAdd()">＋ 加上这一句</button></div>
    </div>

    <div class="sec"><div class="sec-t">改档位</div>
      <div class="frow">
        <div class="field"><label>句子</label><select id="ovPick">${sentOpts}</select></div>
        <div class="field" style="max-width:110px"><label>改成</label><select id="ovNew">${tierOpts()}</select></div>
      </div>
      <div class="note w" style="margin-top:2px">改档位会改变评分口径 —— 已评分的人需要重算，页面会提示。</div>
      <div style="margin-top:8px"><button class="btn sm" onclick="ovSetTier()">应用改档</button></div>
    </div>

    <div class="sec"><div class="sec-t">改条件值（工价 / 地点 / 班次）</div>
      ${(j.conds||[]).map(([k,v])=>`<div class="frow" style="align-items:center">
        <div class="field" style="max-width:140px"><label>${esc(k)}</label></div>
        <div class="field"><input value="${esc(o.cond[k]!=null?o.cond[k]:v)}" onchange="ovSetCond('${esc(k)}',this.value)"></div>
      </div>`).join('')}
    </div>

    <div class="sec"><div class="sec-t">明确不需要</div>
      <div style="display:flex;flex-direction:column;gap:5px">
        ${(j.notNeed||[]).map(x=>`<label class="sm" style="display:flex;gap:7px;align-items:center">
          <input type="checkbox" ${o.notNeed.includes('-'+x)?'checked':''} onchange="ovToggleNon('${esc(x)}',this.checked)">
          <span>${esc(x)}</span><span class="xs mut">（勾=这一单去掉这条）</span></label>`).join('')}
      </div>
    </div>

    <div class="note i">标准层只能改清单 —— 这一页所有改动都会写进 <b>本单差异</b>，不出现在标准里，也不影响别的需求。要沉淀成通用口径，用「另存为该客户默认描述」。</div>
  </div>
  <div class="md-f"><button class="btn" onclick="closeAll()">取消</button>
    <button class="btn" onclick="ovSaveDefault('${did}')">另存为该客户默认描述</button>
    <button class="btn pri" onclick="ovSave('${did}')">保存本单调整</button></div>`;
}
function ovRerender(did){ openModal(ovHtml(did)); }
function ovDrop(kind, key){
  const o = window.__JDO.ov;
  if(kind==='add'||kind==='del') o[kind].splice(Number(key),1);
  else delete o[kind][key];
  ovRerender(window.__JDO.did);
}
function ovAdd(){
  const o = window.__JDO.ov;
  const fid = document.getElementById('ovFid').value;
  const d = document.getElementById('ovTier').value;
  const gate = document.getElementById('ovGate').value;
  const src = (document.getElementById('ovSrc').value||'').trim();
  if(!src){ toast('客户原话要填 —— 这是日后扯皮时唯一的依据'); return; }
  o.add.push({ fid, d, gate, from:'customer', src });
  o.del = o.del.filter(x=>x!==fid);
  ovRerender(window.__JDO.did);
}
function ovSetTier(){
  const o = window.__JDO.ov;
  const fid = document.getElementById('ovPick').value;
  const nd = document.getElementById('ovNew').value;
  o.tier[fid] = nd;
  ovRerender(window.__JDO.did);
}
function ovSetCond(k, v){ window.__JDO.ov.cond[k] = v; }
function ovToggleNon(x, on){
  const o = window.__JDO.ov;
  const key = '-' + x;
  if(on){ if(!o.notNeed.includes(key)) o.notNeed.push(key); }
  else { o.notNeed = o.notNeed.filter(y=>y!==key); }
}
function ovSave(did){
  const d = D(did), o = window.__JDO.ov;
  const n = o.add.length + o.del.length + Object.keys(o.tier).length + Object.keys(o.cond).length + o.notNeed.length;
  d.jdOverride = n ? { ...o, by: S.who||'金诚', at:'11-13 16:5' } : null;
  closeAll();
  openDemand(did);
  toast(n?`已保存本单调整 ${n} 处 · 只影响这一单`:'已清空本单调整，恢复标准原文');
}
function ovSaveDefault(did){
  const d = D(did);
  CUSTOMER_JD[d.client] = { jdId:d.jdId, from:d.id, at:'11-13 16:58' };
  closeAll();
  openDemand(did);
  toast(`已存为「${d.client}」的默认描述 —— 下次给 ta 建同类需求直接带出`);
}

/* ===== 上传简历（批量）· 三个入口 =====
   ① 批次内上传：主批次已定，逐人可加投别的需求
   ② 传简历建批次：先选需求，系统按「需求+日期+序号」建/并批次
   ③ 池子入库：只建档不投递，不要逐人加投（C1）
   共同点：渠道必填 —— 没渠道的档案等于不知道人从哪来 */
const UP_ROWS = [
  {name:'张建国', phone:'138****6621', skills:['非标设备','CNC']},
  {name:'周文杰', phone:'137****2234', skills:['装配','钳工']},
  {name:'邱实',   phone:'135****8834', skills:['电子装配']},
  {name:'王秀兰', phone:'135****7788', skills:['电气装配','接线']},
  {name:'秦志国', phone:'138****1102', skills:['PLC','伺服','电气调试']},
  {name:'蒋文斌', phone:'139****4417', skills:['CNC 操作','对刀']},
  {name:'龚雪',   phone:'137****8823', skills:['IQC','卡尺']},
  {name:'段鹏',   phone:'136****5519', skills:['船舶电工']},
];
/* 岗位画像关键词，用于「这个人还适合哪个需求」的建议（真实系统由 AI 匹配出分） */
const UP_KEYS = {D3:['IQC','检验','卡尺','千分尺','品质'], D4:['电工','船舶','舾装','船厂'], D5:['总装','装配','流水线','组装'], D2:['激光','装配','光路'], D7:['CNC','对刀','FANUC','三菱','加工中心']};
let UP_CTX = {mode:'batch', bid:null, mainDid:'', ch:'', chNote:''};

/* 某需求今天「我」的批次：有则复用，没有则导入时自动新建 */
function upLand(did){
  const me = (typeof S!=='undefined' && S.who) || '李文静';
  const ex = BATCHES.find(x=>x.demandId===did && x.owner===me && x.date===TODAY && x.status==='进行中');
  if(ex) return {code:ex.code, isNew:false};
  const n = nextSeq(did, TODAY);
  return {code:batchName(did, TODAY, n||0), isNew:true};
}
function upCands(mainDid){
  const me = (typeof S!=='undefined' && S.who) || '李文静';
  return DEMANDS.filter(d=>d.id!==mainDid && d.status==='招聘中' && allocOf(d.id).some(a=>a.staff===me));
}
function upRowState(row, mainDid, poolOnly){
  const pe = PEOPLE.find(x=>x.phone===row.phone);
  if(!pe) return {pe:null, kind:'new', label:'新建档案', chip:'n'};
  if(poolOnly) return {pe, kind:'exists', label:`${pe.id} · 已在库（跳过，不覆盖原资料）`, chip:'i'};
  const act = activeAppsOf(pe.id);
  if(mainDid && act.some(p=>p.demandId===mainDid)) return {pe, kind:'dup', label:`${pe.id} · 本需求已在跟进`, chip:'r'};
  const other = act.filter(p=>p.demandId!==mainDid);
  if(other.length) return {pe, kind:'busy', label:`${pe.id} · 另在 ${other.length} 个需求跟进中`, chip:'w'};
  return {pe, kind:'idle', label:`${pe.id} · 空闲可捞`, chip:'i'};
}
/* 技能命中候选需求 → 给出「还适合哪个岗」的建议 */
function upSuggest(row){
  const cands = upCands(UP_CTX.mainDid);
  const pe = PEOPLE.find(x=>x.phone===row.phone);
  let best = null;
  cands.forEach(d=>{
    if(pe && activeAppsOf(pe.id).some(p=>p.demandId===d.id)) return;
    const keys = UP_KEYS[d.id] || [];
    const hit = keys.filter(k=>(row.skills||[]).some(s=>s.includes(k)||k.includes(s)));
    if(hit.length && (!best || hit.length>best.hit.length)) best = {d, hit};
  });
  return best;
}

}

function upSync(){
  const poolOnly = UP_CTX.mode==='pool';
  const noteBox = document.getElementById('upChNote');
  if(noteBox) noteBox.innerHTML = upChNoteHtml();
  const rows = [...document.querySelectorAll('.up-row:not(.skip)')];
  let extra = 0, notify = 0;
  rows.forEach(row=>{
    const sel = row.querySelector('.up-sel');
    const land = row.querySelector('.up-land');
    if(!sel) return;
    const pe = PEOPLE.find(x=>x.phone===row.dataset.phone);
    if(sel.value){
      const dupe = pe && activeAppsOf(pe.id).find(p=>p.demandId===sel.value);
      if(dupe){
        land.innerHTML = `<span style="color:var(--bad)">→ 该需求已在跟进（${esc(dupe.node)}），导入时会跳过这条</span>`;
      } else {
        const l = upLand(sel.value);
        extra++;
        land.innerHTML = `→ 落到 <b>${esc(l.code)}</b> <span class="mut">${l.isNew?'今天还没有批次，导入时自动新建':'今天已有批次，直接并进去'}</span>`;
        if(pe && activeAppsOf(pe.id).length) notify++;
      }
    } else {
      const r = UP_ROWS.find(x=>x.phone===row.dataset.phone);
      const sg = r ? upSuggest(r) : null;
      land.innerHTML = sg ? `顺手可加投 <b>${esc(sg.d.post)}</b> <span class="mut">技能命中 ${esc(sg.hit.join('、'))}</span> <span class="up-take" onclick="upTake(this,'${sg.d.id}')">采纳</span>` : '';
    }
  });
  const newCnt = rows.filter(r=>!PEOPLE.find(x=>x.phone===r.dataset.phone)).length;
  const total = rows.length + extra;
  const sum = document.getElementById('upSum');
  const btn = document.getElementById('upBtn');
  const chName = (CHANNELS.find(c=>c.id===UP_CTX.ch)||{}).name;
  const chTip = UP_CTX.ch
    ? `渠道 <b>${esc(chName)}</b>`

/* AI 匹配（v1.2：硬条件三态 + 加分只排序 + 绑定需求版本） */
function runMatch(bid, forceScope){
  const b = B(bid) || {};
  const d = D(b.demandId);
  if(!d){ toast('该批次未关联需求'); return; }
  const scope = forceScope || S.f.mScope || 'demand';
  S.f.mScope = scope;
  const pool = PERSONS.filter(p => scope==='batch' ? p.batchId===bid : p.demandId===d.id);
  const rows = pool.map(p=>{
    const items = assessPerson(p, d);
    return {p, items, sum: triSum(items), bonus: bonusOf(p,d).filter(x=>x.hit).length, score:p.score};
  }).sort((x,y)=> (TRI_RANK[x.sum]-TRI_RANK[y.sum]) || (y.score-x.score));

  const av = activeVer(d);
  /* 没有生效版本 = 条件未定，任何人都不能进「可推荐」；否则会出现「顶部说禁止推荐、底部提示推荐成功」 */
  const canRec = !!av;
  const okRows = rows.filter(r=>r.sum==='ok');
  const okN = canRec ? okRows.length : 0;
  const blockedN = canRec ? 0 : okRows.length;
  const pendN = rows.filter(r=>r.sum==='pend').length;
  const noN = rows.filter(r=>r.sum==='no').length;
  const stale = matchNeedsUpdate(d);
  const stamp = MATCH_STAMP[d.id] || {};

  openModal(`
    <div class="md-h"><div><h3>AI 匹配结果 <span class="b n" style="font-size:10px;vertical-align:middle">演示逻辑</span></h3>
      <p>${esc(pool.length?'':'')}依据需求 <span class="mono">${esc(d.code)}</span> · 生效版本 <span class="mono">${esc(av?av.v:'无')}</span> · 硬条件逐项判断</p></div>
      <button class="dr-x" onclick="closeAll()">×</button></div>
    <div class="md-b">

      ${av? '' : `<div class="note r" style="margin-bottom:12px"><b>该需求没有生效版本</b>（${esc(d.confirm)}），本次结果仅作演示，<b>不得作为推荐依据</b>；下方「可推荐」已归零，推荐入口不可用。</div>`}
      ${stale? `<div class="note w" style="margin-bottom:12px"><b>匹配结果需更新</b>：需求条件已变更（结果基于 ${esc(stamp.ver||'—')}，当前生效 ${esc(av?av.v:'无')}）。
        <button class="btn xs" style="margin-left:8px" onclick="refreshMatch('${bid}')">按当前版本重算</button></div>`:''}

      <div style="display:flex;gap:8px;margin-bottom:14px">
        ${[['ok',okN,'可推荐'],['pend',pendN,'待补依据'],['no',noN,'不可推荐']].map(([k,v,lab])=>`
          <div style="flex:1;text-align:center;background:#fff;border:1px solid var(--line);border-radius:9px;padding:11px">
            <div class="xs mut">${esc(lab)}</div>
            <div class="mono" style="font-size:22px;font-weight:600;color:${k==='ok'?'var(--good)':k==='pend'?'var(--warn)':'var(--bad)'}">${v}</div>
            <div class="xs">${tri(k)}</div>
            ${k==='ok'&&!canRec&&blockedN?`<div class="xs mut">${blockedN} 人条件已符合，但需求未生效</div>`:''}</div>`).join('')}
      </div>

      <div class="toolbar" style="border:1px solid var(--line);border-radius:9px;margin-bottom:10px">
        <span class="chip ${scope==='demand'?'on':''}" onclick="runMatch('${bid}','demand')">本需求全部 ${PERSONS.filter(p=>p.demandId===d.id).length} 人</span>
        <span class="chip ${scope==='batch'?'on':''}" onclick="runMatch('${bid}','batch')">只看本批次 ${PERSONS.filter(p=>p.batchId===bid).length} 人</span>
        <div class="sp"></div>
        <span class="xs mut">S/A/B/C/D 与分数为演示口径，不参与符合性判断</span>
      </div>

      ${rows.map(r=>{
        const bad = r.items.filter(i=>i.state!=='ok' && !i.soft);
        const why = bad.length
          ? bad.map(i=>`${i.label.split(' / ')[0]}${i.state==='no'?'不符合':'待确认'}`).join(' · ')
          : '全部硬条件已核实符合';
        return `<div style="display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:9px;padding:10px 12px;margin-bottom:6px;cursor:pointer"
            onclick="closeAll();openMatchDetail('${r.p.id}','${d.id}')">
          ${triS(r.sum)}
          <div style="flex:1"><div class="sm"><b>${esc(r.p.name)}</b> <span class="xs mut">${esc(r.p.skills[0]||'')} · ${r.p.age}岁 · ${esc(r.p.gender)}</span>
            <span class="tier ${r.p.tier}" style="transform:scale(.85)">${r.p.tier}</span>
            <span class="mono xs mut">${r.score} 分</span></div>
            <div class="xs ${bad.length?'':'mut'}" style="color:${r.sum==='no'?'var(--bad)':r.sum==='pend'?'var(--warn)':''}">${esc(why)}</div></div>
          <span class="link">看依据</span></div>`;
      }).join('') || '<div class="empty">该范围内没有候选人</div>'}

      <div class="note" style="margin-top:12px">判断口径：任一硬条件<b>已确认不符合</b> → 整体不可推荐；无明确不符合但存在<b>信息待确认</b> → 整体待确认；全部<b>已核实符合</b> → 才可推荐。
        加分项只影响排序，<b>不得</b>覆盖 Pass 判断。资料缺失一律记「待确认」，不自动当作符合或不符合。</div>
    </div>
    <div class="md-f"><button class="btn" onclick="closeAll()">关闭</button>
      ${stale?`<button class="btn" onclick="refreshMatch('${bid}')">按当前版本重算</button>`:''}
      ${canRec
        ? `<button class="btn pri" onclick="closeAll();toast('已把 ${okN} 位「已核实符合」的人加入优先跟进')">加入优先跟进（${okN} 人）</button>`
        : `<button class="btn" title="需求没有生效版本，未审核不得推荐" onclick="recBlocked('${d.id}')">不可推荐（需求未生效）</button>`}
    </div>`, 'md-xl');
}
/* 拦截原因必须点名：哪一步没过、为什么不能推荐，而不是一个灰按钮 */
function recBlocked(did){
  const d = D(did);
  const ov = openVer(d);
  const why = ov
    ? `该需求当前是「${ov.status}」的 ${ov.v}，未经内部审核通过不生效`
    : `该需求当前为「${d.confirm}」，还没有生效版本`;
  toast(`不可推荐：${why}。请先完成代登记与内部审核，再用生效版本重算匹配`);
}
function refreshMatch(bid){
  const b = B(bid)||{}; const d = D(b.demandId); if(!d) return;
  const av = activeVer(d);
  MATCH_STAMP[d.id] = {ver: av?av.v:'—', at:'2026-11-14 08:30', stale:false};
  runMatch(bid, S.f.mScope||'demand');
  toast('已按 '+(av?av.v:'当前版本')+' 重新判断');
}

/* ===== 档案详情（人）／AI 找候选人／记录联系（含录音解析） ===== */

/* -------------------------------------------------------------
   人详情：一个抽屉，四个页签（2026-11-14 定 · P0-0）
   -------------------------------------------------------------
   以前是两个抽屉并存：openPerson（投递详情，只有进度）与 openArchive（档案详情，有简历）。
   两个标题长得一模一样，点进去内容完全不同 —— 这就是"有些名字点进去不是我想的那个"。
   现在统一成 openHuman(personId)，所有入口都往这里走：

     简历明细（默认）  候选人自己给的，可对客户
     人才画像          我们的判断，仅内部（内部日常看这个更多，所以紧挨简历）
     本次投递          这一单谈到哪
     沟通记录          跨投递、跨专员合并

   页签记住上次停留（localStorage），他每天推进度，不想每次翻到第三个。
   ------------------------------------------------------------- */

const HU_TABS = [
  {k:'resume',  n:'简历明细', tip:'候选人自己给的'},
  {k:'portrait',n:'人才画像', tip:'我们的判断 · 仅内部'},
  {k:'apply',   n:'本次投递', tip:'这一单谈到哪'},
  {k:'talk',    n:'沟通记录', tip:'跨投递合并'},
];
let HU = {pid:null, appId:null, tab:'resume'};

function huMemGet(){ try{ return localStorage.getItem('rg-human-tab')||'resume'; }catch(e){ return 'resume'; } }
function huMemSet(t){ try{ localStorage.setItem('rg-human-tab', t); }catch(e){} }

/* 空态判断与状态标 */
function archiveState(p){
  const act = activeAppsOf(p.id);
  if(p.blacklist) return {label:'黑名单', tone:'r'};
  if(appsOf(p.id).some(a=>a.node==='已入职')) return {label:'已入职', tone:'g'};
  if(act.length) return {label:'投递中 · ' + act.length + ' 个需求', tone:'i'};
  return {label:'空闲可捞', tone:'g'};
}

/* 统一入口：openArchive(personId, tab) / openPerson(appId) 都到这里 */
function openHuman(pid, tab, appId){
  HU.pid = pid;
  if(appId) HU.appId = appId;
  const cur = HU.appId ? P(HU.appId) : null;
  if(!cur || cur.personId!==pid){
    const act = activeAppsOf(pid);
    HU.appId = (act[0]||appsOf(pid)[0]||{}).id || null;
  }
  HU.tab = tab || huMemGet();
  huPaint();
}
function huPaint(){ openDrawer(huHtml()); }
function huSetTab(t){ HU.tab = t; huMemSet(t); huPaint(); }
function huAppTo(appId){ HU.appId = appId; HU.tab = 'apply'; huMemSet('apply'); huPaint(); }
/* 兼容入口：全站所有「点人名」都收口到 openHuman */
function openArchive(id, tab){ openHuman(id, tab); }
function openPerson(id){
  const a = P(id);
  openHuman(a ? a.personId : id, null, a ? id : null);
}
function huCopy(id){ toast('档案编号 ' + id + ' 已复制'); }

/* 补全链接：APP 推送之外，还要能复制到微信手动发 —— 候选人未必看 APP 通知 */
function copyFillLink(pid){
  const url = 'https://rg.zhaopin.local/fill/' + (pid||'') + '?t=' + Math.random().toString(36).slice(2,8);
  const done = () => toast('补全链接已复制，可直接粘贴到微信发给候选人');
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(url).then(done).catch(()=>{ fallbackCopy(url); done(); });
  } else { fallbackCopy(url); done(); }
}
function fallbackCopy(txt){
  const ta = document.createElement('textarea');
  ta.value = txt; ta.style.cssText = 'position:fixed;left:-9999px';
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand('copy'); }catch(e){}
  document.body.removeChild(ta);
}

function huHtml(){
  const p = appPerson(HU.pid), st = archiveState(p);
  const apps = appsOf(p.id), cs = contactsOf(p.id);
  const last = cs[0];
  const days = t => Math.round((new Date(TODAY+'T00:00:00') - new Date(t.slice(0,10)+'T00:00:00'))/86400000);
  const ago = last ? days(last.time) : null;
  const appsN = apps.filter(a=>a.status==='跟进中').length;

  const vf = verifyOf(p.id);
  const pendN = [vf.city&&vf.city.wantState!=='已确认', vf.arrive&&vf.arrive.state!=='已确认',
    vf.night&&vf.night.state!=='已确认愿意', !(vf.certs||[]).some(c=>c.state==='ok')].filter(Boolean).length;
  const badge = {resume:'', verify: pendN, portrait:'', apply: appsN||apps.length, talk: cs.length};

  const body = HU.tab==='resume' ? huResume(p)
    : HU.tab==='verify' ? huVerify(p)
    : HU.tab==='portrait' ? huPortrait(p)
    : HU.tab==='apply' ? huApply(p)
    : huTalk(p, cs, apps);

  return `
    <div class="dr-h"><div>
      <h3>${esc(p.name)} <span class="xs mut" style="font-weight:400">${p.gender} · ${p.age}岁 · ${esc(p.phone)}</span></h3>
      <div class="sub">档案 <span class="arc-link mono" onclick="huCopy('${esc(p.id)}')">${esc(p.id)}</span>
        · 当前跟进人 <b>${esc(p.follower||p.createdBy||'—')}</b>
        · 进入 ${esc(p.createdAt)}（${days(p.createdAt)} 天前）</div></div>
      <button class="dr-x" onclick="closeAll()">×</button></div>
    <div class="dr-b">
      <div class="arc-top">
        <span class="b ${st.tone}">${esc(st.label)}</span>
        <span class="b n">${esc(p.channel)}</span>
        ${last?`<span class="sm ${ago>60?'arc-late':ago>30?'arc-warn':''}">最近沟通 ${last.time.slice(5)}（${ago} 天前）</span>`:'<span class="sm mut">尚无沟通记录</span>'}
        <span class="sm mut">沟通 ${cs.length} 次</span>
        <div class="sp"></div>
        <span class="sm mut">点姓名到处都能进这一页</span>
      </div>

      <div class="arc-tabs">
        ${HU_TABS.map(t=>`<span class="arc-tab ${HU.tab===t.k?'on':''}" onclick="huSetTab('${t.k}')">
          ${t.n}${badge[t.k]!==''?` <i class="vis n">${badge[t.k]}</i>`:''}
          ${t.k==='portrait'?'<i class="vis no">仅内部</i>':t.k==='resume'?'<i class="vis ok">可对客户</i>':''}
        </span>`).join('')}
      </div>

      ${body}
    </div>
    <div class="dr-f"><button class="btn" onclick="closeAll()">关闭</button>
      <button class="btn" onclick="openModal(transferModal('${esc(p.id)}'))">转交跟进</button>
      <button class="btn" onclick="openModal(followModal('${esc(p.id)}','archive'),'md-lg')">记录联系</button>
      <button class="btn pri" onclick="openModal(poolPickBatch('${esc(HU.appId||p.id)}'))">捞入批次</button></div>`;
}

/* ---------- 页签 2 · 核实依据（证书 / 城市 / 到岗 / 夜班） ---------- */
/* 按姓名索引：同一手机号重复投递复用同一档案 id，硬编码 PE00X 会错位 */
const VER_CONFLICT = {
  '马长青':[{need:'电工特种作业操作证是否在有效期',
          a:'简历技能栏写「电工证书」', b:'2026-11-13 电话：「证过期了，正在复审」'}],
  '陈志强':[{need:'低压电工证证件信息是否可辨',
          a:'简历附件上传了证书照片', b:'照片模糊，证件号与发证日期看不清'}],
};
function huVerify(p){
  const v = verifyOf(p.id);
  const certs = v.certs || [], c = v.city || {}, a = v.arrive || {}, n = v.night || {};
  const certState = certs.some(x=>x.state==='ok') ? 'ok' : certs.some(x=>x.state==='no') ? 'no'
    : certs.length ? 'pend' : 'pend';
  const gaps = [];
  if(c.wantState !== '已确认') gaps.push('愿意工作城市');
  if(!(a.date && a.state==='已确认')) gaps.push('可到岗时间');
  if(n.state !== '已确认愿意' && n.state !== '已确认不愿') gaps.push('夜班意愿');
  if(!certs.some(x=>x.state==='ok')) gaps.push('已核验的证书');

  const row = (label, state, need, got, src, ev, at, note) => `
    <div class="tri-row">
      <div class="tr-l"><b>${esc(label)}</b><div class="xs mut">要求：${esc(need)}</div></div>
      <div class="tr-v">${tri(state)}<div class="sm" style="margin-top:3px">${esc(got)}</div>
        <div class="tr-n">${src?`来源：${esc(src)}`:'来源：—'}${ev?` · 原文：${esc(ev)}`:''}${at&&at!=='—'?` · 确认于 ${esc(at)}`:''}
        ${note?`<br>${esc(note)}`:''}</div></div>
    </div>`;

  return `
  <div class="note" style="margin-bottom:14px">核实依据只记录<b>客户明示的硬条件</b>，每条都要有来源。技能关键词<b>不等于</b>持证；现居地<b>不推断</b>异地意愿；投递状态<b>不推断</b>可到岗。</div>

  <div class="sec"><div class="sec-t">证书<span class="perm">独立字段 · 需核验</span></div>
    <div class="xs mut" style="margin-bottom:9px">只记<b>作业证书</b>（低压电工证、焊工证、特种设备作业证等）。
      职称（技师 / 高级技师 / 工程师）是等级评定，<b>不等于</b>作业证书，不写在这一栏，也不据此判为持证。</div>
    ${certs.length ? certs.map(x=>row(x.name, x.state, '客户要求的有效证件', 
        x.state==='ok'?'已核验证件有效':x.state==='no'?'候选人明确表示不满足':'待核验',
        x.src, x.ev, x.at, x.state==='pend'?'证据不足，未核验前不得视为持证':'' )).join('')
      : `<div class="tri-row"><div class="tr-l"><b>无证书记录</b><div class="xs mut">要求：按岗位</div></div>
          <div class="tr-v">${tri('pend')}<div class="sm" style="margin-top:3px">没有可核验的证书</div>
          <div class="tr-n">技能栏出现「电工」「电工证书」等词，<b>不得</b>据此判定持证；需索要证件照片并核验。</div></div></div>`}
    ${v.certNote?`<div class="note w" style="margin-top:8px">${esc(v.certNote)}</div>`:''}
  </div>

  <div class="sec"><div class="sec-t">工作城市<span class="perm">现居 ≠ 愿意去</span></div>
    ${row('现居地', c.liveState==='已核实'?'ok':'pend', '—', c.live||'—', c.src, '', c.at, '现居地本身不做匹配依据')}
    ${row('愿意工作城市', c.wantState==='已确认'?'ok':'pend', '客户岗位所在城市',
        (c.want||[]).length ? c.want.join('、') : '未确认',
        c.src, '', c.at, c.wantState==='已确认'?'':'意愿缺失时一律待确认，不按现居地推断')}
  </div>

  <div class="sec"><div class="sec-t">可到岗时间<span class="perm">须候选人确认</span></div>
    ${(()=>{
      /* 与当前查看的这次投递对应需求比对最晚报到日（第 7 项）；没有投递记录时退回最近一次投递。
         必须读**生效版本**的到岗日（gateOf），不能读本单调整里的待确认值（effVal）——
         否则同一人在匹配页判不符合、在核实依据页判符合，两处结论相反（R4）。 */
      const curApp = (HU.appId && P(HU.appId)) || appsOf(p.id)[0] || null;
      const dm = curApp ? D(curApp.demandId) : null;
      const g = dm ? gateOf(dm) : {};
      const need = String(g.arriveBy || '').match(/\d{4}-\d{2}-\d{2}/)
        ? String(g.arriveBy).match(/\d{4}-\d{2}-\d{2}/)[0] : '';
      const av = dm ? activeVer(dm) : null;
      const avTag = av ? `（生效 ${av.v}）` : '';
      const dv = (String(a.date || '').match(/\d{4}-\d{2}-\d{2}/) || [])[0] || '';
      const late = !!(dv && need && a.state === '已确认' && dv > need);
      const st = late ? 'no' : (a.state === '已确认' ? 'ok' : 'pend');
      const got = a.date ? a.date + ' 起可到岗' : '未确认';
      const note = late
        ? `候选人确认的可到岗日期 ${dv} <b>晚于</b>需求（${esc(dm.post)}）生效版本${avTag}要求的最晚报到日 ${need}，按日期依据判为<b>已确认不符合</b>。`
        : (a.state === '已确认' ? '' : '没有候选人确认的时间就不算可到岗，与是否有进行中投递无关');
      return row('可到岗日期', st, dm ? `需求最晚报到日 ${need || '—'}${avTag}` : '需求最晚报到日', got, a.src, '', a.at, note);
    })()}
  </div>

  <div class="sec"><div class="sec-t">夜班意愿</div>
    ${row('夜班', n.state==='已确认愿意'?'ok':n.state==='已确认不愿'?'no':'pend', '客户班制',
        n.state||'未确认', n.src, '', n.at, n.state==='已确认不愿'?'候选人明确拒绝，属已确认不符合':'')}
  </div>

  ${(VER_CONFLICT[p.name]||[]).length?`<div class="sec"><div class="sec-t">信息冲突<span class="perm">待核实</span></div>
    ${VER_CONFLICT[p.name].map(x=>`<div class="note r"><b>${esc(x.need)}</b><br>
      · ${esc(x.a)}<br>· ${esc(x.b)}<br><span class="xs">两条记录不一致，暂按「信息待确认」处理，不静默选取有利值。</span></div>`).join('')}
  </div>`:''}

  <div class="sec"><div class="sec-t">信息缺口（${gaps.length}）</div>
    ${gaps.length ? `<div class="sm">${gaps.map(g=>`<span class="b w" style="margin:0 6px 6px 0">${esc(g)}</span>`).join('')}</div>
      <div class="note" style="margin-top:8px">缺口不会被自动当作「符合」或「不符合」，在匹配里统一显示为<b>信息待确认</b>。</div>`
      : `<div class="sm">硬条件依据齐全，可进入匹配判断。</div>`}
  </div>`;
}

/* ---------- 页签 3 · 人才画像 ---------- */
function huPortrait(p){
  const pts = ptOf(p.id);
  const dims = ['稳定性','意向','履约','适配','风险'];

/* ---------- 页签 3 · 本次投递 ---------- */
function huApply(p){
  const apps = appsOf(p.id);
  if(!apps.length) return `<div class="empty">这个人还没有任何投递 —— 从人才池「捞入批次」后会生成第一条</div>`;
  const id = HU.appId || apps[0].id;
  const a = P(id);
  if(!a) return `<div class="empty">投递记录不存在</div>`;

  const idx = NODES.indexOf(a.node);
  const steps = [
    {n:'匹配', desc: a.tier? `档位 ${a.tier} · ${a.score} 分 · 已通过硬门槛` : '尚未运行匹配',
      ops:[`<button class="btn xs" onclick="toast('已重算，档位 ${a.tier||'B'}')">重算</button>`,`<button class="btn xs" onclick="toast('打开逐维度依据')">看依据</button>`]},
    {n:'触达', desc: a.lastContact==='—'? '尚未联系' : `上次 ${a.lastContact.slice(5)} · ${a.lastType}`,
      ops:[`<button class="btn xs" onclick="openModal(followModal('${a.id}'))">记录联系</button>`,`<button class="btn xs danger" onclick="toast('已标为无意向，人员回到人才池')">标无意向</button>`]},
    {n:'补全复核', desc: a.node==='补全中'? '已发链接，等待提交' : (idx>=3? '已复核通过' : '未开始'),
      ops:[`<button class="btn xs" onclick="toast('补全链接已发送 → 候选人 APP 收到一条待办')">发补全链接</button>`,
        `<button class="btn xs" onclick="copyFillLink('${a.personId}')">复制链接</button>`,
        `<button class="btn xs" onclick="toast('复核通过，12 项因子已更新')">复核通过</button>`]},
    {n:'面试', desc: ['待面试','面试通过'].includes(a.node)? (a.node==='面试通过'?'客户已确认通过':'已约面试，等待到面') : '未提报',
      ops:[`<button class="btn xs" onclick="toast('已提报客户，等待排期')">提报面试</button>`,`<button class="btn xs" onclick="toast('已登记面试结果')">登记结果</button>`]},
    {n:'入职安排', desc: a.node==='待入职'? '已确认，等待报到' : (a.node==='已入职'?'已报到':'未开始'),
      ops:[`<button class="btn xs" onclick="toast('已推进到下一段')">推进</button>`,`<button class="btn xs danger" onclick="toast('已跳票，人员回到人才池')">跳票回池</button>`]},
    {n:'体检与建档', desc: a.node==='已入职'? '体检通过，档案已建' : '未开始',
      ops:[`<button class="btn xs" onclick="toast('体检报告已审核')">审核体检</button>`,`<button class="btn xs" onclick="toast('员工档案已建立')">完成建档</button>`]},
  ];
  const stepState = i => {
    const map = {'新入库':0,'已匹配':1,'触达中':2,'补全中':3,'待面试':4,'面试通过':4,'待入职':5,'已入职':6,'已淘汰':1};
    const cur = map[a.node]||0;
    return i<cur? 'done' : i===cur? 'now' : 'todo';
  };
  const fl = FOLLOWS.filter(f=>f.personId===a.id).sort((x,y)=>y.time.localeCompare(x.time));
  const d = D(a.demandId);

  return `
    <div class="sec"><div class="sec-t">这一单</div>
      <div style="background:#fff;border:1px solid var(--line);border-radius:10px;padding:13px 15px">
        <div class="sm"><b class="arc-link" onclick="openDemand('${a.demandId}')">${esc(d.post)}</b>
          <span class="xs mut">· ${esc(d.client)} · ${esc(d.project)}</span></div>
        <div class="xs mut mono" style="margin-top:3px">${esc(d.code)} · ${a.batchId?esc(B(a.batchId).code):'人才池捞入'} · 负责人 ${esc(a.owner)}</div>
        <div style="display:flex;gap:8px;align-items:center;margin-top:9px">
          ${tierChip(a.tier)} ${nodeB(a.node)} ${statB(a.status)}
          <span class="xs mut">匹配分 ${a.score}</span>
          <div class="sp"></div>
          <button class="btn xs" onclick="openModal(transferModal('${esc(p.id)}'))">转交这一单</button>
        </div>
      </div>
    </div>

    ${apps.length>1?`<div class="sec"><div class="sec-t">同一个人共 ${apps.length} 条投递 · 点一下原地切换</div>
      <div class="chips">
        ${apps.map(x=>`<span class="chip ${x.id===a.id?'on':''}" onclick="huAppTo('${x.id}')">
          ${esc(D(x.demandId).post)}${x.status==='跟进中'?'':' · 已结束'}</span>`).join('')}
      </div>
      <div class="xs mut" style="margin-top:7px">每条投递的分数、进度、负责人各自独立，切换不重开抽屉。</div>
    </div>`:''}

    <div class="sec"><div class="sec-t">进度（每个节点都能操作）</div>
      <div class="flow">${steps.map((s,i)=>`
        <div class="flow-item ${stepState(i)}">
          <div class="fv">${i<stepState(0)?'':i+1}</div>
          <div class="fb"><div class="ft"><span class="fn">${s.n}</span>
            ${stepState(i)==='now'?'<span class="b a">当前</span>':''}</div>
            <div class="fd">${s.desc}</div>
            <div class="fops">${stepState(i)==='todo'? '':s.ops.join('')}</div>
          </div>
        </div>`).join('')}</div>
    </div>

    <div class="sec"><div class="sec-t">这一单的联系记录（${fl.length}）</div>
      ${fl.length? `<div class="tl">${fl.map(f=>`<div class="tl-item hot"><div class="tl-d">${f.time} · ${f.type} · ${esc(f.staff)}</div>
        <div class="tl-t">${esc(f.note)}</div></div>`).join('')}</div>`
      : '<div class="mut sm">这一单还没有联系记录</div>'}
    </div>`;
}

      </div>`).join('')||'<div class="mut sm">暂无沟通记录</div>'}</div>

    ${tr.length?`<div class="sec"><div class="sec-t">转交记录（${tr.length}）</div>
      <div class="tl">${tr.map(t=>`<div class="tl-item"><div class="tl-d">${esc(t.at)}</div>

      <div class="xs mut" style="margin-top:6px">转交历史不可删除；转回自己也算一条。</div>
    </div>`:''}`;
}

function trDo(pid){
  const to = document.getElementById('trTo').value;
  const why = document.getElementById('trWhy').value;
  const note = (document.getElementById('trNote').value||'').trim();
  const p = appPerson(pid);
  const from = p.follower || p.createdBy;
  p.follower = to;
  TRANSFERS.unshift({personId:pid, from, to, at:TODAY+' '+new Date().toTimeString().slice(0,5), why: note?why+' · '+note:why});
  closeAll();
  huPaint();
  toast(`已转交：${from} → ${to}，流水已记`);
}

/* 召回 + 打分（演示口径：技能命中 + 完成度 + 履历稳定） */
function aiRank(did){
  const d = D(did);
  const keys = {
    D1:['售后','设备','调试','电气','PLC'], D2:['激光','装配','光路','光电'], D3:['IQC','检验','卡尺','千分尺','品质'],
    D4:['电工','船舶','舾装','船厂'], D5:['总装','装配','流水线','组装'], D6:['售后','3C','客服'],
    D7:['CNC','对刀','FANUC','三菱','加工中心'], D8:['钳工','装配','光伏','机修'],
  }[did] || [];
  let pool = PEOPLE.filter(p=>!p.blacklist);
  const total = pool.length;
  if(AI.city) pool = pool.filter(p=>(p.city||'').includes(AI.city.split('·')[0]));
  if(AI.age) pool = pool.filter(p=>p.age<=Number(AI.age));
  if(AI.cert==='电工') pool = pool.filter(p=>p.skills.some(s=>s.includes('电工'))||p.skills.some(s=>s.includes('电气')));
  if(AI.cert==='焊工') pool = pool.filter(p=>p.skills.some(s=>s.includes('焊')));
  if(AI.arrived==='now') pool = pool.filter(p=>!activeAppsOf(p.id).length);
  const pre = pool.length;

  const scored = pool.map(p=>{
    const hit = keys.filter(k=>p.skills.some(s=>s.includes(k)||k.includes(s)));
    let score = 52 + hit.length*13 + Math.round((p.complete-70)/4);
    const apps = appsOf(p.id);
    if(apps.some(a=>a.node==='已入职')) score = 0;
    score = Math.max(0, Math.min(97, score));
    const tier = score>=85?'S':score>=80?'A':score>=60?'B':score>=40?'C':'D';
    const bad = apps.find(a=>a.node==='已淘汰'||a.status==='无意向');
    return {p, score, tier, hit, total, pre, bad,
      short: hit.length>=keys.length? '' : '未命中：'+keys.filter(k=>!hit.includes(k)).slice(0,2).join('、')};
  }).filter(x=>x.p.id && x.score>0).sort((a,b)=>b.score-a.score).slice(0,14);
  return {list:scored, total, pre, keys};
}

function aiFlowHtml(r){
  return `<div class="ai-stat"><span>全池 <b>${r.total}</b> 人</span><span class="ar">→</span>
    <span>硬条件预筛 <b>${r.pre}</b> 人</span><span class="ar">→</span>
    <span>AI 精排 <b>${r.list.length}</b> 人</span>
    <span class="mut xs" style="margin-left:auto">技能命中 ${esc((r.keys||[]).join('、'))}</span></div>`;
}

function aiListHtml(r){
  const groups = ['S','A','B','C','D'];
  return groups.map(g=>{
    const list = r.list.filter(x=>x.tier===g);
    if(!list.length) return '';
    const label = {S:'强匹配',A:'匹配',B:'可用',C:'需补强',D:'不建议'}[g];
    return `<div class="ai-grp"><div class="ai-grp-h">
        <span class="tier ${g}">${g}</span><span class="sm">${label}</span>
        <span class="sm mut">${list.length} 人</span>
        <span class="link xs" style="margin-left:auto" onclick="aiPickGroup('${g}')">${g==='S'||g==='A'?'全选本组':''}</span>
      </div>
      ${list.map(x=>`<div class="ai-row">
        <input type="checkbox" class="ai-ck" ${AI.picked[x.p.id]?'checked':''} onchange="aiPick('${x.p.id}',this.checked)">
        <div style="flex:1;min-width:0">
          <div class="sm"><b class="arc-link" onclick="openArchive('${x.p.id}','portrait')">${esc(x.p.name)}</b>
            <span class="xs mut">${x.p.age}岁 · ${esc(x.p.channel)} · ${x.p.complete}%</span>
            ${x.bad?`<span class="b w" title="推荐时带避坑提示">避坑</span>`:''}</div>
          <div class="xs mut">${x.hit.length?`命中 ${esc(x.hit.join('、'))}`:''}${x.short?' · '+esc(x.short):''}</div>
          ${x.bad?`<div class="ai-pit">曾被 ${esc(x.bad.owner)} 淘汰：${esc(x.bad.reason||'期望薪资超出上限')}（${esc(x.bad.lastContact.slice(5,10))}）</div>`:''}
        </div>
        <div class="ai-score"><b>${x.score}</b><span>${x.tier}</span></div>
      </div>`).join('')}</div>`;
  }).join('') + (r.list.length?'':'<div class="mut sm" style="padding:14px">没有符合条件的候选人，放宽预筛条件试试</div>');
}

function aiRefresh(){
  const r = aiRank(AI.did);
  document.getElementById('aiFlow').innerHTML = aiFlowHtml(r);

/* ===== R04 我的首页 =====
   首页只有一个目的：往上上人（录音原话"最终这个软件它最终的目的就是为了效率"）。
   所以第一屏就是「我负责的岗位」的宽表 —— 标题 + 明细全摊开，不折叠、不二次点击、
   点一下就能改；缺口与剩余天数两列加粗变色，因为这是每天扫一眼要用的两个数。
   卡片改宽表是因为"业务人员不怕长"，一屏 15–20 行 × 13 列。
   ============================================================= */

/* ---------- 排序状态（记住上次用的规则） ---------- */
const HD_SORT_KEYS = {
  gap:  {n:'缺口',     d:-1},
  days: {n:'剩余天数', d: 1},
  act:  {n:'在投',     d:-1},
  name: {n:'岗位名',   d: 1},
};
function hdLoadSort(){
  try{
    const v = JSON.parse(localStorage.getItem('rg-home-sort')||'null');
    if(Array.isArray(v) && v.length && v.every(x=>HD_SORT_KEYS[x.k])) return v;
  }catch(e){}
  return [{k:'gap', d:-1}];
}
let HS = {sort:null};
function hdSortState(){ if(!HS.sort) HS.sort = hdLoadSort(); return HS.sort; }
function hdSortSave(){ try{ localStorage.setItem('rg-home-sort', JSON.stringify(hdSortState())); }catch(e){} }
function hdSortClick(k){
  const st = hdSortState();
  const i = st.findIndex(x=>x.k===k);
  if(i<0){ st.push({k, d:HD_SORT_KEYS[k].d}); }
  else if(i===0){ st[0].d *= -1; }
  else { st[i].d *= -1; const [x]=st.splice(i,1); st.unshift(x); }
  HS.sort = st.slice(0,3);
  hdSortSave();
  hdRefresh();
}
function hdSortReset(){
  HS.sort = [{k:'gap', d:-1}];
  hdSortSave();
  hdRefresh();
}
function hdRefresh(){
  const m = document.getElementById('main');
  const sc = m.scrollTop;
  m.innerHTML = renderPage();
  m.scrollTop = sc;
}

/* ---------- 每行要算的数 ---------- */
function hdModel(d){
  const me = S.who;
  const a = allocOf(d.id).find(x=>x.staff===me) || {qty:0, hired:0, target:d.deadline};
  const ps = personsOf(d.id);
  const days = Math.ceil((new Date(d.deadline) - new Date(TODAY))/864e5);
  const price = parseFloat(String(d.price||'').replace(/[^\d.]/g,'')) || 0;
  return {
    d, a,
    mine: a.qty, mineHired: a.hired, gap: a.qty - a.hired,
    act: ps.filter(p=>p.status==='跟进中').length,
    itv: ps.filter(p=>p.node==='待面试').length,
    onb: ps.filter(p=>p.node==='待入职').length,
    days, price,
    name: d.post || '',
  };
}
function hdSortRows(rows){
  const st = hdSortState();
  return rows.slice().sort((x,y)=>{
    for(const {k,d} of st){
      let a=x[k], b=y[k];
      if(typeof a==='string' || typeof b==='string'){ a=String(a); b=String(b); return a.localeCompare(b)*d; }
      if(a!==b) return (a-b)*d;
    }
    return 0;
  });
}

/* ---------- 一行 ---------- */
function hdRow(m, i){
  const d = m.d;
  const late = m.days < 0, urgent = m.days >= 0 && m.days <= 15;
  const gapTone = m.gap > 0 ? 'var(--bad)' : 'var(--good)';
  return `<tr id="hdrow-${d.id}">
    <td style="min-width:210px">
      <div class="t-name"><span class="link-post" title="点开看岗位详情" onclick="pmOpen('${d.id}')">${esc(d.post)}</span>

    </td>

    <td class="num hd-ed" id="hdc-${d.id}-qty" onclick="hdEdit('${d.id}','qty')"><b>${m.mine}</b><span class="xs mut">/${d.head}</span></td>
    <td class="num">${m.mineHired}</td>

    <td class="num" style="color:${late?'var(--bad)':urgent?'var(--warn)':'var(--ink)'};font-weight:600;white-space:nowrap">
      ${late? '已过期 '+Math.abs(m.days)+' 天' : m.days+' 天'}</td>

/* ---------- 行内编辑（只改需求侧，标准值不在这里改） ---------- */
function hdEdit(did, f){
  const el = document.getElementById('hdc-'+did+'-'+f);
  if(!el || el.querySelector('input,select')) return;
  const d = D(did);
  if(f==='owner'){
    const cur = d.owner||'';
    el.innerHTML = `<select class="ed-in" onchange="hdSave('${did}','owner',this.value)">
      ${['李文静','陈曦','王浩'].map(n=>`<option ${n===cur?'selected':''}>${n}</option>`).join('')}</select>`;
    el.querySelector('select').focus();
    return;
  }
  if(f==='status'){
    const opts = ['招聘中','暂停','已完成','已关闭'];
    el.innerHTML = `<select class="ed-in" onchange="hdSave('${did}','status',this.value)">
      ${opts.map(n=>`<option ${n===d.status?'selected':''}>${n}</option>`).join('')}</select>`;
    el.querySelector('select').focus();
    return;
  }
  const a = allocOf(did).find(x=>x.staff===S.who) || {};
  const cur = f==='price'? d.price : f==='deadline'? d.deadline : f==='qty'? (a.qty||0) : d.head;
  el.innerHTML = `<input class="ed-in" type="${f==='deadline'?'date':'text'}" value="${esc(cur)}"
    onkeydown="if(event.key==='Enter'){this.blur()} if(event.key==='Escape'){hdReRow('${did}')}"
    onblur="hdSave('${did}','${f}',this.value)">`;
  const ip = el.querySelector('input');
  if(ip){ ip.focus(); if(ip.select) ip.select(); }
}
function hdSave(did, f, v){
  const d = D(did);
  if(f==='qty'){
    const a = allocOf(did).find(x=>x.staff===S.who);
    const old = a ? a.qty : 0;
    if(a) a.qty = +v || 0;
    toast(`已保存 · 我背人数：${old} → ${v}　（分配合计不得超过需求 ${d.head} 人）`);
    hdReRow(did);
    return;
  }
  const old = d[f];
  if(f==='head') d.head = +v || 0;
  else if(f==='price') d.price = /^\d+(\.\d+)?$/.test(String(v).trim()) ? String(v).trim()+' 元/时' : v;
  else d[f] = v;
  const key = (f==='head'||f==='deadline');
  toast(`已保存 · ${f}：${String(old)==='undefined'?'—':old} → ${f==='price'?d.price:v}${key?'　（关键内容变更，已发确认单需客户重确认）':''}`);
  hdReRow(did);
}
/* 只重算这一行，不重排、不刷新整表 */
function hdReRow(did){
  const row = document.getElementById('hdrow-'+did);
  if(!row) return;
  row.outerHTML = hdRow(hdModel(D(did)), 0);
}

/* ---- Tab2：工种技能因子（挂在 T2 上，一条因子 = 一根三档尺） ---- */
const isGapTier = x => !x || !x.label || x.label==='待补';
const factorHasGap = f => (f.tiers||[]).some(isGapTier);
/* 有精度指标才算「可数字化验收」；「—」「无要求」都不算 */
const hasMetric = x => !!(x && x.metric && x.metric!=='—' && x.metric!=='无要求');

function factorsTrade(bar){
  const tid = S.f.trade || 'T2-QG';
  const t = tradeOf(tid);
  const all = factorsOfTrade(tid);
  const q = (S.f.q||'').trim();
  const fk = S.f.fk || '';
  const usedN = f => PORTRAITS_V2.filter(p=>p.pick.some(x=>x[0]===f.id)).length;

  let rows = all;
  if(q) rows = rows.filter(f=>(f.id+f.name+f.question).includes(q));
  if(fk==='core')   rows = rows.filter(f=>f.core);
  if(fk==='gap')    rows = rows.filter(factorHasGap);
  if(fk==='unused') rows = rows.filter(f=>usedN(f)===0);

  const coreN   = all.filter(f=>f.core).length;
  const gapN    = all.filter(factorHasGap).length;
  const metricN = all.filter(f=>(f.tiers||[]).some(hasMetric)).length;
  const usedCnt = all.filter(f=>usedN(f)>0).length;

  const chips = TRADES.map(x=>`<span class="chip ${tid===x.id?'on':''}" onclick="setF('trade','${x.id}')">${esc(x.name)} · ${factorsOfTrade(x.id).length} 条</span>`).join('');
  const fchips = [
    {k:'',       label:'全部 '+all.length},
    {k:'core',   label:'核心 PASS 项 '+coreN},
    {k:'gap',    label:'刻度待补 '+gapN},
    {k:'unused', label:'未进画像 '+(all.length-usedCnt)},
  ].map(c=>`<span class="chip ${fk===c.k?'on':''}" onclick="setF('fk','${c.k}')">${c.label}</span>`).join('');

  const tierCell = (f,i)=>{

/* ---- 能力卡抽屉：四件套 + 三档刻度尺 + 锚点 ---- */
/* 一根尺：档 / 会做什么 / 精度 / 工具 / 明确的不会 / 简历锚点，全部落在一格里 */
function tierRuler(f){
  return `<div class="ruler">${(f.tiers||[]).map((x,i)=>{
    const gap = isGapTier(x);
    return `<div class="rl d${i+1} ${gap?'gap':''}">
      <div class="rl-h"><b>${esc(x.d)}</b><span>${esc(gradeName(x.d))}</span></div>
      <div class="rl-l">${gap?'（业务待补）':esc(x.label)}</div>
      <div class="rl-m">${esc(x.metric||'—')}</div>
      <div class="rl-d">${gap?'这一档还没有可验收的标准，暂时不能当门槛用。':esc(x.desc||'')}</div>
      ${x.limit&&x.limit!=='—'?`<div class="rl-x">明确的不会：${esc(x.limit)}</div>`:''}
      ${x.tool&&x.tool!=='—'?`<div class="rl-t">量具 · ${esc(x.tool)}</div>`:''}
      ${(x.anchors&&x.anchors.length)?`<div class="rl-a">${x.anchors.map(a=>`<em>${esc(a)}</em>`).join('')}</div>`:''}
    </div>`;
  }).join('')}</div>`;
}

function openTradeFactor(fid){
  window.__FE__ = null;
  const f = factorOf(fid);
  if(!f) return;
  const t = tradeOf(f.trade);
  const gapN = (f.tiers||[]).filter(isGapTier).length;

  const usedIn = PORTRAITS_V2.filter(p=>p.pick.some(x=>x[0]===fid))
    .map(p=>{ const pr = p.pick.find(x=>x[0]===fid);
      return `<span class="tg" style="padding:3px 8px;font-size:11.5px">${esc(p.name)} · 要 ${esc(pr[1])} · ${esc(pr[2])}</span>`; }).join('');

  openDrawer(`<div class="dr-h"><div><h3>${esc(f.id)} ${esc(f.name)}</h3>
      <div class="sub">${esc(t.name)} · ${esc(f.valueType)}型 · 算子 ${esc(f.operator)} · ${(f.tiers||[]).length-gapN}/3 档已写</div></div>
      <button class="dr-x" onclick="closeAll()">×</button></div>
    <div class="dr-b">
      <div class="sec"><div class="sec-t">${xpl('四件套（缺一件就算不出分）','因子定义')}</div>
        <dl class="kv">
          <div><dt>观察点</dt><dd>${esc(f.question)}</dd></div>
          <div><dt>值域</dt><dd>${esc(f.valueType)}：D1 → D3 三档，每档有语义</dd></div>
          <div><dt>来源</dt><dd>${esc(f.source)}</dd></div>
          <div><dt>算子</dt><dd class="mono">岗位要求 ${esc(f.operator)} 简历实际值</dd></div>
        </dl>
      </div>

      <div class="sec"><div class="sec-t">${xpl('三档刻度 · 一根尺上的三个刻度','三档刻度')}</div>
        ${tierRuler(f)}
        ${xpl(`<div class="note i" style="margin-top:10px">
          <b>为什么这三档不是三个标签、下面也不再分层。</b>
          三档写的是<b>同一个人在同一种能力上的不同水平</b>（会做 → 达标 → 精通），所以能比大小、能写「≥D2」，AI 才能算「超出要求一档」。
          如果是三个标签（"会划线""会锯削""会锉削"），只能勾选，勾不出高低。<br>
          再往下就不分层了：只有当某个子项<b>需要一套独立的验收标准</b>时才拆 —— 而且拆法是<b>横着拆成两条并列因子</b>（各自带三档），不是在这条下面再挂一层子级。原因是子级会让「≥某档」没法比较：一旦写成「P1 打表 ≥ 子级第 2 档」，换个工种、换条因子就没法对齐了。
        </div>`,'')}
        ${gapN?`<div class="note w" style="margin-top:10px">还有 ${gapN} 档没写（标斜纹的那格）。这一档现在不能当门槛用 —— 画像里引用它会直接判"无法验收"。</div>`:''}
      </div>

      <div class="sec"><div class="sec-t">被哪些画像引用</div>
        <div class="tags">${usedIn || '<span class="mut sm">暂无画像引用 —— 这条因子只做面试实操项</span>'}</div>
      </div>

      ${xpl(`<div class="note w">「明确的不会」这一行才是等级分界线：简历里出现上一档才该会的东西，说明这个人其实在更高一档，不能按低档定价。</div>`,'')}
    </div>
    <div class="dr-f"><button class="btn" onclick="closeAll()">关闭</button>
      <button class="btn pri" onclick="openFactorEdit('${f.id}')">编辑因子</button></div>`);
}

/* ============================================================
   编辑态 A：岗位画像
   改的是「引用」：加/减因子、调要求档、改分档
   不改的是「身份」：画像主键 (工种 × 等级)
   ============================================================ */
function openPortraitEdit(pid){
  const p = PORTRAITS_V2.find(x=>x.id===pid); if(!p) return;
  window.__PE__ = { pid, pick:p.pick.map(x=>x.slice()), pool:false };
  renderPortraitEdit();
}
function peSet(i, col, v){ window.__PE__.pick[i][col] = v; renderPortraitEdit(); }
function peDel(i){ window.__PE__.pick.splice(i,1); renderPortraitEdit(); }
function peAdd(fid){
  const st = window.__PE__;
  if(st.pick.some(x=>x[0]===fid)) return;
  st.pick.push([fid,'D1','必填']);
  st.pool = false; renderPortraitEdit();
}
function peTogglePool(){ window.__PE__.pool = !window.__PE__.pool; renderPortraitEdit(); }
function peCancel(){ const pid = window.__PE__.pid; window.__PE__ = null; openPortrait(pid); }
function peSave(){
  const st = window.__PE__;
  const p = PORTRAITS_V2.find(x=>x.id===st.pid); if(!p) return;
  if(!st.pick.length) return toast('至少保留 1 条因子');
  if(!st.pick.some(x=>x[2]==='PASS')) return toast('PASS 硬门槛不能为空');
  p.pick = st.pick.map(x=>x.slice());
  p.ver = bumpVer(p.ver);
  window.__PE__ = null;
  toast('已保存为 ' + p.ver + ' · 旧版本可查，已发出的确认单不回溯');
  go('portraits');
}
function bumpVer(v){
  const m = String(v||'v1.0').match(/v(\d+)\.(\d+)/);
  if(!m) return 'v1.1';
  return 'v' + m[1] + '.' + (Number(m[2])+1);
}

function renderPortraitEdit(){
  const st = window.__PE__;
  const p = PORTRAITS_V2.find(x=>x.id===st.pid); if(!p) return;
  const t = tradeOf(p.trade);
  const passN = st.pick.filter(x=>x[2]==='PASS').length;
  const mustN = st.pick.filter(x=>x[2]==='必填').length;
  const plusN = st.pick.filter(x=>x[2]==='加分').length;
  const canSave = st.pick.length>0 && passN>0;

  const rows = st.pick.map((x,i)=>{
    const f = factorOf(x[0]); const tr = tierOf(x[0], x[1]);
    return `<tr>
      <td class="mono xs mut">${String(i+1).padStart(2,'0')}</td>
      <td><b class="sm">${esc(f.name||x[0])}</b><div class="t-sub mono">${esc(x[0])} · 锁定</div></td>
      <td><select class="ed-in" onchange="peSet(${i},1,this.value)">
        ${['D1','D2','D3'].map(d=>`<option value="${d}" ${x[1]===d?'selected':''}>${d} ${esc(gradeName(d))}</option>`).join('')}
      </select></td>
      <td><select class="ed-in" onchange="peSet(${i},2,this.value)">
        ${['PASS','必填','加分'].map(g=>`<option value="${g}" ${x[2]===g?'selected':''}>${g}</option>`).join('')}
      </select></td>
      <td class="sm mut">${esc(tr.label||'—')}<div class="t-sub mono">${esc(tr.metric||'—')}</div></td>
      <td><span class="ed-del" onclick="peDel(${i})">移除</span></td>
    </tr>`;
  }).join('');

  const cands = factorsOfTrade(p.trade).filter(f=>!st.pick.some(x=>x[0]===f.id));
  const pool = st.pool ? `<div class="ed-pool">
    ${cands.length ? cands.map(f=>`<span class="pitem" onclick="peAdd('${f.id}')"><b>${esc(f.id)}</b>${esc(f.name)}</span>`).join('')
      : '<span class="sm mut">该工种全部因子都已选入</span>'}
  </div>
  <div class="t-sub" style="margin-top:6px">点一条即加入，默认落在「${esc(gradeName('D1'))} · 必填」，加进来后再调。</div>` : '';

  openDrawer(`<div class="dr-h"><div><h3>编辑 · ${esc(p.name)}</h3>
      <div class="sub">${esc(t.name)} × ${esc(p.grade)} ${esc(gradeName(p.grade))} · 当前 ${esc(p.ver)}</div></div>
      <button class="dr-x" onclick="peCancel()">×</button></div>
    <div class="dr-b">
      <div class="editbar"><b>编辑中</b><span>改动只影响这个画像的「要求」，不动因子本身的刻度</span></div>

      <div class="ed-lock"><span class="lk">锁定</span>
        <span>画像主键 <b>${esc(p.trade)} × ${esc(p.grade)}</b> 不可改 —— 改了就变成另一个画像，不是这个画像的新版本</span></div>

      <div class="sec"><div class="sec-t">画像条目（${st.pick.length} 条）</div>
        <div class="tbl-wrap"><table>
          <thead><tr><th>#</th><th>因子</th><th>要求档</th><th>分档</th><th>该档要求</th><th></th></tr></thead>
          <tbody>${rows || '<tr><td colspan="6" class="sm mut" style="padding:16px;text-align:center">还没有因子，从下面加</td></tr>'}</tbody></table></div>
        <div style="margin-top:10px;display:flex;gap:10px;align-items:center">
          <span class="ed-add" onclick="peTogglePool()">${st.pool?'收起候选':'＋ 添加因子'}</span>
          <span class="sm mut">候选来自「${esc(t.name)}」这个工种节点，不能跨工种挑</span>
        </div>
        ${pool}
        ${passN===0 ? `<div class="ed-warn">PASS 硬门槛是 0 条 —— 这个画像发出去没有任何一票否决项，等于不筛人。至少留 1 条。</div>`
          : `<div class="ed-ok">PASS ${passN} 条 · 必填 ${mustN} 条 · 加分 ${plusN} 条 · 合计 ${st.pick.length} 条</div>`}
      </div>

      <div class="sec"><div class="sec-t">保存后会发生什么</div>
        <div class="tbl-wrap"><table><tbody>
          <tr><td class="sm" style="width:130px">版本</td><td class="sm">${esc(p.ver)} → <b>${bumpVer(p.ver)}</b>，旧版本保留可查</td></tr>
          <tr><td class="sm">已发出的确认单</td><td class="sm">不回溯，仍按当时那一版判定</td></tr>
          <tr><td class="sm">未发出的需求</td><td class="sm">下次打分用新版本，旧评分失效</td></tr>
        </tbody></table></div>
      </div>
    </div>
    <div class="dr-f"><button class="btn" onclick="peCancel()">取消</button>
      <button class="btn pri" ${canSave?'':'disabled'} onclick="peSave()">保存为 ${bumpVer(p.ver)}</button></div>`);
}

function openFactorEdit(fid){
  const f = factorOf(fid); if(!f) return;
  window.__FE__ = { fid, question:f.question, tiers:(f.tiers||[]).map(x=>Object.assign({},x)) };
  renderFactorEdit();
}
function feSet(k,v){ window.__FE__[k] = v; }
function feTier(i,k,v){ window.__FE__.tiers[i][k] = v; }
function feCancel(){ const fid = window.__FE__.fid; window.__FE__ = null; openTradeFactor(fid); }
function feSave(){
  const st = window.__FE__;
  const f = factorOf(st.fid); if(!f) return;
  if(!String(st.question||'').trim()) return toast('观察点不能为空');
  const bad = st.tiers.find(x=>!String(x.label||'').trim());
  if(bad) return toast(bad.d + ' 档的「能做什么」不能为空');
  f.question = st.question;
  f.tiers = st.tiers.map(x=>Object.assign({},x));
  window.__FE__ = null;
  toast('刻度已更新 · 影响 ' + PORTRAITS_V2.filter(p=>p.pick.some(x=>x[0]===f.id)).length + ' 个画像');
  go('portraits');
}

/* =============================================================
   R01 · 要素清单（ElementList）—— 标准岗位标准下的「字段配置」
   -------------------------------------------------------------
   一份清单 = 一个工种 × 一个等级「要问哪些字段」。
   只记字段号，不存任何值 —— 值在「标准岗位标准」上填。

   注意：清单不再有独立菜单入口。
   因为一份清单就是一个标准岗位标准的字段骨架，列表页即「标准岗位标准」（pages-std.js）。
   这里只在标准岗位标准详情里点「基于清单」时进入，配置这一份清单勾哪些字段。
   ============================================================= */

function r01Elements(){
  const sid = S.f.el;
  /* 没有选中清单 → 回标准岗位标准列表，不再单独出一份清单列表 */
  if(!sid) return sjListPage();
  const s = elListOf(sid);
  if(!s.id){ S.f.el = null; return sjListPage(); }
  if(!window.__EL__ || window.__EL__.sid!==sid) elInit(sid);
  return elBody(s, window.__EL__);
}

/* ---------------- 编辑态 ---------------- */
function openElements(sid){
  S.page = 'elements';
  S.f.el = sid;
  S.f.sj = null;
  window.__EL__ = null;
  window.__SJ__ = null;
  closeAll();
  render();
}
function elBack(){ window.__EL__ = null; S.f.el = null; go('std'); }
function elInit(sid){
  const s = elListOf(sid);
  window.__EL__ = { sid, picks:s.picks.slice(), draft:s.picks.slice(), q:'', dirty:false };
}
function elPaint(){
  const m = document.getElementById('main');
  if(!m) return render();
  m.innerHTML = r01Elements();
}
function elQ(v){ window.__EL__.q = v; elPaint(); }
/* 勾 / 取消一个字段 */
function elTog(no){
  const d = window.__EL__;
  const i = d.draft.indexOf(no);
  if(i>=0) d.draft.splice(i,1); else d.draft.push(no);
  d.dirty = d.draft.slice().sort().join() !== d.picks.slice().sort().join();
  elPaint();
}
/* 整组全选 / 全不选 */
function elGroup(l2, on){
  const d = window.__EL__;
  const nos = F47_JOB.filter(x=>x.l2===l2).map(x=>x.no);
  if(on){ nos.forEach(n=>{ if(!d.draft.includes(n)) d.draft.push(n); }); }
  else { d.draft = d.draft.filter(n=>!nos.includes(n)); }
  d.dirty = d.draft.slice().sort().join() !== d.picks.slice().sort().join();
  elPaint();
}
function elCancel(){ const d = window.__EL__; d.draft = d.picks.slice(); d.dirty = false; elPaint(); }
function elSave(){
  const d = window.__EL__, s = elListOf(d.sid);
  s.picks = d.draft.slice();
  s.ver = bumpVer(s.ver);
  s.updated = '11-13';
  d.picks = d.draft.slice(); d.dirty = false;
  toast(`已保存为 ${s.ver} · 引用它的 ${listUsedBy(s.id)} 个标准岗位标准不回溯，旧评分失效`);
  elPaint();
}
function elNew(){ toast('新建标准岗位标准时一并建清单 —— 先选工种与等级，再从 47 项里框字段'); }

/* ---------------- 详情：只勾字段，不填值 ---------------- */
function elBody(s, d){
  const q = (d.q||'').trim().toLowerCase();
  const dirty = d.dirty;
  const users = stdsOfList(s.id);

  /* 按 6 个域 → 21 个组渲染，每组只列岗位级字段 */
  const blocks = F47_L1.map(dom=>{
    const groups = dom.groups.map(g=>{
      const items = F47_JOB.filter(f=>f.l2===g);
      if(!items.length) return '';
      const inGroup = items.filter(f=>!q || (f.name+f.vals.join('')).toLowerCase().includes(q));
      if(!inGroup.length) return '';
      const pickedN = items.filter(f=>d.draft.includes(f.no)).length;
      const all = pickedN===items.length;
      return `<div class="el-grp">
        <div class="el-grp-h">
          <b>${esc(g)}</b>
          <span class="sm mut">${pickedN}/${items.length}</span>
          <div class="sp"></div>
          <span class="el-grp-a" onclick="elGroup('${esc(g)}',${all?'0':'1'})">${all?'全不选':'全选'}</span>
        </div>
        <div class="el-fields">${inGroup.map(f=>{
          const on = d.draft.includes(f.no);
          return `<label class="el-f${on?' on':''}" onclick="elTog(${f.no})">
            <span class="el-no">${f.no}</span>
            <span class="el-fn">${esc(f.name)}</span>
            <span class="el-meta">${esc(GATE_OF_LEVEL[f.level]||'')} · ${esc(f.type)}</span>
          </label>`;
        }).join('')}</div>
      </div>`;
    }).join('');
    if(!groups) return '';
    const domN = F47_JOB.filter(f=>f.l1===dom.id).length;
    const domP = F47_JOB.filter(f=>f.l1===dom.id && d.draft.includes(f.no)).length;
    return `<div class="el-dom">
      <div class="el-dom-h"><span class="el-dom-m">${esc(dom.mark)}</span>
        <b>${esc(dom.name)}</b><span class="sm mut">${domP}/${domN}</span></div>
      ${groups}
    </div>`;
  }).join('');

  return `<div class="page">
    <div class="crumb"><span class="link" onclick="elBack()">← 标准岗位标准</span><span class="mut">/</span>
      <span class="link" onclick="openStd('${users[0]?users[0].id:''}')">${esc(users[0]?users[0].name:'标准岗位标准')}</span><span class="mut">/</span>
      <b>要素清单</b></div>
    ${head('要素清单 · '+esc(s.name),
      xpl('勾的就是这个标准岗位标准要问的字段。<b>这里没有值</b> —— 要问几档、什么范围，全在标准岗位标准上填。',
        esc(s.note||'')) + ` <span class="mono xs mut">${esc(s.id)} · ${esc(s.ver)} · ${esc(s.status)}</span>`,
      `<button class="btn" onclick="elCancel()" ${dirty?'':'disabled'}>放弃</button>
       <button class="btn pri" onclick="elSave()">保存为 ${esc(bumpVer(s.ver))}</button>`)}

    <div class="el-bar">
      <span class="b ${d.draft.length?'g':'n'}">已选 ${d.draft.length} / ${F47_JOB.length} 个岗位级字段</span>
      <span class="sm mut">一级 = PASS 硬门槛 · 二级 = 必填 · 三级 = 加分</span>
      ${dirty?'<span class="b a">有未保存改动</span>':''}
      <div class="sp"></div>
      <div class="search" style="width:200px"><span>⌕</span>
        <input placeholder="搜字段" value="${esc(d.q||'')}" oninput="elQ(this.value)"></div>
    </div>

    ${blocks || '<div class="tbl-wrap"><div class="empty">没有匹配的字段</div></div>'}

    <div class="note i" style="margin-top:14px">
      <b>为什么清单里不放值。</b>同一份「装配电工 大工」清单，兴禾要两班倒、思锐要长白班洁净区 —— 如果值写进清单，就得给每家客户各建一份清单，
      清单很快会变成几十份、没人维护。值放到标准岗位标准，清单只留一份。
      ${users.length>1?`<br>现在这份清单被 <b>${users.length}</b> 个标准岗位标准引用：${users.map(u=>esc(u.name)).join(' / ')}。`:''}
    </div>
    <div class="note w" style="margin-top:10px">
      <b>改这里会发生什么。</b>保存后清单版本 +1，引用它的 ${listUsedBy(s.id)} 个标准岗位标准会提示"基于旧版清单"；
      已发出的客户确认单<b>不回溯</b>，仍按当时那一版判定。
    </div>
  </div>`;
}

/* =============================================================
   R01 · 标准岗位标准（StdJob）
   -------------------------------------------------------------
   标准岗位标准 = 要素清单 + 标准值。
   清单决定"问哪些"，标准决定"要多少"。这一层是 5 家客户真实取值反推出来的。
   页面：列表页（标准列表）+ 详情（逐项填值）。

function r01StdJobs(){
  const sid = S.f.sj;
  if(!sid) return sjListPage();
  const s = stdOf(sid);
  if(!s.id){ S.f.sj = null; return sjListPage(); }
  if(!window.__SJ__ || window.__SJ__.sid!==sid) sjInit(sid);
  return sjBody(s, window.__SJ__);
}

/* ---------------- 列表 ---------------- */
function sjListPage(){
  const tr = S.f.sjtrade || '';
  const q = (S.f.sjq||'').trim().toLowerCase();

  let list = STD_JOBS.slice();
  if(tr) list = list.filter(x=>x.trade===tr);
  if(q) list = list.filter(x=>(x.name+x.id+x.from+x.trade+x.grade).toLowerCase().includes(q));

  const rows = list.map(s=>{
    const l = elListOf(s.list);
    const picked = (l.picks||[]).length;
    const filled = stdFilled(s);
    return `<tr class="clk" onclick="openStd('${s.id}')">
      <td><div class="t-name">${esc(s.name)}</div>
        <div class="t-sub mono">${esc(s.id)} · ${esc(s.ver)}</div></td>
      <td><span class="link" onclick="event.stopPropagation();openElements('${s.list}')">${esc(l.name||s.list)}</span>
        <div class="t-sub mono">${esc(s.list)}</div></td>
      <td><b class="sm">${filled}</b> <span class="sm mut">/ ${picked} 项已填标准值</span>
        <div class="t-sub">${filled===picked?'全部已定':(picked-filled)+' 项还空着'}</div></td>
      <td class="sm mut">${esc(s.from)}</td>
      <td>${s.status==='已发布'?'<span class="b g">已发布</span>':'<span class="b w">草稿</span>'}</td>
      <td onclick="event.stopPropagation()"><div class="acts">
        <span class="link" onclick="openStd('${s.id}')">看标准值</span>
      </div></td>
    </tr>`;
  }).join('');

  return `<div class="page">
    ${head('标准岗位标准', xpl('一行就是一个标准岗位标准：<b>一份要素清单 + 一套标准值</b>。清单说"要问年龄"，标准说"18–45"。<br>这一层的每一组值都是从 5 家客户真实需求单反推的，右侧可追溯到来源单。',
      '一个标准岗位标准 = 一份要素清单 + 一套标准值 · 需求只在这一层之上加人 / 时间 / 钱'),
      `<button class="btn" onclick="toast('已导出标准岗位标准')">导出</button><button class="btn pri" onclick="sjNew()">＋ 新建标准岗位标准</button>`)}
    ${toolbar({
      q:'搜索标准岗位标准 / 来源客户',
      filters:[{k:'sjtrade', opts:[{v:'',label:'全部工种'}].concat(['钳工','电工','数控','品质'].map(t=>({v:t,label:t})))}],
      right:`<span class="sm mut">${list.length} 个标准岗位标准 · 标准值来自 5 家客户</span>`
    })}
    <div class="tbl-wrap"><table>
      <thead><tr><th>标准岗位标准</th><th>基于清单</th><th>标准值</th><th>反推来源</th><th>状态</th><th>操作</th></tr></thead>
      <tbody>${rows || '<tr><td colspan="6" class="empty">没有匹配的标准岗位标准</td></tr>'}</tbody></table></div>
    ${pager(list.length)}
  </div>`;
}

/* ---------------- 编辑态 ---------------- */
function openStd(id){ S.f.sj = id; window.__SJ__ = null; closeAll(); render(); }
function sjBack(){ window.__SJ__ = null; S.f.sj = null; render(); }
function sjInit(sid){
  const s = stdOf(sid);
  window.__SJ__ = { sid, draft:JSON.parse(JSON.stringify(s.vals||{})), dirty:false };
}
function sjPaint(){
  const m = document.getElementById('main');
  if(!m) return render();
  m.innerHTML = r01StdJobs();
}
function sjSet(no, v){
  const d = window.__SJ__, s = stdOf(d.sid);
  d.draft[no] = v;
  d.dirty = JSON.stringify(d.draft) !== JSON.stringify(s.vals||{});
  sjPaint();
}
function sjCancel(){ const s = stdOf(window.__SJ__.sid); window.__SJ__.draft = JSON.parse(JSON.stringify(s.vals||{})); window.__SJ__.dirty = false; sjPaint(); }
function sjSave(){
  const d = window.__SJ__, s = stdOf(d.sid);
  s.vals = JSON.parse(JSON.stringify(d.draft));
  s.ver = bumpVer(s.ver);
  d.dirty = false;
  toast(`已保存为 ${s.ver} · 已发出的确认单不回溯，未发出的评分按新标准重算`);
  sjPaint();
}
function sjNew(){ toast('新建标准岗位标准：先选一份要素清单，再逐项填标准值'); }

/* ---------------- 机器视图：这份标准对应的能力画像 ----------------
   合并决议（2026-11-14 §AD）：画像不再有独立菜单，进标准岗位标准详情当「机器视图」。
   标准值是给人看的口径，画像是给机器算分的口径 —— 同一份能力的两种投影。
   匹配顺序：① id 直配（SJ-QG-D3 → PT-QG-D3）② 工种 × 等级 兜底（组长→D3 / 组员→D2）。 */
function portraitOfStd(s){
  const direct = (typeof PORTRAITS_V2!=='undefined') && PORTRAITS_V2.find(p=>p.id===String(s.id||'').replace('SJ-','PT-'));
  if(direct) return direct;
  const tMap = {'钳工':'T2-QG','电工':'T2-DG'};
  const gMap = {'大工':'D3','中工':'D2','小工':'D1','组长':'D3','组员':'D2'};
  const tid = tMap[s.trade], gd = gMap[s.grade];
  if(!tid || !gd || typeof PORTRAITS_V2==='undefined') return null;
  return PORTRAITS_V2.find(p=>p.trade===tid && p.grade===gd) || null;
}
function sjPortraitHtml(s){
  const p = portraitOfStd(s);
  if(!p) return `<div class="note i" style="margin-bottom:14px">
    <b>机器视图（能力画像）。</b>${esc(s.trade)} × ${esc(s.grade)} 还没有画像 —— 这个工种的能力刻度没建，AI 评分只能靠面试人工判定。去「人才画像因子库」补因子与档位。
  </div>`;
  const g = k => p.pick.filter(x=>x[2]===k).length;
  const metr = p.pick.filter(x=>hasMetric(tierOf(x[0],x[1]))).length;
  const tags = p.pick.map(x=>{
    const f = factorOf(x[0]); const tr = tierOf(x[0], x[1]);
    const gap = isGapTier(tr);
    const num = hasMetric(tr) ? tr.metric : null;
    const color = x[2]==='PASS'?'#A32D2D':x[2]==='加分'?'#3B6D11':'#185FA5';
    const bg = x[2]==='PASS'?'#FCEBEB':x[2]==='加分'?'#EAF3DE':'#E6F1FB';
    return `<span class="tg" style="padding:4px 9px;font-size:11.5px;background:${gap?'var(--bg2)':bg};border-color:${gap?'var(--warn-line)':color};color:${gap?'var(--warn)':color}">${esc(f.name||x[0])} ≥${esc(x[1])} · ${esc(num||tr.label||'待补')}</span>`;
  }).join('');
  return `<div class="card" style="margin-bottom:14px">
    <div class="card-h"><div>
      <h3>机器视图 · ${esc(p.name)} <span class="mono xs mut">${esc(p.id)} · ${esc(p.ver)}</span></h3>
      <div class="sub">上面的标准值是给人（客户/专员）看的口径，这张画像是给机器算分的口径 —— 同一份能力的两种投影，改一边要同步另一边。${metr}/${p.pick.length} 条带精度指标，其余靠面谈。</div>
    </div>
      <div style="display:flex;gap:6px;align-items:center;flex-shrink:0">
        <span class="b r">PASS ${g('PASS')}</span>
        <span class="b i">必填 ${g('必填')}</span>
        <span class="b g">加分 ${g('加分')}</span>
        <span class="link" style="margin-left:8px" onclick="openPortrait('${p.id}')">打开画像 →</span>
      </div></div>
    <div class="card-b"><div class="tags">${tags}</div></div>
  </div>`;
}

/* ---------------- 详情：逐项填值 ---------------- */
function sjBody(s, d){
  const l = elListOf(s.list);
  const picks = l.picks || [];
  const dirty = d.dirty;

  const blocks = F47_L1.map(dom=>{
    const groups = dom.groups.map(g=>{
      const items = picks.map(no=>f47Of(no)).filter(f=>f.l2===g);
      if(!items.length) return '';
      const rows = items.map(f=>{
        const v = d.draft[f.no];
        const empty = v==null || v==='' || (Array.isArray(v)&&!v.length);
        return `<tr>
          <td><span class="fid">${f.no}</span> <b class="sm">${esc(f.name)}</b>
            <div class="t-sub">${esc(f.type)} · ${esc(GATE_OF_LEVEL[f.level]||'')}</div></td>
          <td>${sjEditor(f, v)}</td>
          <td class="sm ${empty?'':'mut'}">${empty?'<span style="color:var(--warn)">未定</span>':esc(sjHint(f,v))}</td>
        </tr>`;
      }).join('');
      const done = items.filter(f=>d.draft[f.no]!=null).length;
      return `<div class="el-grp">
        <div class="el-grp-h"><b>${esc(g)}</b><span class="sm mut">${done}/${items.length}</span></div>
        <div class="tbl-wrap"><table class="sj-tbl"><tbody>${rows}</tbody></table></div>
      </div>`;
    }).join('');
    if(!groups) return '';
    return `<div class="el-dom">
      <div class="el-dom-h"><span class="el-dom-m">${esc(dom.mark)}</span><b>${esc(dom.name)}</b></div>
      ${groups}
    </div>`;
  }).join('');

  const filled = Object.keys(d.draft).filter(k=>d.draft[k]!=null && d.draft[k]!=='').length;

  return `<div class="page">
    <div class="crumb"><span class="link" onclick="sjBack()">← 标准岗位标准</span><span class="mut">/</span>
      <b>${esc(s.name)}</b></div>
    ${head('标准岗位标准 · '+esc(s.name),
      xpl('左边是要问的字段（来自要素清单），右边是<b>标准值</b>。改右边不动清单 —— 这就是"标准不可改、单可改"里先改标准的那一步。',

      5 家客户一共反推出 ${STD_JOBS.length} 份标准岗位标准，其中「装配电工 大工」被兴禾（42–44）与思锐（待报价）各用一次，价格不同、要求相近。

/* 值的编辑器：枚举 → select；区间 → input；多选 → 文本域（逗号分隔） */
function sjEditor(f, v){
  const isEnum = ['枚举','词表'].includes(f.type) && !Array.isArray(v);
  if(isEnum){
    const opts = (f.vals||[]).slice();
    const cur = v==null?'':String(v);
    if(cur && !opts.includes(cur)) opts.unshift(cur);
    return `<select class="ed-in" onchange="sjSet(${f.no},this.value)">
      <option value="" ${cur?'':'selected'}>— 未定 —</option>
      ${opts.map(o=>`<option value="${esc(o)}" ${o===cur?'selected':''}>${esc(o)}</option>`).join('')}
    </select>`;
  }
  if(Array.isArray(v) || f.type==='多选'){
    const cur = Array.isArray(v)? v.join(' · ') : (v||'');
    return `<input class="ed-in" value="${esc(cur)}" placeholder="多个值用 · 分隔"
      onchange="sjSet(${f.no}, this.value.split('·').map(x=>x.trim()).filter(Boolean))">`;
  }
  return `<input class="ed-in" value="${esc(v==null?'':v)}" placeholder="填标准值"
    onchange="sjSet(${f.no}, this.value)">`;
}
/* 值旁的第一句说明 */
function sjHint(f, v){
  if(f.type==='区间' && f.unit) return f.unit + ' · ' + (f.syn&&f.syn[0]?('客户原话：'+f.syn[0]):'');
  if(f.syn && f.syn.length) return '原话：' + f.syn[0];
  return f.talent ? '人才侧：' + f.talent : '';
}

    <div class="toolbar">

      <div class="chips">

          `<span class="chip ${sc===k?'on':''}" onclick="setF('dsc','${k}')">${esc(DD_SCOPE[k].name)} ${DICT_ITEMS.filter(x=>x.scope===k).length}</span>`).join('')}
