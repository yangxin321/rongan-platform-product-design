/* 可选值展示：几项就给几个标签，超过 5 个折叠 */
function ddVals(d){
  if(d.type==='数字') return '<span class="sm mut">—  填数字，无需选项</span>';
  if(d.type==='文本') return '<span class="sm mut">—  自由填写</span>';
  if(d.type==='区间'){
    return `<b class="sm mono">${esc(d.options[0]||'')}</b>`
      + (d.options.length>1?`<div class="t-sub">常用档：${esc(d.options.slice(1,4).join(' / '))}</div>`:'');
  }
  const show = d.options.slice(0,5);
  return `<div class="tags">${show.map(v=>`<span class="tg" style="padding:2px 7px;font-size:11.5px">${esc(v)}</span>`).join('')}
    ${d.options.length>5?`<span class="tg" style="padding:2px 7px;font-size:11.5px;color:var(--accent);border-color:var(--accent-line)">+${d.options.length-5}</span>`:''}</div>`;
}

/* ---------------- 编辑抽屉 ---------------- */
function ddEdit(code){
  const d = ddOf(code);
  if(!d.code) return toast('字典项不存在');
  window.__DD__ = { mode:'edit', code, draft:JSON.parse(JSON.stringify(d)) };
  ddPaint();
}
function ddNew(){
  window.__DD__ = { mode:'new', code:null, draft:{ code:'', name:'', type:'单选', scope:'job', options:[], note:'' } };
  ddPaint();
}
function ddPaint(){
  const w = window.__DD__, d = w.draft;
  openDrawer(`<div class="dr-h"><div><h3>${w.mode==='new'?'新增字段':'编辑 · '+esc(d.name)}</h3>
      <div class="sub">${w.mode==='new'?'建一个字段，填上它能选的值':'改完保存，全站下拉框立刻跟着变'}</div></div>
      <button class="dr-x" onclick="closeAll()">×</button></div>
    <div class="dr-b">
      <div class="frow">
        <div class="field"><label>字段名<i>*</i></label>
          <input id="ddName" value="${esc(d.name)}" placeholder="例：性别" oninput="ddSet('name',this.value)"></div>
        <div class="field"><label>编码<i>*</i></label>
          <input id="ddCode" class="mono" value="${esc(d.code)}" placeholder="例：SEX" ${w.mode==='new'?'':'disabled'} oninput="ddSet('code',this.value)"></div>
      </div>
      <div class="frow">
        <div class="field"><label>类型</label>
          <select onchange="ddSet('type',this.value)">
            ${DD_TYPE.map(t=>`<option ${d.type===t?'selected':''}>${t}</option>`).join('')}
          </select></div>
        <div class="field"><label>用处</label>
          <select onchange="ddSet('scope',this.value)">
            ${Object.keys(DD_SCOPE).map(k=>`<option value="${k}" ${d.scope===k?'selected':''}>${esc(DD_SCOPE[k].name)}</option>`).join('')}
          </select></div>
      </div>
      <div class="field"><label>可选值 · 一行一个<i>*</i></label>
        <textarea class="dd-ta" placeholder="男&#10;女&#10;男女不限" oninput="ddSet('options',this.value)">${esc(d.options.join('\n'))}</textarea>
        <div class="hint">${d.type==='区间'?'区间类第一行写范围（20-80 元/时），后面几行写常用档':d.type==='数字'||d.type==='文本'?'这两类不需要选项，留空即可':'保存后按这里的顺序出现在下拉框里'}</div></div>
      <div class="field"><label>说明</label>
        <input value="${esc(d.note||'')}" placeholder="可选，写一句口径" oninput="ddSet('note',this.value)"></div>
      ${w.mode==='edit'?`<div class="note w"><b>改值的影响。</b>已被需求引用的字段，删掉某个选项后历史需求仍保留原值，只在下拉框里不再出现。</div>`:''}
    </div>
    <div class="dr-f">
      <button class="btn" onclick="closeAll()">取消</button>
      <button class="btn pri" onclick="ddSave()">保存</button>
    </div>`);
}
function ddSet(k, v){
  const d = window.__DD__.draft;
  if(k==='options') d.options = String(v).split('\n').map(x=>x.trim()).filter(Boolean);
  else d[k] = v;
}
function ddSave(){
  const w = window.__DD__, d = w.draft;
  if(!d.name.trim()) return toast('字段名不能为空');
  if(!d.code.trim()) return toast('编码不能为空');
  if(w.mode==='new' && ddOf(d.code.trim()).code) return toast('编码已存在：'+d.code);

  const val = { code:d.code.trim(), name:d.name.trim(), type:d.type, scope:d.scope,
    options:d.options.slice(), note:(d.note||'').trim() };

  if(w.mode==='new'){ DICT_ITEMS.push(val); toast('已新增 '+val.name); }
  else {
    const i = DICT_ITEMS.findIndex(x=>x.code===w.code);
    if(i>=0) DICT_ITEMS[i] = val;
    toast('已保存 '+val.name);
  }
  window.__DD__ = null;
  closeAll();
  render();
}
function ddDel(code){
  const d = ddOf(code);
  if(!d.code) return;
  openModal(`<div class="md-h"><div><h3>删除字典项</h3>
      <p>确定删掉「${esc(d.name)}」吗？删了下拉框里就没有这个字段了</p></div>
      <button class="dr-x" onclick="closeAll()">×</button></div>
    <div class="md-b"><div class="note w"><b>${esc(d.code)}</b> · ${esc(d.type)} · ${d.options.length} 个可选值</div>
      <div class="t-sub" style="margin-top:8px">已经用它填过的需求单不会被清空，只是以后不能再选。</div></div>
    <div class="md-f"><button class="btn" onclick="closeAll()">取消</button>
      <button class="btn pri" onclick="ddDelDo('${d.code}')">确认删除</button></div>`);
}
function ddDelDo(code){
  const i = DICT_ITEMS.findIndex(x=>x.code===code);
  if(i>=0){ const n = DICT_ITEMS[i].name; DICT_ITEMS.splice(i,1); toast('已删除 '+n); }
  closeAll(); render();
}

/* ---------------- 表结构 ---------------- */
function ddSchema(){
  const fields = [
    ['id','bigint · 自增','主键'],
    ['code','varchar(32) · 唯一','字段编码，如 SEX / AGE / TRADE'],
    ['name','varchar(64)','字段名，如 性别 / 年龄区间'],
    ['type','varchar(16)','单选 · 多选 · 区间 · 词表 · 数字 · 文本'],
    ['options','json',"可选值，如 [\"男\",\"女\",\"男女不限\"]"],
    ['scope','varchar(16)','用处：job 岗位 / client 客户 / order 需求'],
    ['sort','int','下拉框里的排序'],
    ['status','tinyint','1 启用 · 0 停用'],
  ];
  const sql = `CREATE TABLE dict_item (
  id       bigint       PRIMARY KEY AUTO_INCREMENT,
  code     varchar(32)  NOT NULL UNIQUE COMMENT '字段编码',
  name     varchar(64)  NOT NULL        COMMENT '字段名',
  type     varchar(16)  NOT NULL        COMMENT '单选/多选/区间/词表/数字/文本',
  options  json                         COMMENT '可选值数组',
  scope    varchar(16)  NOT NULL        COMMENT 'job/client/order',
  sort     int          DEFAULT 0,
  status   tinyint      DEFAULT 1,
  KEY idx_scope (scope)
) COMMENT '数据字典：一行一个字段的取值集合';`;

  openModal(`<div class="md-h"><div><h3>这张表在数据库里长这样</h3>
      <p>dict_item · 全站下拉框只读这一张表</p></div>
      <button class="dr-x" onclick="closeAll()">×</button></div>
    <div class="md-b">
      <div class="tbl-wrap"><table><thead><tr><th>字段</th><th>类型</th><th>说明</th></tr></thead>
        <tbody>${fields.map(f=>`<tr><td class="mono sm">${f[0]}</td><td class="sm mut">${f[1]}</td><td class="sm">${esc(f[2])}</td></tr>`).join('')}</tbody>
      </table></div>
      <div style="margin-top:12px;font-family:var(--mono);font-size:11.5px;white-space:pre;overflow:auto;background:var(--bg2);border:1px solid var(--line2);border-radius:8px;padding:12px;line-height:1.75">${esc(sql)}</div>
      <div class="note i" style="margin-top:12px">
        <b>一个字段一行，值放 json。</b>选项少、改动少，不值得为值单开一张子表；
        真要拆就拆成 <span class="mono">dict_option(dict_id, value, sort)</span>，页面上其他都不变。
      </div>
    </div>
    <div class="md-f"><button class="btn" onclick="closeAll()">关闭</button>
      <button class="btn pri" onclick="toast('建表语句已复制')">复制建表语句</button></div>`, 'md-lg');
}

/* =============================================================
   新建需求 · 四步向导
   -------------------------------------------------------------
   录音定义（2026-11-13）：**需求 = 标准岗位标准 + 人 / 时间 / 钱**。

   ① 选对象：按工种分组，选一个「标准岗位标准」（显示版本 / 清单 / PASS 必填 加分）
   ② 看并改：把要素 + 标准值摊开，可逐项改；改动只存差异（本单快照），标准本身不动
   ③ 填三样：人数 / 最迟到岗 / 工期 / 工价（人 / 时间 / 钱）
   ④ 生成需求：需求 = 标准快照 + 本单差异 + 人/时间/钱

   旧版第一步选的是「岗位描述 JOB_DESCS」—— 那是上一代对象，与本层定义无关，已整条替换。
   ============================================================= */

const ND_STEPS = ['选标准岗位标准', '看并改', '人 / 时间 / 钱', '核对生成'];

/* ---------- 状态 ---------- */
function ndState(){
  if(!window.__ND__) ndInit('');
  return window.__ND__;
}
function ndReset(){ window.__ND__ = null; }
function ndInit(pre){
  window.__ND__ = {
    step:1, sid:'', draft:{}, dirty:{},
    client:'', project:'', people:'', price:'', city:'',
    deadline:'2026-12-25', term:'3 个月'
  };
  const sid = ndSidOf(pre);
  if(sid) ndLoad(sid);
  window.__ND__.step = 1;
  return window.__ND__;
}
/* pre 可能是标准岗位标准 id（SJ-），也可能是老调用方传的岗位描述 id（JD-），统一归一 */
function ndSidOf(pre){
  const cand = [pre, S.f && S.f.ndStd, S.f && S.f.ndJd].filter(Boolean);
  for(const c of cand){
    if(stdOf(c).id) return c;
    const m = stdOf(String(c).replace('JD-','SJ-'));
    if(m.id) return m.id;
  }
  return '';
}
function ndLoad(sid){
  const st = ndState(), s = stdOf(sid);
  st.sid = sid;
  st.draft = JSON.parse(JSON.stringify(s.vals||{}));
  st.dirty = {};
}
/* 统一入口：所有「新建需求 / 新建确认单 / 客户单转需求」都走这里 */
function ndEnter(pre, fill){
  ndInit(pre||'');
  const st = ndState();
  if(fill) Object.keys(fill).forEach(k=>{ if(fill[k]!=null && fill[k]!=='') st[k]=fill[k]; });
  ndPaint();
}
function ndPick(sid){
  if(ndState().sid === sid) return;
  ndLoad(sid);
  ndPaint();
}
function ndGo(n){
  ndSync();
  ndState().step = n;
  ndPaint();
}
function ndPaint(){
  openModal(ndHtml(), 'md-lg');
  const b = document.querySelector('.md-b');
  if(b) b.scrollTop = 0;
}
/* 把当前步的 DOM 值收回状态（跨步保持） */
function ndSync(){
  const st = ndState(), g = id => { const el = document.getElementById(id); return el ? el.value : null; };
  [['ndClient','client'],['ndProject','project'],['ndPeople','people'],['ndPrice','price'],
   ['ndCity','city'],['ndDeadline','deadline'],['ndTerm','term']].forEach(([id,k])=>{
    const v = g(id); if(v!=null) st[k] = v;
  });
}
/* 某一项改动后只刷该行标记与顶部条，不整块重绘 —— 避免输入框失焦 */
function ndSet(no, v){
  const st = ndState(), s = stdOf(st.sid), f = f47Of(no);
  const base = s.vals ? s.vals[no] : null;
  st.draft[no] = v;
  if(JSON.stringify(v) === JSON.stringify(base)) delete st.dirty[no];
  else st.dirty[no] = true;
  const m = document.getElementById('ndm-' + no);
  if(m) m.innerHTML = ndMark(f, base, v);
  const bar = document.getElementById('ndBar');
  if(bar) bar.innerHTML = ndBarInner(st);
}

/* ---------- 外壳 ---------- */
function ndHtml(){
  const st = ndState(), n = st.step, s = st.sid ? stdOf(st.sid) : {};
  const body = n===1 ? ndS1(st) : n===2 ? ndS2(st,s) : n===3 ? ndS3(st,s) : ndS4(st,s);
  const sub = ['先从标准库里挑一个，需求不能凭空建','标准值可以改 —— 改的只是这一单','人数、到岗时间、工期、工价',
    '核对：标准快照 + 本单调整 + 人/时间/钱'][n-1];
  return `<div class="md-h"><div><h3>新建需求 · 第 ${n} 步</h3><p>${sub}</p></div>
    <button class="dr-x" onclick="ndReset();closeAll()">×</button></div>
  <div class="md-b">${ndStepBar(st)}${body}</div>
  <div class="md-f">${ndFoot(st, s)}</div>`;
}
function ndStepBar(st){
  return `<div class="nd-steps">${ND_STEPS.map((t,i)=>{
    const k = i+1, cls = k===st.step ? 'on' : (k<st.step ? 'done' : '');
    return `<div class="nd-step ${cls}"><i>${k<st.step?'✓':k}</i><span>${t}</span></div>`;
  }).join('')}</div>`;
}
function ndFoot(st, s){
  const cancel = `<button class="btn" onclick="ndReset();closeAll()">取消</button>`;
  if(st.step===1){
    return `${cancel}<button class="btn pri${st.sid?'':' dis'}" onclick="${st.sid?'ndGo(2)':''}" ${st.sid?'':'disabled'}>下一步 · 看并改</button>`;
  }
  if(st.step===4){
    return `<button class="btn" onclick="ndGo(3)">← 上一步</button>
      <button class="btn pri" onclick="ndCreate()">生成需求</button>`;
  }
  return `<button class="btn" onclick="ndGo(${st.step-1})">← 上一步</button>
    <button class="btn pri" onclick="ndGo(${st.step+1})">下一步 · ${ND_STEPS[st.step]}</button>`;
}

/* ---------- 第 1 步：选标准岗位标准 ---------- */
function ndS1(st){
  const trades = [...new Set(STD_JOBS.map(x=>x.trade))];
  const groups = trades.map(t=>{
    const g = STD_JOBS.filter(x=>x.trade===t);
    return `<div class="nd-grp">
      <div class="nd-grp-h"><b class="sm">${esc(t)}</b><span class="xs mut">${g.length} 个标准岗位标准</span></div>
      <div class="nd-cards">${g.map(s=>ndCard(s, s.id===st.sid)).join('')}</div>
    </div>`;
  }).join('');

  return `<div class="frow">
      <div class="field"><label>客户</label><input id="ndClient" value="${esc(st.client)}" placeholder="例：立讯精密" onchange="ndState().client=this.value"></div>
      <div class="field"><label>项目</label><input id="ndProject" value="${esc(st.project)}" placeholder="例：3C非标设备售后运维" onchange="ndState().project=this.value"></div>
    </div>

function ndCard(s, on){

function ndMark(f, base, v){

/* 编辑器：枚举 → select；多选 → 文本域式输入；区间/数字 → input */
function ndEditor(f, v){
  const isEnum = ['枚举','词表'].includes(f.type) && !Array.isArray(v);
  if(isEnum){
    const opts = (f.vals||[]).slice(), cur = v==null?'':String(v);
    if(cur && !opts.includes(cur)) opts.unshift(cur);
    return `<select class="ed-in" onchange="ndSet(${f.no},this.value)">
      <option value="" ${cur?'':'selected'}>— 未定 —</option>
      ${opts.map(o=>`<option value="${esc(o)}" ${o===cur?'selected':''}>${esc(o)}</option>`).join('')}
    </select>`;
  }
  if(Array.isArray(v) || f.type==='多选'){
    const cur = Array.isArray(v) ? v.join(' · ') : (v||'');
    return `<input class="ed-in" value="${esc(cur)}" placeholder="多个值用 · 分隔"
      onchange="ndSet(${f.no}, this.value.split('·').map(x=>x.trim()).filter(Boolean))">`;
  }
  return `<input class="ed-in" value="${esc(v==null?'':v)}" placeholder="填这一单的值"
    onchange="ndSet(${f.no}, this.value)">`;
}

/* ---------- 生成 ---------- */
/* 条件的否定表达不是值，是「没有要求」：
   标准值里真实存在 26:['无强制证']（SJ-IQC-S2）、14:'无硬性要求'。
   不归一化就会造出一个名叫「无强制证」的必备证书，全员证书项进待确认（AGENTS R5）。 */
const ND_NONE = /^(无|无硬性|无硬性要求|不限|无要求|无证书要求|无强制证|无强制证书|无硬性证书|无需证书|不需要证书|不强制|无夜班)$/;
const ndIsNone = x => {
  const t = String(x == null ? '' : x).trim();
  /* 允许带括号说明：「无强制证（岗前培训即可）」同样是没有要求 */
  return ND_NONE.test(t) || ND_NONE.test(t.replace(/[（(][^()（）]*[)）]/g, '').trim());
};
const ndArr = v => {
  if(Array.isArray(v)) return v.map(x=>String(x).trim()).filter(x=>x && !ndIsNone(x));
  if(!v) return [];
  return String(v).split(/[、,，/;；·\s]+/).map(x=>x.trim()).filter(x=>x && !ndIsNone(x));
};

/* 条件快照：把「选中的标准岗位标准 + 本单调整」落成一份 gate。
   客户只读页与匹配都只读这一份 —— 不生成快照，缺的条件会被当成「无要求」，
   客户看到「—／无硬性要求／不需要夜班」，却不是自己填的那一套。 */
function ndGate(st, s){
  const val = no => {
    const v = st.draft[no];
    if(v === '' || v == null) return (s.vals||{})[no];
    return v;
  };
  const arr = ndArr;
  const raw = no => String(val(no)==null?'':val(no)).trim();

  /* 年龄：'18-45' / '18~40' / '不限' → [18,45] / null（null = 客户未设限，不参与否决）
     标准值里实际写的是 en dash（'18–45'，SJ-IQC-S2 等），只认 ASCII '-' 会把「客户明示上限」
     当成「无限制」，超过上限的人在年龄项被判符合（AGENTS R8）。破折号几种写法都要认。 */
  const ageRaw = raw(10);
  const m = ageRaw.match(/(\d{2})\s*[-–—−－~～至到]\s*(\d{2})/);
  let age = m ? [+m[1], +m[2]] : null;
  if(!age){
    /* 「45 岁以下 / 18 岁以上」也是客户明示条件，不能因为没有区间号就丢掉 */
    const hi = ageRaw.match(/(\d{2})\s*岁?\s*(以下|以内)/);
    const lo = ageRaw.match(/(\d{2})\s*岁?\s*(以上|起)/);
    if(hi) age = [0, +hi[1]];
    else if(lo) age = [+lo[1], 99];
  }

  /* 性别：只有明确「男 / 女」才是硬条件；「男女不限 / 女工优先」按不限处理 */
  const gRaw = raw(11);
  const gender = /^男$/.test(gRaw) ? '男' : /^女$/.test(gRaw) ? '女' : '不限';

  /* 夜班：两班倒 / 三班 / 常夜才需要确认夜班意愿，长白班 / 不限不需要 */
  const night = /两班倒|三班|四班|常夜|夜班/.test(raw(19)) ? '需要' : '不需要';

  /* 证书：**逐张**判断强制属性。
     第 26 项是多选，一段文本里可能既有「低压电工证（不强制）」又有「登高证」；
     按整段文本判断会把整单证书降成加分，连新加的必备证也一起被排除（R5 漏判）。
     这里拆成 cert（证名）+ certOpt（其中标了优先/加分的那几张），
     certMust 保留为兼容字段：全部都是必备时 true。 */
  const certRaw = raw(26);
  const certItems = ndArr(certRaw).map(txt => {
    const opt = /优先|非强制|不强制|加分|非必须/.test(txt);
    const name = String(txt).replace(/[（(][^()（）]*[)）]/g, '').trim() || String(txt).trim();
    return { name, must: !opt };
  });
  const cert = certItems.map(x => x.name);
  const certOpt = certItems.filter(x => !x.must).map(x => x.name);
  const certMust = certItems.length > 0 && certOpt.length === 0;

  return {
    city: st.city || '',
    age, ageRaw, gender, night,
    trade: raw(22) || s.trade || '',
    skill: arr(val(25)),
    cert, certMust, certOpt,
    arriveBy: st.deadline || '',
    /* 快照出处，便于回溯「这个值是从哪份标准、哪一版来的」 */
    from: {stdId:s.id, stdVer:s.ver, list:s.list, at:TODAY},
  };
}

function ndCreate(){
  ndSync();
  const st = ndState(), s = stdOf(st.sid);
  if(!s.id) return toast('还没选标准岗位标准');
  if(!st.people) return toast('还没填需求人数');

  const ov = Object.keys(st.dirty).map(no=>({no:+no, from:(s.vals||{})[no], to:st.draft[no]}));
  const req = [];
  const trade = st.draft[22] || s.trade, grade = st.draft[23] || s.grade;
  req.push(`${trade} · ${grade} · 独立作业`);
  if(Array.isArray(st.draft[25]) && st.draft[25].length) req.push('技能：' + st.draft[25].slice(0,5).join('、'));
  /* 「无强制证」不是证书名，不进需求摘要 */
  const reqCert = ndArr(Array.isArray(st.draft[26]) ? st.draft[26] : (s.vals||{})[26]);
  if(reqCert.length) req.push('证书：' + reqCert.join('、'));
  if(st.draft[29]) req.push(String(st.draft[29]));
  if(st.draft[19]) req.push('班制：' + st.draft[19]);

  const id = 'DX' + (DEMANDS.length + 1);
  DEMANDS.unshift({
    id, code: 'XQ-' + TODAY.replace(/-/g,'') + '-' + String(DEMANDS.length+1).padStart(2,'0'),
    client: st.client || '待定客户', cs: (st.client||'待定').slice(0,2), ps: trade,
    project: st.project || '待定项目', post: s.name, head: +st.people || 0, hired: 0,
    price: st.price || '待报价', city: st.city || '待定',
    deadline: st.deadline, valid: st.deadline + ' ~ 待定', confirm: '待客户确认',
    alloc: '未分配', status: '待客户确认', pinned: false, req,
    owner: S.who || '李文静', isNew: true,
    stdId: s.id, stdVer: s.ver, stdList: s.list, stdOverride: ov
  });
  ndReset();
  closeAll();
  /* v1.2：新需求=待客户确认，先立版本、再发受控只读链接；未确认前不生效
     条件快照必须当场生成：客户只读页、审核后的匹配读的都是这一份 */
  const gate = ndGate(st, s);
  DEMAND_GATE[id] = Object.assign({}, gate, {skill:gate.skill.slice(), cert:gate.cert.slice()});
  DEMAND_VERS[id] = [{v:'v1.0', status:'待客户确认', at:'2026-11-14 08:20',
    by:(S.who||'李文静')+'（代客户登记）', way:'链接已发出', n:47, note:'新建需求，客户尚未反馈', changes:[],
    audits:[], gate:Object.assign({}, gate, {skill:gate.skill.slice(), cert:gate.cert.slice()})}];
  MATCH_STAMP[id] = {ver:'—', at:'2026-11-14 08:20', stale:true};
  const tok = genLink(id, 'v1.0', S.who||'李文静');
  toast(`需求已生成：${s.name} · ${st.people} 人 · 标准 ${s.ver}${ov.length?' · 本单调整 '+ov.length+' 项':''} · 待客户确认 · 链接 ${tok}`);
  go('demands');
}

/* ---------- 需求详情里的「标准快照」段 ---------- */
function stdSection(d, bare){

  const ov = d.stdOverride || [];

  const stale = s.ver && d.stdVer && s.ver !== d.stdVer;
  const inner = `<div style="background:#fff;border:1px solid var(--line);border-radius:9px;padding:12px 14px">
      <div class="sm"><b>${esc(s.name || d.post)}</b>

      <div class="xs mut" style="margin-top:3px">基于岗位要素清单 <span class="mono">${esc(d.stdList||'')}</span> · ${picks} 项</div>
      ${stale? `<div class="note w" style="margin-top:8px">标准已升版到 <b>${esc(s.ver)}</b>，本单仍按 ${esc(d.stdVer)} 算 —— 历史评分不回溯。</div>`:''}
      <div style="margin-top:9px">
        <div class="xs mut" style="margin-bottom:4px">本单调整 ${ov.length} 项${ov.length?'，其余同标准':'，整单沿用标准值'}</div>
        ${ov.map(o=>`<div class="sm" style="padding:5px 0;border-bottom:1px solid var(--line2)">
          <span class="b a">已改</span> <b>${esc(f47Of(o.no).name)}</b>
          <span class="xs mut">　${esc(stdVal(o.no,o.from)||'未定')} → ${esc(stdVal(o.no,o.to)||'未定')}</span></div>`).join('')}
      </div>
    </div>`;
  return bare ? inner : `<div class="sec"><div class="sec-t">标准岗位标准（本单快照）</div>${inner}</div>`;
}


/* ===== 客户需求确认（V16–V22）=====
   把「客户嘴里的话」变成「能进系统的结构化要求」。
   链路顺序固定：先收话 → 再成单 → 后建需求（不能反）。
*/

/* 「AI 解析」用的第二段示例：演示增量合并（同一条覆盖、新条追加、已 ✔ 的不许被冲掉） */

function setCust(n){ S.f.cust = n; refreshTable(); }

/* 增量合并：同一条覆盖、新条追加、已 ✔ 的不许被冲掉（V19） */
function custParse(name){
  const c = custOf(name);
  const more = PARSE_MORE[name];
  if(!more){ toast('这一段没解析出内容'); return; }
  if(c.segs.some(s=>s.at===more.at)){ toast('这一段已经解析过了'); return; }
  c.segs.push({ at:more.at, src:more.src, txt:more.txt });
  let cover = 0, add = 0, keep = 0;
  more.items.forEach(ni=>{
    const old = c.items.find(x=>x.k===ni.k);
    if(!old){ c.items.push(ni); add++; }
    else if(old.st==='ok'){ keep++; }            /* 已明确的绝不被覆盖 */
    else {
      old.v = ni.v; old.st = ni.st; old.raw = ni.raw; old.std = ni.std; old.q = ni.q;
      old.fill = (old.fill||1)+1;                 /* 第 2 次补填留痕 */
      cover++;
    }
  });
  c.upd = '11-13 15:32';
  refreshTable();
  toast(`已合并第 ${c.segs.length} 段：覆盖 ${cover} 项、新增 ${add} 项、已明确的 ${keep} 项未被覆盖`);
}

/* 一键生成问客户的话术（V18）—— 不留话术，运营还得自己想怎么问 */
function custScript(name){
  const c = custOf(name), gaps = custGaps(c), st = custStat(c);
  const lines = gaps.map((g,i)=>{
    const tag = g.st==='none' ? '还没提到' : g.st==='vague' ? '说法判不了' : '缺具体数字';
    return `${i+1}. ${g.k}（${tag}）：${g.q||'您这边具体是什么要求？'}`;
  }).join('\n');
  const head = `${c.customer} · ${c.post} 这一单，还有 ${gaps.length} 项想跟您对一下：`;
  const tail = `\n\n这些定下来我这边就能出确认单，工价按 ${(c.items.find(x=>x.k==='工价')||{}).v||'谈好的价格'} 走。`;
  openModal(`<div class="md-h"><div><h3>问客户的话术</h3>
      <p>${esc(c.customer)} · ${esc(c.post)} · ${gaps.length} 项待补，其中必填 ${st.blocked} 项</p></div>
      <button class="dr-x" onclick="closeAll()">×</button></div>
    <div class="md-b">
      <pre class="script" id="scriptTxt">${esc(head + '\n' + lines + tail)}</pre>
      <div class="note i">按「未提必填 → 模糊 → 缺值」排的序，一次问完不返工。话术可直接复制发微信。</div>
    </div>
    <div class="md-f"><button class="btn" onclick="closeAll()">关闭</button>
      <button class="btn pri" onclick="toast('话术已复制，可直接发微信')">复制话术</button></div>`, 'md-lg');
}

function custPromote(name){
  const c = custOf(name);
  const oks = c.items.filter(i=>i.st==='ok'&&!i.std2);
  if(!oks.length){ toast('没有可提升的明确项'); return; }
  oks.forEach(i=>{ i.std2 = true; });
  refreshTable();
  toast(`已把 ${oks.length} 条明确口径提交审核 —— 审核通过后进因子库 / 要素池，并标「已标准化」`);
}

function custToConfirm(name){
  const c = custOf(name), st = custStat(c);
  if(st.blocked){
    openModal(`<div class="md-h"><div><h3>还不能出确认单</h3>
      <p>${esc(c.customer)} · ${esc(c.post)} 还有 ${st.blocked} 条必填项没定</p></div>
      <button class="dr-x" onclick="closeAll()">×</button></div>
    <div class="md-b">
      <div class="note w">先收话 → 再成单 → 后建需求，顺序不能反。这 ${st.blocked} 条必填没定就出确认单，等于把"不知道"写进合同。</div>
      <div style="margin-top:10px">${custGaps(c).filter(g=>g.req).map(g=>`<div class="sm" style="padding:5px 0;border-bottom:1px solid var(--line2)"><span class="b r">必填</span> ${esc(g.k)} · ${esc(g.q||'')}</div>`).join('')}</div>
    </div>
    <div class="md-f"><button class="btn" onclick="closeAll()">关闭</button>
      <button class="btn pri" onclick="closeAll();custScript('${esc(name)}')">生成话术去问</button></div>`);
    return;
  }
  toast(`已生成确认单：${c.customer} · ${c.post}（打印用，客户线下确认后由我方登记）`);
}
function custToDemand(name){
  const c = custOf(name);
  const jd = custToJd(name);
  S.f.ndJd = jd;
  closeAll();
  ndEnter(jd, {client:c.customer||name, project:c.project||c.post||''});
  toast(`已按「${c.post}」带出标准岗位标准，第 2 步可逐项改`);
}
/* 客户口径 → 选哪份标准描述（船厂电工≈电工大工；3C 售后≈钳工中工） */
function custToJd(name){
  if(name==='江南造船') return 'JD-DG-D3';
  if(name==='立讯精密') return 'JD-QG-D2';
  return 'JD-QG-D2';
}

/* 记面试结果：通过 → 进待入职；未通过 → 已淘汰但留痕 */
function itvMark(pid, r){
  const p = P(pid); if(!p) return;
  if(r==='pass'){ p.node='面试通过'; p.itvAt = TODAY+' 14:00'; toast(`${p.name} · 面试通过，等客户确认后转待入职`); }
  else { p.node='已淘汰'; p.status='无意向'; p.itvFail=true; p.itvAt = TODAY+' 14:00';
    p.reason = p.reason || '面试未通过'; toast(`${p.name} · 面试未通过，已记录（可回查，不再进漏斗）`); }
  render();
}

/* 本单调整（覆盖标准值，但不改标准本身）；字段格式与新建向导一致：{no, from, to} */
const DEMAND_OVERRIDE = {
  D1:[{no:3, from:'中山兴禾厂区', to:'东莞·松山湖', why:'客户指定驻场厂区', at:'2026-11-10'},

      {no:32, from:'42–44 元/时', to:'32-38 元/时', why:'客户报价，按售后岗定', at:'2026-11-10'}],
  D7:[{no:7, from:'2026-11-25', to:'2026-12-01', why:'客户放宽到岗时间', at:'2026-11-12'},
      {no:32, from:'50 元/时', to:'30-36 元/时', why:'客户改工价', at:'2026-11-12'}],
  D8:[{no:32, from:'36–38 元/时', to:'26-30 元/时', why:'新单报价', at:'2026-11-01'}],
};
DEMANDS.forEach(d=>{ if(DEMAND_OVERRIDE[d.id]) d.stdOverride = DEMAND_OVERRIDE[d.id]; });

const overrideOf = (d, no) => (d.stdOverride||[]).find(x=>x.no===no) || null;
function effVal(d, no){
  const o = overrideOf(d, no);
  if(o) return {v:o.to, from:'order'};
  const s = stdOf(d.stdId);
  if(s && s.vals && s.vals[no]!=null) return {v:stdVal(no, s.vals[no]), from:'std'};
  return {v:'—', from:'none'};
}

/* 客户对某一项的确认状态（演示口径：由需求整体确认状态推导） */
function confStateOf(d, no){
  const f = f47Of(no);
  const pv = pendingVer(d);
  const touched = pv && (pv.changes||[]).some(c=> f.name && (f.name.includes(c.f) || c.f.includes(f.name)));
  if(d.confirm === '待客户确认') return 'pending';
  if(d.confirm === '变更待重确认') return touched ? 'pending' : 'agree';
  return 'agree';
}
function confTag(st){
  return st==='agree' ? '<span class="b g">同意</span>'
       : st==='pending' ? '<span class="b w">待客户确认</span>'
       : '<span class="b n">—</span>';
}

    <div style="margin-top:2px">${rows}</div>`;
}

function regSave(did, ver){
  const g = id => { const el = document.getElementById(id); return el ? el.value.trim() : ''; };
  const rec = {
    id:newRegId(), demandId:did, ver:ver,
    fbPerson:g('rg_fbPerson'), fbChannel:g('rg_fbChannel'), fbAt:g('rg_fbAt'),
    fbContent:g('rg_fbContent'), fbAttach:g('rg_fbAttach'),
    regBy:g('rg_regBy'), regAt:g('rg_regAt'), audit:'待审核',
  };
  const miss = regMissing(rec);
  const err = [];
  if(miss.length) err.push(`还有 ${miss.length} 项没填：${miss.join('、')}`);
  /* 时间按值比，不按字符串比；格式不合法直接拦下，不猜 */
  const fbOk = !!normTs(rec.fbAt), rgOk = !!normTs(rec.regAt);
  if(rec.fbAt && !fbOk) err.push('反馈发生时间格式不对，应为 2026-11-13 09:12');
  if(rec.regAt && !rgOk) err.push('登记时间格式不对，应为 2026-11-13 09:12');
  if(fbOk && rgOk){
    const ord = tsOrderOk(rec.fbAt, rec.regAt);
    if(!ord.ok) err.push(ord.why);
    rec.fbAt = normTs(rec.fbAt);
    rec.regAt = normTs(rec.regAt);
  }
  if(err.length){
    const box = document.getElementById('rg_err');
    if(box) box.innerHTML = `<div class="note r">${err.map(esc).join('<br>')}</div>`;
    toast('登记未保存：'+err[0]);
    return;
  }
  /* 上一轮的退回意见已经追加在 version.audits 里，这里不再覆盖写 prevAudit —— 
     退回几轮就留几条，补充送审不清空历史。 */
  addReg(rec);
  const d = D(did), v = versOf(d).find(x=>x.v===ver);
  if(v){
    v.status = '待内部审核'; v.audit = '待审核'; v.auditNote = ''; v.auditBy = ''; v.auditAt = '';
  }
  if(!activeVer(d)) d.confirm = '待内部审核';
  closeAll(); refreshTable();
  toast(`已代登记 ${rec.id}，${ver} 送内部审核（审核通过前不生效）`);
}

function auditDrawer(did){
  const d = D(did);

  const r = lastReg(d.id, v.v);
  const miss = regMissing(r);
  openDrawerW(`<div class="dr-h"><div><h3>内部审核 · ${esc(d.post)}</h3>
    <div class="sub">${esc(d.client)} · ${esc(v.v)} · 审核人 ${esc(S.who||'王浩')}</div></div>
    <button class="dr-x" onclick="closeAll()">×</button></div>
  <div class="dr-b">
    <div class="note" style="margin-bottom:14px">审核的不是「客户有没有同意」，而是<b>这条代登记是否站得住</b>：客户是谁、什么时候说的、原话是什么、有没有可查的依据、改的值是否写死。<b>依据不全不得通过。</b></div>
    ${r?regTable(r):`<div class="note r">该版本没有代登记记录，不能审核通过。</div>`}
    ${(v.changes||[]).length?`<div class="sec"><div class="sec-t">本版变更 ${v.changes.length} 项</div>
      <div class="tbl-wrap" style="border-radius:9px"><table><thead><tr><th>字段</th><th>旧值</th><th>新值</th></tr></thead>
        <tbody>${v.changes.map(c=>`<tr><td class="sm">${esc(c.f)}</td><td class="sm mut">${esc(c.from)}</td><td class="sm"><b>${esc(c.to)}</b></td></tr>`).join('')}</tbody></table></div></div>`:''}
    <div class="sec"><div class="sec-t">审核结论</div>
      <div class="field"><label>退回原因（选「退回」时必填）</label>
        <textarea id="au_note" placeholder="例：反馈未落到具体日期，且缺客户原话截图"></textarea></div>
      <div class="note w">退回后该版本标记「已退回」，不生效；旧版 ${esc((activeVer(d)||{}).v||'—')} 继续作为匹配依据。补充反馈后可再次送审。</div>
    </div>
  </div>

      onclick="auditAct('${d.id}','pass')">审核通过并生效</button>

/* 每轮审核都追加到 version.audits，并把结论回写到被审的那条代登记记录 ——
   退回几轮就留几轮意见，补充送审不清历史。 */
function auditAppend(v, rec, act, by, at, note){
  v.audits = Array.isArray(v.audits) ? v.audits : [];
  v.audits.push({act, by, at, note, reg: rec ? rec.id : null});
  if(rec){
    rec.audit = act==='pass' ? '已通过' : '已退回';
    rec.auditBy = by; rec.auditAt = at; rec.auditNote = note;
  }
  return v.audits[v.audits.length-1];
}

function auditAct(did, act){
  const d = D(did), v = openVer(d);
  if(!v) return toast('没有待审核的版本');
  const r = lastReg(d.id, v.v), miss = regMissing(r);
  const at = nowTs(), by = S.who || '王浩';
  if(act === 'pass'){
    if(miss.length) return toast('缺 '+miss.length+' 项登记依据，不能通过：'+miss[0]);
    /* 送审时校验过的时间，通过时再校验一次：记录可能被后续改动 */
    const ord = tsOrderOk(r.fbAt, r.regAt);
    if(!ord.ok) return toast('该登记记录不可通过：'+ord.why);
    versOf(d).forEach(x=>{ if(x.status==='生效') x.status = '已被取代'; });
    v.status = '生效'; v.audit = '已通过'; v.auditBy = by; v.auditAt = at;
    v.auditNote = '代登记依据齐全，第 '+(r?r.id:'—')+' 条记录与变更项一致';
    auditAppend(v, r, 'pass', by, at, v.auditNote);
    v.by = (r?r.regBy:by)+'（代客户登记）'; v.way = r?r.fbChannel:'—'; v.at = r?r.regAt:at;
    d.confirm = '已确认';
    MATCH_STAMP[did] = {ver:v.v, at:at, stale:true};
    closeAll(); refreshTable();
    toast(`${v.v} 已生效；匹配结果标为「需更新」`);
    return;
  }
  const note = (document.getElementById('au_note')||{}).value || '';
  if(!note.trim()) { toast('退回必须写原因'); return; }
  v.status = '已退回'; v.audit = '已退回'; v.auditBy = by; v.auditAt = at; v.auditNote = note.trim();
  auditAppend(v, r, 'back', by, at, note.trim());
  if(!activeVer(d)) d.confirm = '已退回';
  closeAll(); refreshTable();
  toast(`${v.v} 已退回，需补充客户依据后重新送审`);
}

/* ---------- 登记动作 ----------
   v1.2 修订：不再「点一下直接生效」。
   代登记 → 待内部审核 → 审核通过才生效；依据不全时既不能送审也不能通过。 */
function confirmReg(did, act){
  const d = D(did);
  if(act === 'ok'){ return regDrawer(did); }
  /* 已有未结版本（待客户确认 / 待重新确认 / 待内部审核 / 已退回）时不再生成新版本。
     否则第二次点会算出同一个 v2.0，追加两个同号版本：regSave 用 find 取第一个送审，
     openVer / auditAct 取最后一个审核 —— 被送审和被审核不是同一个对象（AGENTS R2）。 */
  const ov = openVer(d);
  if(ov){
    toast(`已有未结版本 ${ov.v}（${ov.status}），请先完成该版的客户反馈 → 代登记 → 内部审核，再发起下一次变更`);
    return openVers(did);
  }
  /* 标记条件变更 */
  showAsk('标记为「条件已变更，需重新确认」','变更后旧的客户确认作废，需生成新版本重新走「客户反馈 → 我方代登记 → 内部审核」；已发出的匹配结果同时失效。', ()=>{
    /* 弹窗停留期间状态可能变化（如另一处已生成版本），落笔前再确认一次 */
    if(openVer(d)){ closeAll(); toast('已有未结版本，未重复生成'); return openVers(did); }
    const cur = activeVer(d);
    const base = cur ? cur.v : 'v1.0';
    const next = 'v'+(Number(String(base).replace('v','').split('.')[0])+1)+'.0';
    versOf(d).push({v:next, status:'待重新确认', audit:'未送审', at:nowTs(), by:'金诚', way:'待客户反馈',
      n:47, note:'我方发起变更，等待客户反馈', audits:[],
      changes:[{f:'工效条款', from:'按原版本', to:'待客户确认'}],
      /* 新版条件先留在待确认版本上；生效前不参与匹配（gateOf 读的是生效版本） */
      gate:(function(g){ return Object.assign({}, g, {skill:(g.skill||[]).slice(), cert:(g.cert||[]).slice()}); })(gateOf(d))});
    d.confirm = activeVer(d) ? '变更待重确认' : '待客户确认';
    MATCH_STAMP[did] = {ver:base, at:nowTs(), stale:true};
    closeAll(); refreshTable();
    toast('已生成 '+next+'，状态改为「变更待重确认」；匹配结果需更新');
  });
}
